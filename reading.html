<style>

  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;
  --correct:#71C9A0;--correct-soft:#1E2E27;--wrong:#E88C7A;--wrong-soft:#33221E;--warn:#E3B062;--warn-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --paper:#191713;--ink:#ECE6D9;--muted:#A69D8B;--line:#38322A;--card:#242019;
  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.7;letter-spacing:-.01em;
  padding:clamp(1rem,4vw,3rem) 1rem 5rem}
.wrap{max-width:48rem;margin:0 auto}
.wrap.narrow{max-width:42rem}
a{color:var(--accent)}
h1,h2,h3{font-family:"Gowun Batang",serif;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.5rem);font-weight:800;line-height:1.15}
h2{font-size:1.35rem;font-weight:700;margin-bottom:.2rem}
h3{font-size:1.08rem;font-weight:700}
p{margin:.3rem 0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--accent);

.eyebrow.gold{color:var(--green)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--muted);font-size:.95rem}
.small{font-size:.85rem}
header.page{margin-bottom:1.6rem}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(1.2rem,4vw,1.9rem);margin-bottom:1rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field>label{font-size:.9rem;font-weight:700}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:-.2rem}
input[type=text],input[type=email],input[type=password],textarea,select{
  font-family:inherit;font-size:1rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
textarea{resize:vertical;min-height:4.2rem;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:2.5px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);
  border:none;border-radius:10px;padding:.62rem 1.25rem;transition:opacity .15s,transform .06s;display:inline-block}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);opacity:1}
.btn.danger{background:transparent;color:var(--wrong);border:1.5px solid var(--line)}
.btn.small{padding:.4rem .8rem;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--correct);border-color:var(--correct)}
.pill.no{color:var(--wrong);border-color:var(--wrong)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chip{font-family:inherit;font-size:.85rem;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .8rem;

.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.card:has(> .story){background:var(--beige)}
input[type=text].blank{font-family:inherit;line-height:1.4;vertical-align:baseline;font-size:.98rem;color:var(--accent);font-weight:600;background:var(--accent-soft);
  border:none;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:.05rem .35rem;margin:0 .15rem;
  width:auto;min-width:5.5em;max-width:100%}
.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
.filled{display:inline;border-radius:6px;padding:.05rem .35rem;margin:0 .1rem;font-weight:600}
.filled.ok{background:var(--correct-soft);color:var(--correct)}
.filled.chk{background:var(--warn-soft);color:var(--warn)}
input[type=text].blank.retry{border-bottom-color:var(--wrong);background:var(--wrong-soft);color:var(--ink)}
.filled.none{background:var(--wrong-soft);color:var(--wrong)}
.key{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:.15rem}
.qnum{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.qtext{font-family:"Gowun Batang",serif;font-size:1.05rem;font-weight:700;line-height:1.55;margin:.15rem 0 .55rem}

.feedback{margin-top:.6rem;border-left:3px solid var(--green);background:var(--beige);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.92rem}

.blank-stat{border-top:1px solid var(--line);padding:.8rem 0}
.blank-stat .head{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}

.blank-stat .rate{margin-left:auto;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}

.mini{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.35rem;font-size:.88rem}
.mini span{border-radius:7px;padding:.1rem .45rem}
.mini .ok{background:var(--correct-soft);color:var(--correct)}
.mini .chk{background:var(--warn-soft);color:var(--warn)}

.mini button.acc{font-family:inherit;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;margin-left:.25rem;cursor:pointer}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:.4rem 0}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;vertical-align:-1px;margin-right:.25rem}
.topic{padding:.7rem 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:none}
.topic .t{font-size:1rem;font-weight:500}
.topic .by{font-size:.8rem;color:var(--muted)}
.quote{font-family:"Gowun Batang",serif;font-size:1rem;line-height:1.6;border-left:3px solid var(--line);padding:.1rem 0 .1rem .85rem;margin:.5rem 0 .2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.7rem;margin:1rem 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:.7rem .9rem}
.stat .n{font-family:"Gowun Batang",serif;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.76rem;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:none}
.mark.ok{color:var(--correct);font-weight:700}
.mark.no{color:var(--wrong);font-weight:700}
.sec-edit{border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;background:var(--paper)}
.box-edit{border:1px solid var(--line);border-radius:10px;padding:.9rem;margin:.7rem 0;background:var(--card)}
.q-edit{border:1px dashed var(--line);border-radius:10px;padding:.7rem;margin:.5rem 0}
.note{font-size:.88rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.demo-bar{background:var(--beige);color:var(--ink);border:1px solid var(--green);border-radius:10px;padding:.55rem .9rem;font-size:.85rem;margin-bottom:1.2rem}
.err{color:var(--wrong);font-size:.88rem;margin-top:.4rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
.foot{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(2rem);background:var(--ink);
  color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;font-size:.9rem;font-weight:600;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--wrong)}
.dlg-back{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:60}
.dlg{background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem;max-width:26rem;width:100%}
.dlg p{margin:0 0 1.1rem;white-space:pre-wrap;font-size:1rem}
.dlg textarea{margin-bottom:1rem}
@media (max-width:520px){ .ans{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== 설정 ===== */
var SUPABASE_URL = "https://yqwexzzdamcpqmsqkbcg.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_Y2bK2lw2T_Wysf9WWPuDbg_eA1ZX7R0";

var PARAMS = new URLSearchParams(location.search);
// ?demo=1 이거나 파일을 더블클릭해서 열면 → Supabase 없이 이 기기 안에서만 체험
var DEMO = PARAMS.has("demo") || location.protocol === "file:";

/* ===== 공용 헬퍼 ===== */
var app = document.getElementById("app");
var pageHeader = document.getElementById("pageHeader");
var pageFoot = document.getElementById("pageFoot");

function el(tag, attrs, kids){
  var n = document.createElement(tag); attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "value") n.value = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
var _toastT;
function toast(msg, bad){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(_toastT); _toastT = setTimeout(function(){ t.className = ""; }, 3200);
}
// 브라우저 확인 창(confirm) 대신 쓰는 앱 안 확인 창 — confirm 이 막힌 브라우저에서도 동작
function askBox(msg, okText){
  return new Promise(function(resolve){
    var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });
    function done(v){ back.remove(); resolve(v); }
    var ok = el("button", { class: "btn", text: okText || "확인", onclick: function(){ done(true); } });
    back.appendChild(el("div", { class: "dlg" }, [ el("p", { text: msg }),
      el("div", { class: "row", style: "justify-content:flex-end" }, [
        el("button", { class: "btn ghost", text: "취소", onclick: function(){ done(false); } }), ok ]) ]));
    back.addEventListener("click", function(e){ if (e.target === back) done(false); });
    back.addEventListener("keydown", function(e){ if (e.key === "Escape") done(false); });
    document.body.appendChild(back); ok.focus();
  });
}
function showCopyBox(text){
  var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });
  var ta = el("textarea", { readonly: "readonly", style: "min-height:6rem" }); ta.value = text;
  back.appendChild(el("div", { class: "dlg" }, [ el("p", { text: "아래 내용을 복사하세요 (Ctrl+C)." }), ta,
    el("div", { class: "row", style: "justify-content:flex-end" }, [ el("button", { class: "btn", text: "닫기", onclick: function(){ back.remove(); } }) ]) ]));
  document.body.appendChild(back); ta.focus(); ta.select();
}
function fmtTime(iso){
  var d = new Date(iso), p = function(x){ return String(x).padStart(2,"0"); };
  return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function lsGet(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function trimStr(s){ return String(s == null ? "" : s).trim(); }
function textBlock(s){ var d = el("div", { style: "white-space:pre-wrap" }); d.textContent = s; return d; }
function studentLink(id){ return location.href.split(/[?#]/)[0] + "?book=" + id + (DEMO ? "&demo=1" : ""); }
function copyText(text, msg){
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function(){ toast(msg || "복사했어요"); }, function(){ showCopyBox(text); });
  else showCopyBox(text);
}

/* ----- 빈칸: 줄거리 안의 [정답] ----- */
var BLANK_RE = /\[([^\]]+)\]/g;
function keysOf(text){ var out = [], m; BLANK_RE.lastIndex = 0; while ((m = BLANK_RE.exec(text || ""))) out.push(m[1]); return out; }
function stripKeys(text){ return String(text || "").replace(BLANK_RE, "[]"); }
function sectionKeys(sec){ var k = []; ((sec && sec.boxes) || []).forEach(function(b){ k = k.concat(keysOf(b.text)); }); return k; }
function sectionQuestions(sec){ var q = []; ((sec && sec.boxes) || []).forEach(function(b){ q = q.concat(b.questions || []); }); return q; }
function blankCount(sec){ // 학생용(정답이 [] 로 바뀐) 줄거리에서 세기
  var n = 0; ((sec && sec.boxes) || []).forEach(function(b){ n += String(b.text || "").split("[]").length - 1; }); return n;
}
function norm(s){ return String(s || "").replace(/[\s.,·…‘’“”'"!?~()\-]/g, ""); }
// 빈칸 정답 형식: [정답] · [정답|다른 정답] · [정답@핵심어,핵심어·바꿔쓸말]
//   @ 뒤 핵심어: 쉼표(,)로 나눈 말은 모두 들어가야 하고, 가운뎃점(·)으로 나눈 말은 하나만 있으면 됨
//   (어미·시제·조사·띄어쓰기는 상관없이 책 내용이 맞는지만 봄)
// 결과: "ok" 맞음 · "chk" 다시 쓰기 · "none" 안 씀    — reading.sql 의 blank_ok 와 같은 규칙
function grade(ans, key){
  var a = norm(ans);
  if (!a) return "none";
  key = String(key || "");
  var at = key.indexOf("@");
  if (at !== -1){
    var groups = key.slice(at + 1).split(",");
    var all = groups.every(function(g){
      return g.split("·").some(function(alt){ alt = norm(alt); return alt && a.indexOf(alt) !== -1; });
    });
    return all ? "ok" : "chk";
  }
  var hit = key.split("|").some(function(k){
    k = norm(k); if (!k) return false;
    return a === k || a.indexOf(k) !== -1 || (k.indexOf(a) !== -1 && a.length >= Math.ceil(k.length * 0.6));
  });
  return hit ? "ok" : "chk";
}
// 선생님이 "인정"한 답(accept: { 빈칸번호: 정규화한 답 })이면 맞음
function gradeA(ans, key, accept, i){
  var a = norm(ans);
  if (a && accept && accept[i] === a) return "ok";
  return grade(ans, key);
}
function displayKey(k){ return String(k).split("@")[0].split("|")[0]; }

/* ===== 샘플: 몽실언니 (초6 · 4주) — 선생님 교재 「즐거운 문학 읽기」 학생용·교사용에서 옮김 ===== */
var MONGSIL = {
  title: "몽실언니", author: "권정생 글 · 이철수 그림 · 창비", grade: "초등 6학년",
  sections: [
    { title: "1주차", range: "‘아버지를 버리고’부터 ‘까치바위골 할아버지’까지", boxes: [
      { heading: "아버지를 버리고",
        text: "한 달 전 돈 벌러 집을 나간 아버지를 두고 몽실의 엄마는 몽실이를 데리고 도망가듯 집을 떠나 다른 남자와 결혼을 한다.",
        questions: [
          { prompt: "① 밀양댁은 왜 몽실이의 아버지를 버리고 다른 남자와 결혼을 했나요? 여러분은 밀양댁의 행동에 대해 어떻게 생각하나요?", model: "굶주림을 견디다 못해서." },

/* ===== 데이터 계층 =====
   같은 함수 이름으로 Supabase(실제) / 체험(이 기기 저장) 두 가지를 제공합니다. */
function unwrap(res){ if (res.error) throw new Error(res.error.message || "오류가 발생했습니다."); return res.data; }

function supabaseApi(){
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return {
    getUser: async function(){ var r = await db.auth.getSession(); return r.data.session ? r.data.session.user : null; },
    onAuth: function(cb){ db.auth.onAuthStateChange(function(_e, s){ cb(s ? s.user : null); }); },
    signIn: async function(email, pw){ unwrap(await db.auth.signInWithPassword({ email: email, password: pw })); },
    signOut: async function(){ await db.auth.signOut(); },
    listBooks: async function(){ return unwrap(await db.from("books").select("*").order("created_at", { ascending: false })); },
    createBook: async function(user, b){
      return unwrap(await db.from("books").insert({ owner: user.id, title: b.title, author: b.author || "", grade: b.grade || "", sections: b.sections || [] }).select().single());
    },
    getBook: async function(id){ return unwrap(await db.from("books").select("*").eq("id", id).single()); },
    updateBook: async function(id, patch){ unwrap(await db.from("books").update(patch).eq("id", id)); },
    deleteBook: async function(id){ unwrap(await db.from("books").delete().eq("id", id)); },
    listEntries: async function(bookId){ return unwrap(await db.from("entries").select("*").eq("book_id", bookId)); },
    setFeedback: async function(id, feedback, checked){ unwrap(await db.from("entries").update({ feedback: feedback, checked: checked }).eq("id", id)); },
    deleteEntry: async function(id){ unwrap(await db.from("entries").delete().eq("id", id)); },
    setAccept: async function(id, accept){ unwrap(await db.rpc("set_blank_accept", { p_entry_id: id, p_accept: accept })); },
    publicBook: async function(id){ return unwrap(await db.rpc("get_book", { p_book_id: id })); },
    submitEntry: async function(bookId, section, kind, name, data){
      return unwrap(await db.rpc("submit_entry", { p_book_id: bookId, p_section: section, p_kind: kind, p_name: name, p_data: data }));
    },
    myEntries: async function(bookId, name){ return unwrap(await db.rpc("get_my_entries", { p_book_id: bookId, p_name: name })); },
    blankStatus: async function(bookId, section, name){ return unwrap(await db.rpc("get_blank_status", { p_book_id: bookId, p_section: section, p_name: name })); },
    submitBlanks: async function(bookId, section, name, answers){ return unwrap(await db.rpc("submit_blanks", { p_book_id: bookId, p_section: section, p_name: name, p_answers: answers })); },
    subscribe: function(bookId, cb){
      var ch = db.channel("entries-" + bookId)
        .on("postgres_changes", { event: "*", schema: "public", table: "entries", filter: "book_id=eq." + bookId }, function(){ cb(); })
        .subscribe();
      return function(){ db.removeChannel(ch); };
    }
  };
}

    if (!e) return { stage: 0 };
    var keys = sectionKeys(book(bookId).sections[section]);

    return { stage: stage, first: e.data.first || [], second: e.data.second || null, marks: marks,
      keys: stage === 2 ? keys.map(function(k, i){ return marks[i] ? null : displayKey(k); }) : null };
  }
  var listeners = [];
  function notify(){ listeners.forEach(function(f){ f(); }); }
  window.addEventListener("storage", function(e){ if (e.key === KEY){ S = lsGet(KEY) || S; notify(); } });
  return {
    getUser: async function(){ return USER; },

    signIn: async function(){},

    listBooks: async function(){ return clone(S.books).sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; }); },
    createBook: async function(_u, b){ var n = { id: uid(), owner: USER.id, title: b.title, author: b.author || "", grade: b.grade || "", sections: clone(b.sections || []), is_open: true, created_at: now() }; S.books.push(n); save(); return clone(n); },
    getBook: async function(id){ return clone(book(id)); },
    updateBook: async function(id, patch){ Object.assign(book(id), clone(patch)); save(); },
    deleteBook: async function(id){ S.books = S.books.filter(function(b){ return b.id !== id; }); S.entries = S.entries.filter(function(e){ return e.book_id !== id; }); save(); },
    listEntries: async function(bookId){ return clone(S.entries.filter(function(e){ return e.book_id === bookId; })); },
    setFeedback: async function(id, feedback, checked){ var e = S.entries.find(function(x){ return x.id === id; }); if (e){ e.feedback = feedback; e.checked = checked; save(); } },
    deleteEntry: async function(id){ S.entries = S.entries.filter(function(e){ return e.id !== id; }); save(); },
    setAccept: async function(id, accept){ var e = S.entries.find(function(x){ return x.id === id; }); if (e){ e.data.accept = clone(accept); save(); } },
    publicBook: async function(id){ var b = book(id); if (!b.is_open) throw new Error("선생님이 아직 열지 않은 책입니다."); return stripped(b); },
    submitEntry: async function(bookId, section, kind, name, data){
      var b = book(bookId); if (!b.is_open) throw new Error("선생님이 닫은 책입니다.");
      name = trimStr(name); if (!name) throw new Error("이름을 입력하세요.");

      if (e){ e.data = clone(data); e.updated_at = now(); e.checked = false; }

      save(); notify(); return { id: e.id };
    },

    blankStatus: async function(bookId, section, name){ return status(bookId, section, trimStr(name)); },
    submitBlanks: async function(bookId, section, name, answers){
      var b = book(bookId); if (!b.is_open) throw new Error("선생님이 닫은 책입니다.");
      name = trimStr(name); if (!name) throw new Error("이름을 입력하세요.");
      var keys = sectionKeys(b.sections[section]);
      var e = find(bookId, section, "blanks", name);
      if (!e){
        S.entries.push({ id: uid(), book_id: bookId, section: section, kind: "blanks", student_name: name, data: { first: answers.slice() }, feedback: "", checked: false, created_at: now(), updated_at: now() });
      } else {
        if (e.data.second) throw new Error("이미 두 번 제출했어요.");
        e.data.second = keys.map(function(k, i){ var f = e.data.first[i] || ""; return gradeA(f, k, e.data.accept, i) === "ok" ? f : (answers[i] || ""); });
        e.updated_at = now(); e.checked = false;
      }
      save(); notify();
      return status(bookId, section, name);
    },
    subscribe: function(_id, cb){ listeners.push(cb); return function(){ listeners = listeners.filter(function(f){ return f !== cb; }); }; }
  };
}

/* ================= 학생 ================= */
function runStudent(bookId){
  document.getElementById("wrap").classList.add("narrow");
  pageFoot.textContent = "내가 쓴 글은 선생님만 볼 수 있어요. 친구들의 생각은 수업 시간에 함께 들어요.";
  if (DEMO) document.getElementById("demoBar").appendChild(el("a", { class: "btn ghost small", href: location.href.split(/[?#]/)[0] + "?demo=1#book=" + bookId, text: "← 선생님 화면으로", style: "text-decoration:none;margin-bottom:1rem" }));
  var BOOK = null, NAME = lsGet("reading-name") || "", MY = {};
  var SEC = lsGet("reading-sec:" + bookId) || 0, TAB = "bookmark";

  init();

  async function init(){
    try { BOOK = await api.publicBook(bookId); }
    catch(e){ app.innerHTML = ""; app.appendChild(el("div", { class: "empty", text: e.message || "책을 열 수 없습니다." })); return; }
    if (SEC >= BOOK.sections.length) SEC = 0;
    pageHeader.innerHTML = "";
    pageHeader.appendChild(el("div", { class: "eyebrow", text: (BOOK.grade ? BOOK.grade + " · " : "") + "독서 기록" }));
    pageHeader.appendChild(el("h1", { text: BOOK.title }));
    if (BOOK.author) pageHeader.appendChild(el("p", { class: "sub", text: BOOK.author }));
    if (NAME) await loadMine();
    render();
  }

  async function loadMine(){
    MY = {};
    try { (await api.myEntries(bookId, NAME)).forEach(function(e){ MY[e.section + ":" + e.kind] = e; }); }
    catch(e){ toast(e.message, true); }
  }
  function draftKey(kind){ return "reading-draft:" + bookId + ":" + NAME + ":" + SEC + ":" + kind; }

  function render(){
    app.innerHTML = "";
    if (!NAME) return renderName();

    var top = el("div", { class: "card" }, []);
    top.appendChild(el("div", { class: "spread" }, [
      el("h2", { text: NAME + " 학생" }),
      el("button", { class: "btn ghost small", text: "이름 바꾸기", onclick: function(){ NAME = ""; lsDel("reading-name"); render(); } })
    ]));
    var chips = el("div", { class: "chips", "aria-label": "주차" }, []);
    BOOK.sections.forEach(function(s, i){
      var done = MY[i + ":bookmark"] && MY[i + ":blanks"];
      chips.appendChild(el("button", { class: "chip" + (i === SEC ? " on" : ""), text: s.title + (done ? " ✓" : ""),
        onclick: function(){ SEC = i; lsSet("reading-sec:" + bookId, i); render(); } }));
    });
    top.appendChild(chips);
    var sec = BOOK.sections[SEC];
    if (sec && sec.range) top.appendChild(el("div", { class: "range" }, [ el("b", { text: "읽을 범위 " }), sec.range ]));
    app.appendChild(top);

    var tabs = el("div", { class: "tabs", role: "tablist" }, []);
    [["bookmark", "나의 책갈피"], ["blanks", "내용 이해"], ["answers", "생각하기 (결석했을 때)"]].forEach(function(t){
      tabs.appendChild(el("button", { class: "tab" + (TAB === t[0] ? " on" : ""), role: "tab", text: t[1], onclick: function(){ TAB = t[0]; render(); } }));
    });
    app.appendChild(tabs);

    if (TAB === "blanks") renderBlanks();
    else if (TAB === "bookmark") renderBookmark();
    else renderAnswers();
  }

  function renderName(){
    var card = el("div", { class: "card" }, []);
    card.appendChild(el("h2", { text: "이름을 적어 주세요" }));
    card.appendChild(el("p", { class: "sub", text: "다음에도 똑같은 이름으로 들어와야 내가 쓴 글을 다시 볼 수 있어요." }));
    var inp = el("input", { type: "text", id: "sName", placeholder: "예) 김하늘", autocomplete: "off", maxlength: "40" });
    var errb = el("div", { class: "err" });
    async function go(){
      var v = trimStr(inp.value);
      if (!v){ errb.textContent = "이름을 입력하세요."; return; }
      NAME = v; lsSet("reading-name", v);
      await loadMine(); render();
    }
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
    card.appendChild(el("div", { class: "field", style: "margin-top:1rem" }, [ el("label", { for: "sName", text: "이름" }), inp ]));
    card.appendChild(el("button", { class: "btn", text: "시작하기", onclick: go }));
    card.appendChild(errb);
    app.appendChild(card);
    inp.focus();
  }

  function teacherNote(entry){
    if (!entry) return null;
    var kids = [];
    if (entry.checked) kids.push(el("span", { class: "lab", text: "선생님 확인 완료" }));
    else if (entry.feedback) kids.push(el("span", { class: "lab", text: "선생님 한마디" }));
    if (entry.feedback) kids.push(textBlock(entry.feedback));
    return kids.length ? el("div", { class: "feedback" }, kids) : null;
  }

  /* ----- 내용 이해: 박스 줄거리 속 빈칸 -----
     0단계 처음 풀기 → 1단계 맞고 틀림만 보고 틀린 칸만 다시 쓰기 → 2단계 그래도 틀린 칸만 정답 */
  async function renderBlanks(){
    var sec = BOOK.sections[SEC];
    var total = blankCount(sec);
    if (!total){ app.appendChild(el("div", { class: "empty", text: "이 주차에는 빈칸 문제가 없어요." })); return; }
    var holder = el("div", {}, [ el("div", { class: "empty", text: "불러오는 중…" }) ]);
    app.appendChild(holder);
    var ST;
    try { ST = await api.blankStatus(bookId, SEC, NAME); }
    catch(e){ holder.innerHTML = ""; holder.appendChild(el("div", { class: "err", text: e.message })); return; }
    holder.innerHTML = "";
    var saved = MY[SEC + ":blanks"];
    var stage = ST.stage || 0;
    var first = ST.first || [], fin = ST.second || first, marks = ST.marks || [];
    var okN = marks.filter(Boolean).length;
    var draft = stage === 0 ? "blanks" : "blanks2";
    var d = lsGet(draftKey(draft)) || {};
    var inputs = [];     // { idx, el }

    // 위쪽 안내
    var head = el("div", { class: "card" }, []);
    if (stage === 0){
      head.appendChild(el("p", { class: "note", style: "margin:0", text: "책을 꼼꼼히 읽고 빈칸을 채워요. 제출하면 맞았는지만 알려 줘요. 틀린 칸은 책을 다시 찾아보고 한 번 더 고칠 수 있어요." }));
    } else if (stage === 1){
      head.appendChild(el("h3", { text: total + "개 중 " + okN + "개 맞았어요" }));
      head.appendChild(el("p", { class: "sub", text: "빨간 칸 " + (total - okN) + "개를 책에서 다시 찾아 고쳐 써요. 다시 냈는데도 틀리면 그때 정답을 보여 줘요." }));
    } else {
      var firstOk = ST.second ? null : okN;
      head.appendChild(el("h3", { text: okN === total && !ST.second ? "처음부터 모두 맞았어요!" : "끝 · " + total + "개 중 " + okN + "개 맞음" }));
      head.appendChild(el("p", { class: "sub", text: okN === total ? "책을 정확하게 읽었어요." : "회색 글씨가 정답이에요. 그 부분을 책에서 다시 읽어 보세요." }));
      if (firstOk == null) head.appendChild(el("div", { class: "legend" }, [ legend("var(--correct-soft)", "맞음"), legend("var(--wrong-soft)", "틀림 → 정답") ]));
    }
    var note = teacherNote(saved); if (note) head.appendChild(note);
    holder.appendChild(head);

    // 줄거리 + 빈칸
    var idx = 0;
    (sec.boxes || []).forEach(function(b){
      var parts = String(b.text || "").split("[]");
      if (parts.length < 2) return;            // 빈칸 없는 박스는 내용 이해에서 생략
      var card = el("div", { class: "card" }, []);
      if (b.heading) card.appendChild(el("div", { class: "box-h", text: b.heading }));
      var story = el("div", { class: "story" }, []);
      parts.forEach(function(p, i){
        story.appendChild(document.createTextNode(p));
        if (i === parts.length - 1) return;
        var n = idx++;
        if (stage === 0 || (stage === 1 && !marks[n])){
          var prev = d.answers ? d.answers[n] : (stage === 1 ? first[n] : "");
          var inp = el("input", { type: "text", class: "blank" + (stage === 1 ? " retry" : ""), "aria-label": "빈칸 " + (n + 1) + (stage === 1 ? " 다시 쓰기" : ""), autocomplete: "off" });
          inp.value = prev || "";
          fit(inp);
          inp.addEventListener("input", function(){ fit(inp); saveDraft(); count(); });
          inputs.push({ idx: n, el: inp });
          story.appendChild(inp);
        } else if (marks[n]){
          story.appendChild(el("span", { class: "filled ok", text: trimStr(fin[n]) }));
        } else {
          story.appendChild(el("span", { class: "filled none", text: trimStr(fin[n]) || "(안 씀)" }));
          if (ST.keys && ST.keys[n]) story.appendChild(el("span", { class: "key", text: "→ " + ST.keys[n] }));
        }
      });
      card.appendChild(story);
      holder.appendChild(card);
    });
    if (stage === 2) return;

    function saveDraft(){
      var a = (d.answers || []).slice();
      inputs.forEach(function(x){ a[x.idx] = x.el.value; });
      d.answers = a; lsSet(draftKey(draft), d);
    }
    var bar = el("div", { class: "card" }, []);
    var cnt = el("p", { class: "sub" });
    function count(){ cnt.textContent = (stage === 0 ? "빈칸 " : "다시 쓸 칸 ") + inputs.length + "개 중 " + inputs.filter(function(x){ return trimStr(x.el.value); }).length + "개를 채웠어요."; }
    count();
    var msg = el("div", { class: "err" });
    var btn = el("button", { class: "btn", text: stage === 0 ? "제출하기" : "고쳐서 다시 제출" });
    btn.addEventListener("click", async function(){
      msg.textContent = "";
      var answers = [];
      for (var i = 0; i < total; i++) answers.push(stage === 0 ? "" : (fin[i] || ""));
      inputs.forEach(function(x){ answers[x.idx] = trimStr(x.el.value); });
      var empty = inputs.filter(function(x){ return !trimStr(x.el.value); }).length;
      var ask = stage === 0
        ? (empty ? "빈칸 " + empty + "개를 아직 안 채웠어요. 그래도 제출할까요?" : "제출할까요?")
        : "다시 내면 더 고칠 수 없고, 그래도 틀린 칸은 정답이 보여요. 제출할까요?";
      if (!(await askBox(ask, stage === 0 ? "제출하기" : "다시 제출"))) return;
      btn.disabled = true;
      try {
        await api.submitBlanks(bookId, SEC, NAME, answers);
        lsDel(draftKey(draft)); await loadMine();
        toast(stage === 0 ? "제출했어요" : "다시 냈어요"); render();
      } catch(e){ btn.disabled = false; msg.textContent = e.message; }
    });
    bar.appendChild(cnt); bar.appendChild(btn); bar.appendChild(msg);
    holder.appendChild(bar);
  }
  function fit(inp){ inp.style.width = Math.max(5.5, Math.min(30, (inp.value || "").length * 1.05 + 1.5)) + "em"; }
  function legend(color, label){ return el("span", {}, [ el("i", { style: "background:" + color }), label ]); }

  /* ----- 나의 책갈피 ----- */
  function renderBookmark(){
    var saved = MY[SEC + ":bookmark"];
    var d = lsGet(draftKey("bookmark")) || (saved ? saved.data : {});
    var card = el("div", { class: "card" }, []);
    card.appendChild(el("p", { class: "note", text: "읽으면서 마음에 들어온 문장과 함께 이야기하고 싶은 것을 적어요. 수업 시간에 친구들 앞에서 발표해요." }));
    var fields = [
      ["sentence", "내 마음에 들어온 문장", "내 마음을 표현한, 누군가에게 들려주고 싶은, 멋있거나 색다른 표현 등…", true],
      ["page", "쪽수", "", false],
      ["why", "이 문장을 고른 까닭", "", true],
      ["topic", "함께 이야기하고 싶은 것", "인물, 주제, 교훈 등…", true]
    ];
    var inputs = {};
    fields.forEach(function(f){
      var inp = f[3] ? el("textarea", { id: "bm-" + f[0] }) : el("input", { type: "text", id: "bm-" + f[0], style: "max-width:8rem", inputmode: "numeric" });
      inp.value = d[f[0]] || "";
      inp.addEventListener("input", function(){ var o = {}; Object.keys(inputs).forEach(function(k){ o[k] = inputs[k].value; }); lsSet(draftKey("bookmark"), o); });
      inputs[f[0]] = inp;
      card.appendChild(el("div", { class: "field" }, [
        el("label", { for: "bm-" + f[0], text: f[1] }),
        f[2] ? el("div", { class: "hint", text: f[2] }) : null,
        inp
      ]));
    });
    var msg = el("div", { class: "err" });
    var btn = el("button", { class: "btn", text: saved ? "고쳐서 다시 저장" : "책갈피 저장하기" });
    btn.addEventListener("click", async function(){
      msg.textContent = "";
      var data = {}; Object.keys(inputs).forEach(function(k){ data[k] = trimStr(inputs[k].value); });
      if (!data.sentence){ msg.textContent = "마음에 들어온 문장을 적어 주세요."; return; }
      if (!data.topic){ msg.textContent = "함께 이야기하고 싶은 것을 적어 주세요."; return; }
      btn.disabled = true;
      try {
        await api.submitEntry(bookId, SEC, "bookmark", NAME, data);
        lsDel(draftKey("bookmark")); await loadMine();
        toast("책갈피를 저장했어요. 이제 내용 이해를 풀어요"); TAB = "blanks"; render();
      } catch(e){ btn.disabled = false; msg.textContent = e.message; }
    });
    card.appendChild(el("div", { class: "row" }, [ btn, saved ? el("span", { class: "sub small", text: "저장함 · " + fmtTime(saved.updated_at) }) : null ]));
    card.appendChild(msg);
    var note = teacherNote(saved); if (note) card.appendChild(note);
    app.appendChild(card);
  }

  /* ----- 생각하기 (결석 보강) ----- */
  function renderAnswers(){
    var sec = BOOK.sections[SEC];
    var qs = sectionQuestions(sec);
    if (!qs.length){ app.appendChild(el("div", { class: "empty", text: "이 주차에는 생각하기 문제가 없어요." })); return; }
    app.appendChild(el("p", { class: "note", text: "생각하기는 수업 시간에 교재로 해요. 결석했을 때만 여기에 써서 내세요." }));
    var saved = MY[SEC + ":answers"];
    var d = lsGet(draftKey("answers")) || (saved ? saved.data : {});
    var vals = (d.answers || []).slice();
    var areas = [];
    (sec.boxes || []).forEach(function(b){
      if (!(b.questions || []).length) return;
      var card = el("div", { class: "card" }, []);
      if (b.heading) card.appendChild(el("div", { class: "box-h", text: b.heading }));
      b.questions.forEach(function(q){
        var i = areas.length;
        card.appendChild(el("div", { class: "qtext", text: q.prompt }));
        var ta = el("textarea", { "aria-label": q.prompt });
        ta.value = vals[i] || "";
        ta.addEventListener("input", function(){ lsSet(draftKey("answers"), { answers: areas.map(function(a){ return a.value; }) }); });
        areas.push(ta);
        card.appendChild(el("div", { style: "margin-bottom:1rem" }, [ ta ]));
      });
      app.appendChild(card);
    });
    var bar = el("div", { class: "card" }, []);
    var msg = el("div", { class: "err" });
    var btn = el("button", { class: "btn", text: saved ? "고쳐서 다시 내기" : "선생님께 내기" });
    btn.addEventListener("click", async function(){
      msg.textContent = "";
      btn.disabled = true;
      try {
        await api.submitEntry(bookId, SEC, "answers", NAME, { answers: areas.map(function(a){ return trimStr(a.value); }) });
        lsDel(draftKey("answers")); await loadMine();
        toast("냈어요"); render();
      } catch(e){ btn.disabled = false; msg.textContent = e.message; }
    });
    bar.appendChild(el("div", { class: "row" }, [ btn, saved ? el("span", { class: "sub small", text: "냄 · " + fmtTime(saved.updated_at) }) : null ]));
    bar.appendChild(msg);
    var note = teacherNote(saved); if (note) bar.appendChild(note);
    app.appendChild(bar);
  }
}

/* ================= 교사 ================= */
function runTeacher(){
  pageHeader.innerHTML =
    '<div class="topline"><div>' +
    '<div class="eyebrow gold">교사용</div>' +
    '<h1>독서 기록</h1>' +
    '<p class="sub">내용 이해 빈칸 · 책갈피 · 생각하기 보강</p></div>' +
    '<div class="row" id="whoami"></div></div>';
  pageFoot.innerHTML = "학생에게는 책마다 <b>학생 링크</b>만 보내 주세요. 빈칸 정답과 예시 답안은 학생에게 미리 보이지 않아요.";
  var whoami = document.getElementById("whoami");
  var USER = null, unsub = null;

  api.getUser().then(function(u){ USER = u; route(); });
  api.onAuth(function(u){ USER = u; route(); });

  function go(hash){ if (location.hash.slice(1) === hash) route(); else location.hash = hash; }
  window.addEventListener("hashchange", function(){ route(); });

  function route(){
    if (unsub){ unsub(); unsub = null; }
    if (!USER) return renderLogin();
    whoami.innerHTML = "";
    whoami.appendChild(el("span", { class: "pill", text: USER.email }));
    whoami.appendChild(el("button", { class: "btn ghost small", text: DEMO ? "체험 초기화" : "로그아웃", onclick: function(){ api.signOut(); } }));
    var p = new URLSearchParams(location.hash.slice(1));
    if (p.get("edit")) renderEditor(p.get("edit"));
    else if (p.get("book")) renderDashboard(p.get("book"));
    else renderList();
  }

  function renderLogin(){
    whoami.innerHTML = ""; app.innerHTML = "";
    var card = el("div", { class: "card" }, []);
    card.appendChild(el("h2", { text: "선생님 로그인" }));
    card.appendChild(el("p", { class: "sub", text: "품사 시험지와 같은 계정으로 로그인하세요." }));
    var em = el("input", { type: "email", id: "em", autocomplete: "email" });

    var errb = el("div", { class: "err" });
    var btn = el("button", { class: "btn", text: "로그인" });
    async function doLogin(){
      errb.textContent = "";
      if (!trimStr(em.value) || !pw.value){ errb.textContent = "이메일과 비밀번호를 입력하세요."; return; }
      btn.disabled = true;
      try { await api.signIn(trimStr(em.value), pw.value); }
      catch(e){ errb.textContent = e.message; }
      btn.disabled = false;
    }
    btn.addEventListener("click", doLogin);
    pw.addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); });
    card.appendChild(el("div", { class: "field", style: "margin-top:1rem" }, [ el("label", { for: "em", text: "이메일" }), em ]));
    card.appendChild(el("div", { class: "field" }, [ el("label", { for: "pw", text: "비밀번호" }), pw ]));
    card.appendChild(btn); card.appendChild(errb);
    app.appendChild(card);
    app.appendChild(el("div", { class: "note", html: "먼저 둘러보고 싶으면 주소 끝에 <b>?demo=1</b> 을 붙여 체험 모드로 열어 보세요." }));
  }

  /* ----- 책 목록 ----- */
  async function renderList(){
    app.innerHTML = '<div class="empty">불러오는 중…</div>';
    var books;
    try { books = await api.listBooks(); }
    catch(e){ app.innerHTML = ""; app.appendChild(el("div", { class: "err", text: e.message })); return; }
    app.innerHTML = "";
    app.appendChild(el("div", { class: "spread" }, [
      el("h2", { text: "내 책" }),
      el("div", { class: "row" }, [
        el("button", { class: "btn ghost small", text: "몽실언니 샘플로 만들기", onclick: function(){ create(clone(MONGSIL)); } }),
        el("button", { class: "btn small", text: "+ 새 책", onclick: function(){ create({ title: "새 책", sections: [{ title: "1주차", range: "", boxes: [{ heading: "", text: "", questions: [] }] }] }); } })

  async function renderDashboard(bookId){
    app.innerHTML = '<div class="empty">불러오는 중…</div>';
    var book;
    try { book = await api.getBook(bookId); }
    catch(e){ app.innerHTML = ""; app.appendChild(el("div", { class: "err", text: e.message })); return; }
    var SEC = lsGet("reading-tsec:" + bookId) || 0;
    if (SEC >= (book.sections || []).length) SEC = 0;
    var TAB = "status", ENTRIES = [];

    app.innerHTML = "";
    var nav = el("div", { class: "row", style: "margin-bottom:1rem" }, [
      el("button", { class: "btn ghost small", text: "← 책 목록", onclick: function(){ go(""); } }),
      el("button", { class: "btn ghost small", text: "문제 편집", onclick: function(){ go("edit=" + bookId); } }),
      el("button", { class: "btn ghost small", text: "학생 링크 복사", onclick: function(){ copyText(studentLink(bookId), "학생 링크를 복사했어요"); } })
    ]);
    if (DEMO) nav.appendChild(el("a", { class: "btn small", href: studentLink(bookId), text: "학생 화면 보기 →", style: "text-decoration:none" }));
    app.appendChild(nav);
    var headCard = el("div", { class: "card" }, []);
    app.appendChild(headCard);
    var body = el("div", {}, []);
    app.appendChild(body);

    await load();
    var t = null;
    unsub = api.subscribe(bookId, function(){ clearTimeout(t); t = setTimeout(load, 400); });

    async function load(){
      try { ENTRIES = await api.listEntries(bookId); }
      catch(e){ body.innerHTML = ""; body.appendChild(el("div", { class: "err", text: e.message })); return; }
      draw();
    }
    function sec(){ return book.sections[SEC] || { title: "", boxes: [] }; }
    function inSec(kind){ return ENTRIES.filter(function(e){ return e.section === SEC && e.kind === kind; })
      .sort(function(a, b){ return a.student_name.localeCompare(b.student_name, "ko"); }); }
    function students(){
      var s = {}; ENTRIES.forEach(function(e){ s[e.student_name] = 1; });
      return Object.keys(s).sort(function(a, b){ return a.localeCompare(b, "ko"); });
    }
    function ansOf(e, which){ var d = e.data || {}; return which === "first" ? (d.first || []) : (d.second || d.first || []); }
    function scoreOf(e, keys, which){ var a = ansOf(e, which); return keys.filter(function(k, i){ return gradeA(a[i], k, e.data.accept, i) === "ok"; }).length; }

    function draw(){
      var keys = sectionKeys(sec());
      headCard.innerHTML = "";
      headCard.appendChild(el("div", { class: "eyebrow gold", text: [book.grade, "수업 보기"].filter(Boolean).join(" · ") }));
      headCard.appendChild(el("h2", { text: book.title }));
      var chips = el("div", { class: "chips" }, []);
      (book.sections || []).forEach(function(s, i){
        chips.appendChild(el("button", { class: "chip" + (i === SEC ? " on" : ""), text: s.title, onclick: function(){ SEC = i; lsSet("reading-tsec:" + bookId, i); draw(); } }));
      });
      headCard.appendChild(chips);
      if (sec().range) headCard.appendChild(el("div", { class: "range" }, [ el("b", { text: "읽을 범위 " }), sec().range ]));
      var bl = inSec("blanks"), bm = inSec("bookmark");
      var avg = bl.length && keys.length ? Math.round(bl.reduce(function(a, e){ return a + scoreOf(e, keys, "first"); }, 0) / bl.length / keys.length * 100) : null;
      headCard.appendChild(el("div", { class: "stats" }, [
        stat(students().length, "이 책의 학생"), stat(bl.length, "내용 이해 낸 학생"),
        stat(avg == null ? "–" : avg + "%", "처음 낸 답 정답률"), stat(bm.length, "책갈피 낸 학생")
      ]));
      var tabs = el("div", { class: "tabs", style: "margin-bottom:0" }, []);
      [["status", "제출 현황"], ["bookmark", "책갈피"], ["blanks", "내용 이해"], ["answers", "생각하기 (보강)"]].forEach(function(x){
        tabs.appendChild(el("button", { class: "tab" + (TAB === x[0] ? " on" : ""), text: x[1], onclick: function(){ TAB = x[0]; draw(); } }));
      });
      headCard.appendChild(tabs);

      body.innerHTML = "";
      if (TAB === "status") drawStatus(keys);
      else if (TAB === "blanks") drawBlanks(keys);
      else if (TAB === "bookmark") drawBookmarks();
      else drawAnswers();
    }
    function stat(n, l){ return el("div", { class: "stat" }, [ el("div", { class: "n", text: String(n) }), el("div", { class: "l", text: l }) ]); }

    function drawStatus(keys){
      var names = students();
      var card = el("div", { class: "card" }, []);
      if (!names.length){ card.appendChild(el("div", { class: "empty", text: "아직 아무도 기록하지 않았어요. 학생 링크를 보내 주세요." })); body.appendChild(card); return; }
      var tbl = el("table", {}, [ el("thead", {}, [ el("tr", {}, [
        el("th", { text: "이름" }), el("th", { text: "내용 이해" }), el("th", { text: "책갈피" }), el("th", { text: "생각하기(보강)" }), el("th", { text: "마지막 기록" })
      ]) ]) ]);
      var tb = el("tbody", {}, []);
      names.forEach(function(n){
        var mine = ENTRIES.filter(function(e){ return e.section === SEC && e.student_name === n; });
        var bl = mine.find(function(e){ return e.kind === "blanks"; });
        var bm = mine.find(function(e){ return e.kind === "bookmark"; });
        var an = mine.find(function(e){ return e.kind === "answers"; });
        var last = mine.map(function(e){ return e.updated_at; }).sort().pop();
        var sc = bl ? scoreOf(bl, keys, "first") : 0, sc2 = bl && bl.data.second ? scoreOf(bl, keys, "final") : null;
        tb.appendChild(el("tr", {}, [
          el("td", { text: n }),
          el("td", {}, [ bl ? el("span", { class: "mark " + (sc === keys.length ? "ok" : ""), text: "처음 " + sc + "/" + keys.length + (sc2 != null ? " → 다시 " + sc2 + "/" + keys.length : (sc < keys.length ? " (다시 쓰기 전)" : "")) }) : el("span", { class: "mark no", text: "아직" }) ]),
          el("td", {}, [ el("span", { class: "mark " + (bm ? "ok" : "no"), text: bm ? "냄" : "아직" }) ]),
          el("td", { class: "sub small", text: an ? "냄" : "–" }),
          el("td", { class: "sub small", text: last ? fmtTime(last) : "" })
        ]));
      });
      tbl.appendChild(tb);
      card.appendChild(el("div", { class: "table-wrap" }, [tbl]));
      card.appendChild(el("p", { class: "sub small", style: "margin-top:.6rem", text: "‘처음’은 처음 낸 답, ‘다시’는 틀린 칸을 고쳐 낸 뒤예요. 맞음은 표현이 정답과 같거나 거의 같을 때만 세요." }));
      body.appendChild(card);
    }

    function drawBlanks(keys){
      var bl = inSec("blanks");
      if (!keys.length){ body.appendChild(el("div", { class: "empty", text: "이 주차에는 빈칸이 없어요." })); return; }
      body.appendChild(el("div", { class: "legend", style: "margin:.2rem 0 .8rem" }, [
        legend("var(--correct-soft)", "맞음"), legend("var(--warn-soft)", "표현이 다름 · 확인"), legend("var(--wrong-soft)", "안 씀"),
        el("span", { text: "· 이름: 처음 답 → 다시 쓴 답 · 정답률(처음 기준)이 낮은 빈칸 = 대충 읽은 부분" })
      ]));
      var idx = 0;
      (sec().boxes || []).forEach(function(b){
        var bk = keysOf(b.text);
        if (!bk.length) return;
        var card = el("div", { class: "card" }, []);
        card.appendChild(el("div", { class: "box-h", text: b.heading || "박스" }));
        bk.forEach(function(k){
          var i = idx++;
          var gs = bl.map(function(e){
            var acc = e.data.accept || {}, f = ansOf(e, "first")[i], s = e.data.second ? e.data.second[i] : null;
            var g1 = gradeA(f, k, acc, i), retried = s != null && g1 !== "ok";
            var latest = retried ? s : f;
            return { e: e, acc: acc, name: e.student_name, a: f, g: g1, a2: retried ? s : null, g2: retried ? gradeA(s, k, acc, i) : null,
              latest: latest, ruleOk: grade(latest, k) === "ok", accepted: !!norm(latest) && acc[i] === norm(latest) };
          });
          var okN = gs.filter(function(x){ return x.g === "ok"; }).length;
          var rate = bl.length ? Math.round(okN / bl.length * 100) : null;
          var row = el("div", { class: "blank-stat" }, [
            el("div", { class: "head" }, [
              el("span", { class: "no", text: "빈칸 " + (i + 1) }),
              el("span", { text: displayKey(k) }),
              el("span", { class: "rate" + (rate != null && rate < 60 ? " low" : ""), text: rate == null ? "" : "처음 " + okN + " / " + bl.length + " 맞음" })
            ])
          ]);
          var mini = el("div", { class: "mini" }, []);
          gs.forEach(function(x){
            var mark = x.accepted ? " (인정)" : "";
            var sp = el("span", { class: x.g, text: x.name + ": " + (trimStr(x.a) || "안 씀") + (x.a2 == null ? mark : "") });
            var kids = [ sp ];
            if (x.a2 != null) kids.push(el("span", { class: x.g2, text: "→ " + (trimStr(x.a2) || "안 씀") + mark }));
            if (!x.ruleOk && norm(x.latest)) kids.push(el("button", { class: "acc", text: x.accepted ? "인정 취소" : "인정",
              title: "이 답을 맞음으로 인정해요", onclick: async function(){
                var next = clone(x.acc);
                if (x.accepted) delete next[i]; else next[i] = norm(x.latest);
                try { await api.setAccept(x.e.id, next); x.e.data.accept = next; toast(x.name + (x.accepted ? " 인정을 취소했어요" : " 답을 인정했어요")); draw(); }
                catch(err){ toast(err.message, true); }
              } }));
            mini.appendChild(kids.length === 1 ? sp : el("span", { style: "padding:0" }, kids));
          });
          if (gs.length) row.appendChild(mini);
          card.appendChild(row);
        });
        body.appendChild(card);
      });
      body.appendChild(feedbackCard(bl, "내용 이해 한마디 · 다시 풀게 하기", true));
    }

        }})
      ]));
      card.appendChild(el("p", { class: "sub small", text: "학생들은 서로의 책갈피를 볼 수 없어요. 수업 전에 보고 발표 순서나 두 모둠에 줄 질문을 골라 두세요." }));
      if (!bm.length) card.appendChild(el("div", { class: "empty", text: "아직 낸 학생이 없어요." }));
      bm.forEach(function(e){
        if (!trimStr(e.data.topic)) return;
        card.appendChild(el("div", { class: "topic" }, [ el("div", { class: "t", text: e.data.topic }), el("div", { class: "by", text: e.student_name }) ]));
      });
      body.appendChild(card);

      var qcard = el("div", { class: "card" }, [ el("h3", { text: "내 마음에 들어온 문장" }) ]);
      if (!bm.length) qcard.appendChild(el("div", { class: "empty", text: "아직 없어요." }));
      bm.forEach(function(e){
        qcard.appendChild(el("div", { style: "margin-top:.8rem" }, [
          el("div", { class: "quote", text: e.data.sentence }),
          el("div", { class: "by sub small", text: e.student_name + (e.data.page ? " · " + e.data.page + "쪽" : "") + (e.data.why ? " — " + e.data.why : "") })
        ]));
      });
      body.appendChild(qcard);
    }

    function drawAnswers(){
      var an = inSec("answers");
      var qs = sectionQuestions(sec());
      body.appendChild(el("p", { class: "note", text: "결석한 학생이 앱으로 낸 생각하기 답이에요. 보통 생각하기는 수업 시간에 교재로 해요." }));
      if (!qs.length){ body.appendChild(el("div", { class: "empty", text: "이 주차에는 생각하기 문제가 없어요." })); return; }
      if (!an.length){ body.appendChild(el("div", { class: "empty", text: "보강으로 낸 학생이 없어요." })); return; }
      qs.forEach(function(q, i){
        var card = el("div", { class: "card" }, []);
        card.appendChild(el("div", { class: "qtext", text: q.prompt }));
        if (q.model) card.appendChild(el("div", { class: "model" }, [ el("span", { class: "lab", text: "예시 답안" }), textBlock(q.model) ]));
        an.forEach(function(e){
          var v = trimStr((e.data.answers || [])[i]);
          card.appendChild(el("div", { class: "ans" }, [ el("span", { class: "who", text: e.student_name }), v ? textBlock(v) : el("span", { class: "none", text: "안 씀" }) ]));
        });
        body.appendChild(card);
      });
      body.appendChild(feedbackCard(an, "생각하기 한마디 · 확인", false));
    }

    function feedbackCard(list, title, allowRetry){
      var fc = el("div", { class: "card" }, [ el("h3", { text: title }),
        el("p", { class: "sub small", text: "여기 쓴 한마디는 학생 화면에 보여요." + (allowRetry ? " ‘다시 풀게 하기’를 누르면 그 학생의 빈칸 답(처음·다시 모두)이 지워지고 처음부터 다시 풀어요." : "") }) ]);
      if (!list.length) fc.appendChild(el("div", { class: "empty", text: "아직 낸 학생이 없어요." }));
      list.forEach(function(e){
        var ta = el("textarea", { placeholder: "칭찬이나 보충할 점" }); ta.value = e.feedback || "";
        var ck = el("input", { type: "checkbox", id: "ck-" + e.id }); ck.checked = !!e.checked;
        var sv = el("button", { class: "btn small", text: "저장" });
        sv.addEventListener("click", async function(){
          sv.disabled = true;
          try { await api.setFeedback(e.id, trimStr(ta.value), ck.checked); e.feedback = trimStr(ta.value); e.checked = ck.checked; toast(e.student_name + " 저장했어요"); }
          catch(err){ toast(err.message, true); }
          sv.disabled = false;
        });
        var ctr = [ el("label", { class: "row", for: "ck-" + e.id, style: "font-weight:600;gap:.35rem" }, [ ck, "확인 완료" ]), sv ];
        if (allowRetry) ctr.push(el("button", { class: "btn danger small", text: "다시 풀게 하기", onclick: async function(){
          if (!(await askBox(e.student_name + " 학생의 빈칸 답을 지우고 다시 풀게 할까요?", "다시 풀게 하기"))) return;
          try { await api.deleteEntry(e.id); toast("지웠어요"); load(); } catch(err){ toast(err.message, true); }
        }}));
        fc.appendChild(el("div", { style: "border-top:1px solid var(--line);padding-top:.8rem;margin-top:.8rem" }, [
          el("div", { class: "spread" }, [ el("strong", { text: e.student_name }), el("span", { class: "sub small", text: "제출 " + fmtTime(e.updated_at) }) ]),
          el("div", { style: "margin:.4rem 0" }, [ ta ]),
          el("div", { class: "row" }, ctr)
        ]));
      });
      return fc;
    }
  }
}
</script>
</body>
</html>
