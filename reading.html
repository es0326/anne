<style>
:root{
  --paper:#FBF8F1;--ink:#211F1B;--muted:#6E685C;--line:#E7DFCE;--card:#FFFFFF;
  --accent:#183263;--accent-soft:#E5E9F1;--green:#324840;--beige:#F1EEE4;
  --correct:#2E7D5B;--correct-soft:#E4F0EA;--wrong:#BF4230;--wrong-soft:#F7E7E3;--warn:#A86A12;--warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(33,31,27,.05),0 12px 32px -14px rgba(33,31,27,.16);--radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191713;--ink:#ECE6D9;--muted:#A69D8B;--line:#38322A;--card:#242019;
  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;
  --correct:#71C9A0;--correct-soft:#1E2E27;--wrong:#E88C7A;--wrong-soft:#33221E;--warn:#E3B062;--warn-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --paper:#191713;--ink:#ECE6D9;--muted:#A69D8B;--line:#38322A;--card:#242019;
  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;
  --correct:#71C9A0;--correct-soft:#1E2E27;--wrong:#E88C7A;--wrong-soft:#33221E;--warn:#E3B062;--warn-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.7;letter-spacing:-.01em;
  padding:clamp(1rem,4vw,3rem) 1rem 5rem}
.wrap{max-width:48rem;margin:0 auto}
.wrap.narrow{max-width:42rem}
a{color:var(--accent)}
h1,h2,h3{font-family:"Gowun Batang",serif;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.5rem);font-weight:800;line-height:1.15}
h2{font-size:1.35rem;font-weight:700;margin-bottom:.2rem}
h3{font-size:1.08rem;font-weight:700}
p{margin:.3rem 0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--accent);
  display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.eyebrow.gold{color:var(--green)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--muted);font-size:.95rem}
.small{font-size:.85rem}
header.page{margin-bottom:1.6rem}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(1.2rem,4vw,1.9rem);margin-bottom:1rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field>label{font-size:.9rem;font-weight:700}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:-.2rem}
input[type=text],input[type=email],input[type=password],textarea,select{
  font-family:inherit;font-size:1rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
textarea{resize:vertical;min-height:4.2rem;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:2.5px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);
  border:none;border-radius:10px;padding:.62rem 1.25rem;transition:opacity .15s,transform .06s;display:inline-block}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);opacity:1}
.btn.danger{background:transparent;color:var(--wrong);border:1.5px solid var(--line)}
.btn.small{padding:.4rem .8rem;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--correct);border-color:var(--correct)}
.pill.no{color:var(--wrong);border-color:var(--wrong)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chip{font-family:inherit;font-size:.85rem;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .8rem;
  background:var(--card);cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:.3rem;border-bottom:1.5px solid var(--line);margin:1.2rem 0 1rem;overflow-x:auto;overflow-y:hidden}
.tab{font-family:inherit;font-size:.95rem;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);
  padding:.55rem .9rem;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab-n{display:inline-block;min-width:1.4em;font-size:.72rem;font-weight:700;padding:.05rem .4rem;border-radius:999px;background:var(--beige);color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .tab-n{background:var(--accent-soft);color:var(--accent)}
.range{background:var(--accent-soft);border-radius:12px;padding:.75rem 1rem;font-size:.95rem;margin:.6rem 0 0}
.range b{color:var(--accent)}
.bm-item{border-top:1px dashed var(--line);padding-top:.9rem;margin-top:.9rem}
.bm-item:first-child{border-top:none;margin-top:0;padding-top:0}
.bm-item h3{color:var(--green)}
.bm-topic{border-top:1.5px solid var(--line);padding-top:1rem}
.due{font-size:.9rem;font-weight:700;color:var(--accent);margin:.5rem 0 0}
.due.soon{color:var(--warn)}
.due.over{color:var(--wrong)}
.late{font-size:.72rem;font-weight:700;color:var(--wrong);border:1px solid var(--wrong);border-radius:999px;padding:0 .45rem;margin-left:.3rem;white-space:nowrap}
.box-h{font-family:"Gowun Batang",serif;font-size:1.1rem;font-weight:800;display:inline-block;
  border-bottom:3px solid var(--green);padding-bottom:.1rem;margin-bottom:.6rem}
.story{font-size:1.02rem;line-height:2.1;white-space:pre-wrap}
.card:has(> .story){background:var(--beige)}
input[type=text].blank{font-family:inherit;line-height:1.4;vertical-align:baseline;font-size:.98rem;color:var(--accent);font-weight:600;background:var(--accent-soft);
  border:none;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:.05rem .35rem;margin:0 .15rem;
  width:auto;min-width:5.5em;max-width:100%}
.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
.filled{display:inline;border-radius:6px;padding:.05rem .35rem;margin:0 .1rem;font-weight:600}
.filled.ok{background:var(--correct-soft);color:var(--correct)}
.filled.chk{background:var(--warn-soft);color:var(--warn)}
textarea.blank.long{display:block;width:100%;min-height:4.5rem;margin:.45rem 0;font-family:inherit;font-size:.98rem;line-height:1.6;
  color:var(--accent);font-weight:600;background:var(--accent-soft);border:none;border-bottom:2px solid var(--accent);border-radius:8px 8px 0 0;padding:.5rem .7rem}
textarea.blank.long.retry{border-bottom-color:var(--wrong);background:var(--wrong-soft);color:var(--ink)}
input[type=text].blank.retry{border-bottom-color:var(--wrong);background:var(--wrong-soft);color:var(--ink)}
.filled.none{background:var(--wrong-soft);color:var(--wrong)}
.key{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:.15rem}
.qnum{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.qtext{font-family:"Gowun Batang",serif;font-size:1.05rem;font-weight:700;line-height:1.55;margin:.15rem 0 .55rem}
.model{background:var(--beige);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.9rem;margin:.4rem 0 .7rem}
.model .lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--green);display:block}
.ans{display:grid;grid-template-columns:6.5rem 1fr;gap:.2rem .8rem;padding:.45rem 0;border-top:1px dashed var(--line);font-size:.95rem}
.ans .who{font-weight:700}
.ans .none{color:var(--muted);font-style:italic}
.feedback{margin-top:.6rem;border-left:3px solid var(--green);background:var(--beige);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.92rem}
.feedback .lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--green);display:block}
.blank-stat{border-top:1px solid var(--line);padding:.8rem 0}
.blank-stat .head{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.blank-stat .no{font-weight:800;color:var(--accent)}
.blank-stat .rate{margin-left:auto;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.blank-stat .rate.low{color:var(--wrong)}
.mini{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.35rem;font-size:.88rem}
.mini span{border-radius:7px;padding:.1rem .45rem}
.mini .ok{background:var(--correct-soft);color:var(--correct)}
.mini .chk{background:var(--warn-soft);color:var(--warn)}
.mini .none{background:var(--wrong-soft);color:var(--wrong)}
.mini button.acc{font-family:inherit;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;margin-left:.25rem;cursor:pointer}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:.4rem 0}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;vertical-align:-1px;margin-right:.25rem}
.topic{padding:.7rem 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:none}
.topic .t{font-size:1rem;font-weight:500}
.topic .by{font-size:.8rem;color:var(--muted)}
.quote{font-family:"Gowun Batang",serif;font-size:1rem;line-height:1.6;border-left:3px solid var(--line);padding:.1rem 0 .1rem .85rem;margin:.5rem 0 .2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.7rem;margin:1rem 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:.7rem .9rem}
.stat .n{font-family:"Gowun Batang",serif;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.76rem;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:none}
.mark.ok{color:var(--correct);font-weight:700}
.mark.no{color:var(--wrong);font-weight:700}
.sec-edit{border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;background:var(--paper)}
.box-edit{border:1px solid var(--line);border-radius:10px;padding:.9rem;margin:.7rem 0;background:var(--card)}
.q-edit{border:1px dashed var(--line);border-radius:10px;padding:.7rem;margin:.5rem 0}
.note{font-size:.88rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.demo-bar{background:var(--beige);color:var(--ink);border:1px solid var(--green);border-radius:10px;padding:.55rem .9rem;font-size:.85rem;margin-bottom:1.2rem}
.err{color:var(--wrong);font-size:.88rem;margin-top:.4rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
.foot{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(2rem);background:var(--ink);
  color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;font-size:.9rem;font-weight:600;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--wrong)}
.dlg-back{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:60}
.dlg{background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem;max-width:26rem;width:100%}
.dlg p{margin:0 0 1.1rem;white-space:pre-wrap;font-size:1rem}
.dlg textarea{margin-bottom:1rem}
@media (max-width:520px){ .ans{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* ===== 설정 ===== */
var SUPABASE_URL = "https://yqwexzzdamcpqmsqkbcg.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_Y2bK2lw2T_Wysf9WWPuDbg_eA1ZX7R0";

var PARAMS = new URLSearchParams(location.search);
// ?demo=1 이거나 파일을 더블클릭해서 열면 → Supabase 없이 이 기기 안에서만 체험

/* ===== 공용 헬퍼 ===== */
var app = document.getElementById("app");

function el(tag, attrs, kids){
  var n = document.createElement(tag); attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "value") n.value = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
var _toastT;
function toast(msg, bad){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(_toastT); _toastT = setTimeout(function(){ t.className = ""; }, 3200);
}
// 브라우저 확인 창(confirm) 대신 쓰는 앱 안 확인 창 — confirm 이 막힌 브라우저에서도 동작
function askBox(msg, okText){
  return new Promise(function(resolve){
    var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });
    function done(v){ back.remove(); resolve(v); }
    var ok = el("button", { class: "btn", text: okText || "확인", onclick: function(){ done(true); } });
    back.appendChild(el("div", { class: "dlg" }, [ el("p", { text: msg }),
      el("div", { class: "row", style: "justify-content:flex-end" }, [
        el("button", { class: "btn ghost", text: "취소", onclick: function(){ done(false); } }), ok ]) ]));
    back.addEventListener("click", function(e){ if (e.target === back) done(false); });
    back.addEventListener("keydown", function(e){ if (e.key === "Escape") done(false); });
    document.body.appendChild(back); ok.focus();
  });
}
function showCopyBox(text){
  var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });
  var ta = el("textarea", { readonly: "readonly", style: "min-height:6rem" }); ta.value = text;
  back.appendChild(el("div", { class: "dlg" }, [ el("p", { text: "아래 내용을 복사하세요 (Ctrl+C)." }), ta,
    el("div", { class: "row", style: "justify-content:flex-end" }, [ el("button", { class: "btn", text: "닫기", onclick: function(){ back.remove(); } }) ]) ]));
  document.body.appendChild(back); ta.focus(); ta.select();
}
function fmtTime(iso){
  var d = new Date(iso), p = function(x){ return String(x).padStart(2,"0"); };
  return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes());
}
// 제출 마감: 회차(section)의 due = "YYYY-MM-DD", 그날 밤 23:59 까지. 늦어도 낼 수 있고 선생님 화면에 '늦음'으로 표시
// 책갈피: 마음에 들어온 문장은 모든 책에서 5개 이상. data = { items:[{sentence,page,why}], topic } (예전 기록은 sentence/page/why 하나)
var BM_MIN = 5;
// 책갈피 글: 문학·명작은 '마음에 들어온 문장', 비문학(학년 칸에 '비문학')은 '새로 알게 된 개념' (2026-11-08 원장 결정). 저장 모양은 같음(sentence=문장/개념, why=까닭/내 말 풀이)
var BM_SENT = { unit: "문장", label: "내 마음에 들어온 문장", hint: "내 마음을 표현한, 누군가에게 들려주고 싶은, 멋있거나 색다른 표현 등…", why: "고른 까닭", whyHint: "",
  note: "읽으면서 마음에 들어온 문장을 " + BM_MIN + "개 이상 옮겨 쓰고, 쪽수와 고른 까닭을 함께 적어요. 함께 이야기하고 싶은 것도 적어요. 수업 시간에 친구들 앞에서 발표해요.",
  topicHint: "궁금했던 점, 이해가 안 되는 장면, 친구들과 토론해 보고 싶은 질문" };
var BM_CONCEPT = { unit: "개념", label: "새로 알게 된 개념", hint: "책을 읽고 처음 알게 된 낱말·개념이나 사실 (예: 환율, 기축통화)", why: "내 말로 풀어 쓰기", whyHint: "책을 보지 않고 친구에게 설명하듯, 뜻과 예를 내 말로 써요",
  note: "읽으면서 새로 알게 된 개념을 " + BM_MIN + "개 이상 쓰고, 쪽수와 내 말로 푼 뜻을 함께 적어요. 함께 이야기하고 싶은 것도 적어요. 수업 시간에 친구들 앞에서 발표해요.",
  topicHint: "더 알고 싶은 점, 이해가 안 되는 설명, 친구들과 토론해 보고 싶은 질문" };
function bmCfg(book){ return bookKind(book) === "nonlit" ? BM_CONCEPT : BM_SENT; }
function bmItems(data){
  data = data || {};
  if (Array.isArray(data.items)) return data.items;
  return trimStr(data.sentence) || trimStr(data.why) ? [{ sentence: data.sentence || "", page: data.page || "", why: data.why || "" }] : [];

function dueDate(due){ var d = due ? new Date(due + "T00:00:00") : null; return d && !isNaN(d) ? d : null; }

function daysLeft(due){ var d = dueDate(due), t = new Date(); t.setHours(0,0,0,0); return d ? Math.round((d - t) / 864e5) : null; }

/* ----- 빈칸: 줄거리 안의 [정답] ----- */
//   [+정답] 처럼 앞에 + 를 붙이면 문장으로 쓰는 긴 빈칸 (학생 화면에 여러 줄 칸)
var BLANK_RE = /\[([^\]]+)\]/g;
var BLANK_SLOT = /\[\+?\]/g;     // 학생용 줄거리 속 빈칸 자리: [] 또는 [+]
function keysOf(text){ var out = [], m; BLANK_RE.lastIndex = 0; while ((m = BLANK_RE.exec(text || ""))) out.push(m[1].replace(/^\+/, "")); return out; }
function stripKeys(text){ return String(text || "").replace(BLANK_RE, function(_m, k){ return k.charAt(0) === "+" ? "[+]" : "[]"; }); }
function sectionKeys(sec){ var k = []; ((sec && sec.boxes) || []).forEach(function(b){ k = k.concat(keysOf(b.text)); }); return k; }
function sectionQuestions(sec){ var q = []; ((sec && sec.boxes) || []).forEach(function(b){ q = q.concat(b.questions || []); }); return q; }
function blankCount(sec){ // 학생용(정답이 [] 로 바뀐) 줄거리에서 세기
  var n = 0; ((sec && sec.boxes) || []).forEach(function(b){ n += (String(b.text || "").match(BLANK_SLOT) || []).length; }); return n;
}
function norm(s){ return String(s || "").replace(/[\s.,·…‘’“”'"!?~()\-]/g, ""); }
// 빈칸 정답 형식: [정답] · [정답|다른 정답] · [정답@핵심어,핵심어·바꿔쓸말]
//   @ 뒤 핵심어: 쉼표(,)로 나눈 말은 모두 들어가야 하고, 가운뎃점(·)으로 나눈 말은 하나만 있으면 됨
//   (어미·시제·조사·띄어쓰기는 상관없이 책 내용이 맞는지만 봄)
// 결과: "ok" 맞음 · "chk" 다시 쓰기 · "none" 안 씀    — reading.sql 의 blank_ok 와 같은 규칙
function grade(ans, key){
  var a = norm(ans);
  if (!a) return "none";
  key = String(key || "");
  var at = key.indexOf("@");
  if (at !== -1){
    if (!trimStr(key.slice(at + 1))) return "ok";   // [+예시 답@] 처럼 @ 뒤가 비면 '내 생각' 칸: 쓰기만 하면 맞음, 선생님이 읽음
    var groups = key.slice(at + 1).split(",");
    var all = groups.every(function(g){
      return g.split("·").some(function(alt){ alt = norm(alt); return alt && a.indexOf(alt) !== -1; });
    });
    return all ? "ok" : "chk";
  }
  var hit = key.split("|").some(function(k){
    k = norm(k); if (!k) return false;
    return a === k || a.indexOf(k) !== -1 || (k.indexOf(a) !== -1 && a.length >= Math.ceil(k.length * 0.6));
  });
  return hit ? "ok" : "chk";
}
// 선생님이 "인정"한 답(accept: { 빈칸번호: 정규화한 답 })이면 맞음
function gradeA(ans, key, accept, i){
  var a = norm(ans);
  if (a && accept && accept[i] === a) return "ok";
  return grade(ans, key);
}
function displayKey(k){ return String(k).split("@")[0].split("|")[0]; }

      { heading: "1장 · 1,050유로는 우리 돈으로 얼마지? · 21~22쪽", text: "환율의 뜻과 여행 경비를 원화로 계산하는 방법을 정리한 글이다. 빈칸에 알맞은 말이나 수를 쓰시오.\n\n여러 종류의 화폐를 서로 바꿀 때 사용하는 비율을 (ㅎㅇ)[환율]이라고 한다. 바꾸어 말하면 환율은 사고자 하는 외국 돈의 가치를 (ㅈㅂ)[지불]하는 돈의 가치로 표시한 (ㄱㄱ)[가격]이다.\n보통 환율이라고 하면 원화와 [달러]화의 교환 비율을 뜻한다. 환율이 1,184원이라는 말은 미국 돈 1달러를 바꾸는 데 우리 돈 [1,184]원이 필요하다는 뜻이고, 간단하게 1,184원/달러라고 쓴다.\n1,184원 = 0.89유로이므로 1유로는 약 [1,330]원이다.\n따라서 여행 경비 1,050유로를 원화로 계산하면 1,050 × 1,330 = [1,396,500]원이다.", questions: [] },
      { heading: "1장 · 돈을 주고 돈을 사다, 대체 어디서? · 24~25쪽", text: "환율과 관련된 말 가운데에는 뜻이 비슷해서 헷갈리는 낱말 짝이 있다. 설명글의 빈칸을 채우고, 표의 빈칸에 두 낱말의 뜻을 각각 쓰시오.\n\n보통 외환시장이라고 하면 (ㄱㅇㄱㄱ)[금융기관]끼리 외환 거래를 하는 시장을 말한다.\n이곳에서는 온라인으로 돈을 보낼 때처럼 지폐나 주화를 직접 주고받지 않고, 돈을 (ㄱㅈ)[계좌]에서 계좌로 옮기는 눈으로 볼 수 없는 방법으로 거래한다.\n이렇게 거래되는 것은 지폐와 주화만이 아니므로, 환율은 서로 다른 나라의 화폐가 아니라 서로 다른 나라의 (ㅌㅎ)[통화]를 교환하는 비율이라고 하는 것이 정확하다.\n\n〈표〉\n\n1) 낱말 짝: 화폐 / 통화\n   좁은 뜻의 말: 화폐: 지폐(종이돈)와 주화(동전)를 합친 것\n   넓은 뜻의 말: 통화: 화폐를 포함해 화폐의 기능이나 성격을 가진 금융상품까지 합친 것\n\n2) 낱말 짝: 외화 / 외환\n   좁은 뜻의 말: [+외화: 다른 나라에서 쓰는 지폐와 주화(외국 화폐)@지폐·주화·화폐]\n   넓은 뜻의 말: [+외환: 외국 화폐보다 넓은 개념인 외국 통화@통화]\n\n3) 낱말 짝: 환전시장 / 외환시장\n   좁은 뜻의 말: [+환전시장: 개인이나 기업이 은행이나 환전소에서 외화를 교환하는 시장@은행·환전소]\n   넓은 뜻의 말: [+외환시장: 외국 통화로 일어나는 거래를 하는 모든 시장(환전시장은 그 일부분)@모든·전체·일부·통화]", questions: [] },
      { heading: "1장 · 돈을 주고 돈을 사다, 대체 어디서? · 27쪽", text: "신기는 1유로를 1,330원으로 계산해 1,050유로를 바꾸는 데 1,396,500원이 든다고 했다. 그런데 실제로 은행에서 환전하면 원화가 이보다 조금 더 든다. 은행이 환전 고객에게 적용하는 환율은 외환시장의 환율과 어떻게 다른지 쓰고, 그래서 원화가 더 드는 까닭을 쓰시오.\n\n① 은행이 환전 고객에게 적용하는 환율은 외환시장의 환율과 어떻게 다른가요? [+외환시장 환율을 바탕으로 하지만, 외환시장에서 거래가 일어날 때마다 바뀌지는 않는다.@바뀌지·안 바뀌·변하지·그대로]\n② 그래서 원화가 더 드는 까닭은 무엇인가요? [+은행은 환전 서비스에 들어가는 비용을 더해서 환율을 정하므로, 외환시장보다 조금 높은 환율이 적용되기 때문이다.@비용·수수료·서비스]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "EU 회원국들은 유럽이 하나의 시장이 되는 데 가장 효율적인 방안은 같은 통화를 쓰는 것이라고 판단해 유로화를 함께 쓰기로 했다. 만약 한국, 중국, 일본이 유로화처럼 하나의 통화를 함께 쓴다면, 나는 찬성하는지 반대하는지 입장을 정하시오. 그리고 보기에서 좋은 점과 걱정되는 점을 비교하여 근거를 쓰시오.\n〈보기〉\n· 좋은 점: 세 나라를 오갈 때 환전할 필요가 없어서 환전에 드는 비용이 줄어든다.\n· 좋은 점: 환율이 바뀔까 걱정하지 않고 물건을 사고팔 수 있다.\n· 좋은 점: 세 나라의 물건 가격을 쉽게 비교할 수 있어 하나의 큰 시장이 된다.\n· 걱정되는 점: 세 나라의 경제 사정이 서로 다른데 한 가지 통화를 함께 써야 해서, 한 나라에 맞춘 결정이 다른 나라에는 맞지 않을 수 있다.\n· 걱정되는 점: 한 나라에 경제 위기가 생기면 다른 나라로 번지기 쉽다.\n· 걱정되는 점: 공동 통화를 어느 나라가 어떻게 관리할지를 두고 다툼이 생길 수 있다.", model: "찬성 예시: 환전 비용과 환율 걱정이 없어져 여행과 무역이 쉬워지고, 세 나라가 하나의 큰 시장이 되어 기업과 소비자 모두 이익을 볼 수 있다. 반대 예시: 세 나라는 경제 규모와 사정이 크게 달라 한 통화로 묶으면 위기가 번질 수 있고, 관리 주체를 두고 갈등이 생길 수 있다. 한쪽 입장을 분명히 하고, 상대 입장의 근거(걱정되는 점 또는 좋은 점)를 한 번 언급하며 비교하면 잘한 답으로 본다." }, { prompt: "신기는 현금을 많이 가지고 다니면 신경이 쓰이니까 환전은 최소한으로 하고, 갑자기 큰돈을 쓸 일이 생기면 신용카드로 결제하자고 했다. 내가 해외여행을 간다면 현금, 신용카드, 모바일 결제 가운데 무엇을 주로 쓸지 고르고, 보기를 참고하여 까닭을 쓰시오.\n〈보기〉\n· 현금: 작은 가게나 시장에서도 쓸 수 있고 남은 돈이 눈에 보여 예산을 지키기 쉽다. 그러나 잃어버리거나 도둑맞을 걱정이 있다.\n· 신용카드: 큰돈을 들고 다니지 않아도 되고 잃어버리면 사용을 멈출 수 있다. 그러나 해외에서 쓰면 수수료가 붙고, 카드를 받지 않는 곳도 있다.\n· 모바일 결제: 휴대 전화로 간편하게 내고 쓴 기록이 남는다. 그러나 나라마다 쓸 수 있는 서비스가 다르고, 인터넷이나 배터리가 없으면 쓸 수 없다.", model: "책의 계획(숙박·교통은 미리 지불, 식사·간식·여유비만 현금으로 환전, 큰돈은 신용카드)을 떠올리게 한다. 현금을 고르면 예산 관리와 작은 가게 이용을, 신용카드를 고르면 안전함과 큰돈 결제를, 모바일 결제를 고르면 편리함과 기록을 근거로 들 수 있다. 여러 수단을 섞어 쓰겠다는 답도 상황별 까닭이 분명하면 인정한다." }, { prompt: "환율이 내 생활에 영향을 준 경험을 쓰시오. 경험이 없다면 가족에게 물어보거나, 해외 직구로 물건을 사거나 해외여행을 갈 때 같은 1달러나 1유로를 사는 데 원화가 더 많이 들면 어떤 일이 생길지 상상하여 쓰시오.\n〈보기〉\n· 해외 직구: 달러로 적힌 물건값은 같은데 원화로 낸 돈이 지난번과 달랐다.\n· 해외여행: 같은 금액을 환전했는데 받은 외화가 지난번보다 적었다.\n· 수입품: 수입 과자나 과일 값이 올랐다는 이야기를 들었다.", model: "환율이 '오르다/내리다'의 정확한 뜻은 2장에서 배우므로, 여기서는 '같은 외국 돈을 사는 데 원화가 더(덜) 들었다'고 표현하면 충분하다. 직접 경험, 가족에게 들은 이야기, 상상 모두 인정하되 원화가 더 들면 물건값이나 여행 경비가 늘어난다는 연결이 드러나면 잘한 답으로 본다." }] }
    ] },
    { title: "2장", range: "30~47쪽 · 오르락내리락 쉬지 않고 변하는 환율", boxes: [
      { heading: "2장 · 환율 결정도 수요공급의 법칙에 따라 · 31~32쪽", text: "쇼미는 물건 가격은 잘 바뀌지 않는데 환율은 계속 바뀌니까 둘은 서로 다르다고 생각했다. 그러나 신기는 물건 가격과 환율이 같은 원리로 정해진다고 했다. 그 원리가 무엇인지 쓰시오. 또 양평시장에서 싸리버섯을 산 이야기를 예로 들어, 환율이 물건 가격보다 훨씬 자주 바뀌는 까닭을 설명하시오.\n\n① 물건 가격과 환율이 정해지는 같은 원리는 무엇인가요? [+시장에서 수요와 공급이 일치하는 점에서 가격(환율)이 정해진다(수요공급의 법칙).@수요,공급]\n② 양평시장의 싸리버섯 가격은 어떻게 정해졌나요? [+상인과 흥정한 뒤 정해져서, 같은 날에도 사람마다 가격이 다를 수 있다.@흥정]\n③ 환율이 물건 가격보다 훨씬 자주 바뀌는 까닭은 무엇인가요? [+외환시장에서는 거래가 아주 빈번하게 일어나기 때문이다.@빈번·자주·많이·계속]", questions: [] },
      { heading: "2장 · 환율 결정도 수요공급의 법칙에 따라 · 32쪽", text: "환율을 정하는 제도에는 고정환율제와 변동환율제가 있다. 두 제도의 차이를 표에 정리하시오.\n\n〈표〉\n\n1) 구분: 환율을 정하는 주체\n   고정환율제: 정부\n   변동환율제: [외환시장(외환의 수요와 공급)@시장·수요·공급]\n\n2) 구분: 환율이 정해지는 방법\n   고정환율제: [+정부가 정한 환율을 일정 기간 그대로 유지한다.@유지·그대로·고정·바꾸지]\n   변동환율제: 외환시장에서 외환의 수요와 공급에 따라 정해진다.", questions: [] },
      { heading: "2장 · 환율 결정도 수요공급의 법칙에 따라 · 32쪽", text: "우리나라의 환율제도는 어떤 순서로 바뀌어 왔을까? 시기에 맞게 표를 채우시오.\n\n〈표〉\n\n1) 시기: 처음\n   환율제도: 고정환율제\n   특징: 정부가 정한 환율을 일정 기간 유지했다.\n\n2) 시기: 1990년 3월부터\n   환율제도: 변동환율제\n   특징: [+외환시장에서 환율이 정해지지만, 정부가 하루 환율 변동 폭을 제한했다.@제한·폭]\n\n3) 시기: 1997년 12월 16일부터\n   환율제도: [완전한 변동환율제@완전,변동]\n   특징: [+변동 폭 제한을 없애고 외환의 수요와 공급에 따라 환율이 정해진다.@수요·공급·없애·없앴·없어]", questions: [] },
      { heading: "2장 · 환율 결정도 수요공급의 법칙에 따라 · 33쪽", text: "수요와 공급의 그래프를 설명한 글이다. 빈칸을 채우시오.\n\n시장에서 수요와 공급이 만나는 점에서 정해지는 가격을 (ㅅㅈㄱㄱ)[시장가격] 또는 (ㄱㅎㄱㄱ)[균형가격]이라고 한다. 그리고 이 가격에서 거래되는 상품의 양을 (ㄱㅎㄱㄹㄹ)[균형거래량]이라고 한다.\n이 그래프를 외환시장에 적용하면 가격은 [환율](원/달러), 수량은 거래량(달러)이 된다.\n외환의 수요와 공급이 만나는 점에서 정해지는 환율을 (ㅅㅈㅎㅇ)[시장환율] 또는 균형환율이라고 한다.", questions: [] },
      { heading: "2장 · 원화 가치가 올랐습니다, 고로 환율은 내렸습니다 · 38~40쪽", text: "신기는 수박과 사과를 바꾸는 예와 시소 그림으로 환율과 원화 가치의 관계를 설명했다. 빈칸을 채우시오.\n\n수박은 8,000원, 사과는 1,000원이라면 수박 1개를 사과 [8]개와 바꿀 수 있다. 수박과 사과의 교환비율은 1 : 8이다.\n그런데 사과 값이 2,000원으로 오르면 수박 1개를 사과 [4]개와만 바꿀 수 있다. 교환비율은 1 : [4]가 된다.\n사과 값이 2배로 오른 것은 사과의 (ㄱㅊ)[가치]가 2배로 올랐다는 뜻이다. 이처럼 교환하는 물건의 가치가 달라지면 교환비율도 달라진다.\n환율은 원화와 달러화를 교환하는 비율이다. 시소에서 몸무게가 무거운 쪽이 내려가듯이, 원화 가치가 올라가면 환율은 [내려가고@내려·낮아·떨어·하락], 원화 가치가 내려가면 환율은 [올라간다@올라·높아·상승·오른].", questions: [] },
      { heading: "2장 · 원화 가치가 올랐습니다, 고로 환율은 내렸습니다 · 40~41쪽", text: "어제 외환시장에서 환율은 1달러에 1,100원이었다. 오늘은 달러를 팔려는 사람이 늘어 환율이 1,000원으로 내렸다. 먼저 1,000달러를 사려면 원화가 얼마 필요한지 표를 채우시오. 그리고 환율이 내렸을 때 쇼미가 '돈을 번 것 같은 기분'이 든 까닭을, 원화 가치와 달러화 가치가 각각 어떻게 변했는지 넣어 쓰시오.\n\n〈표〉\n\n1) 환율(1달러에): 1,100원(어제)\n   1,000달러를 살 때 계산: 1,000 × 1,100\n   필요한 원화: 1,100,000원(110만 원)\n\n2) 환율(1달러에): 1,000원(오늘)\n   1,000달러를 살 때 계산: [1,000 × 1,000@1000]\n   필요한 원화: [1,000,000원(100만 원)@1000000·100만]\n\n3) 환율(1달러에): 1,200원(환율이 오른다면)\n   1,000달러를 살 때 계산: [1,000 × 1,200@1200]\n   필요한 원화: [1,200,000원(120만 원)@1200000·120만]\n\n① 환율이 1,100원에서 1,000원으로 내리면, 1,000달러를 사는 데 필요한 원화는 어떻게 되나요? [+110만 원에서 100만 원으로 10만 원 줄어든다.@줄·적게·덜·10만]\n② 이때 원화 가치와 달러화 가치는 각각 어떻게 변했나요? [+원화 가치는 올라가고 달러화 가치는 내려갔다.@원화,올라·오르·올랐·높아·커,달러,내려·내렸·떨어·낮아]", questions: [] },
      { heading: "2장 · 환율이 내렸습니다, 원화가 평가절상되었습니다 · 43~47쪽", text: "경제 뉴스에 자주 나오는 '평가절상'과 '평가절하'를 설명한 글이다. 빈칸을 채우시오.\n\n'평가'는 어떤 것의 가치를 헤아린다는 뜻이다. '절상'의 상(上)은 (ㅇ)[위]를, '절하'의 하(下)는 (ㅇㄹ)[아래]를 뜻한다.\n그래서 평가절상은 화폐의 가치가 (ㅇㄹㄱㄴ)[올라가는@올라·높아·오르] 것이고, 평가절하는 화폐의 가치가 (ㄴㄹㄱㄴ)[내려가는@내려·낮아·떨어] 것이다.\n2018년 11월, 중국이 위안화 기준 환율을 내렸다는 뉴스가 나왔다. 위안화 환율이 내린 것은 달러화에 비해 위안화 가치가 [높아졌다@높아·올라·오른·커]는 뜻이므로 위안화가 (ㅍㄱㅈㅅ)[평가절상]된 것이다. 위안화를 기준으로 하면 달러화는 평가절하된 것이다.\n환율과 화폐 가치는 시소처럼 (ㅂㄷ)[반대]로 움직인다. 그래서 뉴스에서 '원화 평가절하'라고 하면 원화 가치는 (ㄴㄹㄱㄱ)[내려가고@내려·낮아·떨어·하락] 환율은 (ㅇㄹㄷ)[올랐다@올라·오른·올랐·상승]는 뜻이다.\n예를 들어 원/달러 환율이 1,100원에서 1,200원으로 올랐다면 원화는 [평가절하]된 것이다.", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "내가 정부의 경제 담당자라면 고정환율제와 변동환율제 가운데 무엇을 고르겠는가? 보기를 읽고 무엇을 고를지, 까닭을 좋은 점과 걱정되는 점을 비교하여 쓰시오.\n〈보기〉\n· 고정환율제: 정부가 환율을 정해 일정 기간 그대로 유지한다.\n·   좋은 점: 환율이 잘 바뀌지 않아서 물건을 사고파는 회사나 여행 가는 사람이 미리 계획을 세우기 쉽다.\n·   걱정되는 점: 정부가 정한 환율이 외환시장에서 실제로 달러를 사고팔려는 양과 맞지 않을 수 있다.\n· 변동환율제: 외환시장에서 외환의 수요와 공급에 따라 환율이 정해진다.\n·   좋은 점: 시장 상황이 그때그때 환율에 반영된다.\n·   걱정되는 점: 환율이 자주 바뀌고, 1997년 외환위기 때처럼 갑자기 크게 오르내릴 수 있다.", model: "어느 쪽을 고르든 보기의 좋은 점과 걱정되는 점을 모두 비교했는지 본다. 고정환율제 예: 환율이 안정되어 계획 세우기가 쉽다는 점이 시장과 어긋날 걱정보다 크다고 판단. 변동환율제 예: 시장 상황이 반영된다는 점이 크고, 우리나라도 고정환율제 → 하루 변동 폭 제한 변동환율제(1990) → 완전한 변동환율제(1997)로 바뀌었다는 점을 근거로 들 수 있다." }, { prompt: "'원화 가치가 오르는 것(환율이 내리는 것)은 우리에게 늘 좋은 일이다.' 이 말에 찬성하는지 반대하는지 정하고, 보기를 참고하여 근거를 쓰시오.\n〈보기〉\n· 해외여행을 가는 지민이네: 1,000달러로 바꿔 가려고 한다. 환율이 1,100원에서 1,000원으로 내리면 110만 원이 아니라 100만 원만 내면 된다.\n· 물건을 외국에 파는(수출하는) 회사: 물건을 팔고 1,000달러를 받았다. 환율이 1,100원에서 1,000원으로 내리면 이 달러를 원화로 바꿀 때 110만 원이 아니라 100만 원만 받는다.", model: "찬성 예: 해외여행, 해외 직구처럼 달러를 사야 하는 사람은 더 적은 원화로 같은 달러를 살 수 있어 이득이다. 반대 예: 달러를 받아 원화로 바꾸는 수출 회사는 같은 1,000달러를 벌어도 받는 원화가 10만 원 줄어 손해를 본다. 같은 환율 변화라도 달러를 사는 쪽과 파는 쪽에 따라 반대로 작용한다는 점을 끌어낸다. 입장보다 보기의 두 경우를 근거로 썼는지 평가한다." }, { prompt: "신기는 해외여행 때 공항 라운지를 이용하는 것이 '소확행'이라며 지나친 소비가 아니라고 했다. 나에게 돈을 써도 아깝지 않은 소확행은 무엇인지 쓰고, 그것이 아깝지 않다고 생각하는 기준을 보기를 참고하여 쓰시오. 떠오르는 것이 없다면 용돈 3만 원이 생겼을 때 어디에 쓰고 싶은지 상상하여 쓰시오.\n〈보기〉\n· 소확행: 일상에서 느낄 수 있는 작지만 확실한 행복.\n· 기회비용: 어떤 것을 고르면서 포기한 것 가운데 가장 큰 가치. (예: 영화를 보면 그 돈으로 살 수 있었던 책을 포기한 것)\n· 기준의 예: 포기한 것보다 얻는 만족이 더 큰가? / 내 용돈 안에서 쓸 수 있는가? / 너무 자주 반복되어 부담이 되지 않는가?", model: "소확행은 일상에서 느낄 수 있는 작지만 확실한 행복이다(30쪽). 신기는 월급을 받아 적금을 넣고 나면 쓸 돈이 별로 없지만 해외여행 때 공항 라운지 이용은 지나친 소비가 아니라고 보았다. 예: 한 달에 한 번 좋아하는 책 사기 — 간식비를 포기하더라도 만족이 더 크고 오래가며, 용돈 안에서 쓸 수 있어 아깝지 않다. 기회비용과 비교하는 기준을 하나 이상 썼는지 본다." }] }
    ] },
    { title: "3장", range: "50~61쪽 · 들어오는 외화, 나가는 외화", boxes: [
      { heading: "3장 · 경제활동이 국경을 넘고 · 51쪽", text: "신기 일행이 암스테르담 식당에서 메뉴판을 보고 있다. 현지 가격에 환율을 곱하면 우리 돈으로 얼마인지 짐작할 수 있다. 신기가 환전할 때 원/유로 환율은 1,340원 정도였다. 첫 줄을 보고 나머지 음식의 원화 가격을 계산하여 표를 채우시오.\n\n〈표〉\n\n1) 음식: 텐더로인 스테이크 XL\n   현지 가격: 27.95유로\n   계산식: 27.95 × 1,340\n   원화 가격: 37,453원\n\n2) 음식: 햄버거\n   현지 가격: 10.95유로\n   계산식: [10.95 × 1,340@1095,1340]\n   원화 가격: [14,673원]\n\n3) 음식: 슈니첼\n   현지 가격: 11.95유로\n   계산식: [11.95 × 1,340@1195,1340]\n   원화 가격: [16,013원]", questions: [] },
      { heading: "3장 · 경제활동이 국경을 넘고 · 51쪽", text: "신기는 여행을 떠나기 전에 원화를 유로로 바꾸었다(환전). 그런데 떠나는 날 인천 공항에서 확인해 보니, 원/유로 환율이 환전할 때보다 10원 정도 내려 있었다. 현우는 '떠나기 바로 전에 환전했으면 좋았을 텐데, 누나가 실수한 거야?'라고 물었고, 신기는 실수가 아니라고 했다. 신기가 실수가 아니라고 한 까닭을 쓰시오. 또 환율이 내린 뒤에 환전했다면 어떤 점이 좋았을지 쓰시오.\n\n① 신기가 실수가 아니라고 한 까닭은 무엇인가요? [+외환 딜러의 환율 예측도 빗나가기 일쑤일 만큼, 환율은 쉬지 않고 바뀌어 미리 알기 어렵기 때문이다.@예측·예상·미리·알 수 없·어렵]\n② 환율이 내린 뒤에 환전했다면 어떤 점이 좋았을까요? [+1유로를 살 때 원화를 덜 내도 되니, 같은 돈으로 유로를 더 바꿀 수 있었다.@덜·적게·더 많이·더 바꿀·싸게·아낄·아꼈]", questions: [] },
      { heading: "3장 · 경제활동이 국경을 넘고 · 53쪽", text: "외환의 수요와 공급이 언제 생기는지 설명하는 글이다. 빈칸을 채우고, 표의 빈칸에 기업과 정부의 예를 쓰시오.\n\n한국에서 물건을 살 때는 원화를 내면 되니까 환전이 필요 없다. 하지만 해외여행 중에는 [원화]를 사용하지 못하니까 외화가 필요하다.\n반대로 외국인이 한국으로 여행 오면서 외화를 가져왔다면 이를 [원화]로 바꾸어야 한다.\n이처럼 개인, 기업, 정부의 경제활동이 (ㄱㄱ)[국경]을 넘어서 이루어지면 외환의 [수요]와 [공급]이 생긴다.\n즉 외환 거래는 다른 나라와 관련된 (ㄱㅈㅎㄷ)[경제활동]이 일어날 때 생긴다.\n\n〈표〉\n\n1) 누가: 개인\n   외환을 사거나 파는 예: 해외여행을 하려고 환전한다.\n\n2) 누가: 기업\n   외환을 사거나 파는 예: [+상품이나 서비스를 외국으로 팔거나 외국에서 사 온다.@수출·수입·팔·사 오·사오·사서]\n\n3) 누가: 정부\n   외환을 사거나 파는 예: [+외국에 돈을 빌려주거나 외국에서 돈을 빌린다.@빌]", questions: [] },
      { heading: "3장 · 달러를 사고 싶어? 난 달러를 팔고 싶어 · 54~56쪽", text: "달러의 수요와 공급을 구별하는 방법을 설명하는 글이다. 빈칸에 알맞은 말을 쓰시오.\n\n수요는 시장에서 일정한 가격을 지불하고 상품을 사려는 (ㅇㄱ)[욕구]이다. 그래서 달러의 수요는 외환시장에서 달러를 [사는@사·구입] 것이다.\n외국에 돈을 보낼 때는 원화로 보낼 수 없고 그 나라에서 쓸 수 있는 돈으로 보내야 한다. 그래서 돈이 한국에서 해외로 [나가면@나가·나간] 달러를 살 일이 생긴다.\n반대로 한국으로 들어온 달러를 원화로 바꾸려면 달러를 [팔아야@팔] 하니까 달러의 [공급]이 이루어진다.\n따라서 어떤 거래가 달러의 수요인지 공급인지 알려면, 달러가 [나갈지@나가·나갈·나간] [들어올지@들어]를 따져 보면 된다.", questions: [] },
      { heading: "3장 · 달러를 사고 싶어? 난 달러를 팔고 싶어 · 57쪽", text: "신기가 달러를 사는 경우를 표의 왼쪽에 먼저 채웠다. 왼쪽 거래와 반대로 달러가 들어오는 경우를 생각하여, 오른쪽 '달러를 파는 경우'를 채우시오.\n\n〈표〉\n\n1) 달러를 사는 경우(달러화 수요): 국민의 해외여행, 해외 유학\n   달러를 파는 경우(달러화 공급): [외국인의 한국 여행, 한국 유학@외국인]\n\n2) 달러를 사는 경우(달러화 수요): 상품의 수입\n   달러를 파는 경우(달러화 공급): [상품의 수출@수출]\n\n3) 달러를 사는 경우(달러화 수요): 한국에서 해외로 투자\n   달러를 파는 경우(달러화 공급): [외국에서 한국에 투자@외국,투자]\n\n4) 달러를 사는 경우(달러화 수요): 외국에 돈을 빌려줌\n   달러를 파는 경우(달러화 공급): [외국에서 돈을 빌림@빌림·빌린·빌리·빌려 옴·빌려 온·빌려 오·빌려 왔·빌려옴]\n\n5) 달러를 사는 경우(달러화 수요): 외국에서 빌린 돈을 갚음\n   달러를 파는 경우(달러화 공급): [외국에 빌려준 돈을 되돌려 받음@받]", questions: [] },
      { heading: "3장 · 달러를 사고 싶어? 난 달러를 팔고 싶어 · 55~56쪽", text: "다음 거래에서 돈이 한국에서 나가는지 들어오는지 따져 보고, 달러의 수요와 공급 가운데 어디에 해당하는지 쓰시오.\n\n〈표〉\n\n1) 거래: 외국에서 공부하는 자녀에게 생활비와 등록금을 보낸다.\n   돈이 나갈까, 들어올까?: 나간다\n   수요? 공급?: 수요\n\n2) 거래: 해외에 사는 친구에게 결혼 축의금을 보낸다.\n   돈이 나갈까, 들어올까?: [나간다@나가·나간·나감]\n   수요? 공급?: [수요]\n\n3) 거래: 한국에서 일하는 외국인 노동자가 번 돈을 자기 나라로 보낸다.\n   돈이 나갈까, 들어올까?: [나간다@나가·나간·나감]\n   수요? 공급?: [수요]\n\n4) 거래: 우리 국민이 해외에서 일하고 번 돈을 한국으로 보낸다.\n   돈이 나갈까, 들어올까?: [들어온다@들어]\n   수요? 공급?: [공급]\n\n5) 거래: 우리 기업이 상품이나 서비스를 외국에 수출한다.\n   돈이 나갈까, 들어올까?: [들어온다@들어]\n   수요? 공급?: [공급]", questions: [] },
      { heading: "3장 · 한 나라의 금전출납부, 국제수지 · 58~60쪽", text: "다음은 지민이의 한 달 용돈기입장이다. 표의 빈칸을 계산하여 채우고, 아래 설명하는 글의 빈칸을 채우시오.\n\n'수지'는 (ㄷㅇㅇㄴ ㄷ)[들어오는 돈]과 (ㄴㄱㄴ ㄷ)[나가는 돈]을 함께 이르는 말이다.\n집안 살림을 하면서 들어오고 나가는 돈을 모두 적은 금전출납부를 (ㄱㄱㅂ)[가계부]라고 한다.\n일정 기간 동안 한 나라가 외국과 거래하면서 일어난 모든 돈 거래를 기록한 것은 (ㄱㅈㅅㅈ)[국제수지]이다. 그래서 국제수지는 한 나라의 금전출납부라고 할 수 있다.\n들어오는 돈이 나가는 돈보다 많으면 (ㅎㅈ)[흑자], 나가는 돈이 들어오는 돈보다 많으면 (ㅈㅈ)[적자]라고 한다. 지민이의 이번 달 용돈기입장은 [흑자]이다.\n\n〈표〉\n\n1) 내용: 부모님께 받은 용돈\n   받은 돈(수입): 30,000원\n\n2) 내용: 할머니께 받은 돈\n   받은 돈(수입): 10,000원\n\n3) 내용: 친구와 떡볶이 사 먹음\n   쓴 돈(지출): 8,000원\n\n4) 내용: 문제집 삼\n   쓴 돈(지출): 12,000원\n\n5) 내용: 합계\n   받은 돈(수입): [40,000원]\n   쓴 돈(지출): [20,000원]\n\n6) 내용: 남은 돈(받은 돈 - 쓴 돈)\n   받은 돈(수입): [20,000원]", questions: [] },
      { heading: "3장 · 한 나라의 금전출납부, 국제수지 · 60~61쪽", text: "현우의 엄마는 집안으로 들어오는 돈이 나가는 돈보다 많아야 한다고 늘 강조한다. 신기는 나라도 마찬가지로 경상수지가 흑자인 것이 좋다고 했다. 경상수지 흑자가 나라에 좋은 까닭을 집안 살림에 빗대어 쓰시오. 또 경상수지 흑자가 지나치게 크면 어떤 문제가 생기는지 미국과 중국의 예를 들어 쓰시오.\n\n① 경상수지 흑자가 나라에 좋은 까닭을 집안 살림에 빗대어 쓰세요. [+집안에서 버는 돈이 쓰는 돈보다 많아야 저축할 여유가 생기듯이, 나라도 흑자로 여윳돈이 생긴다.@저축·여유·여윳돈·남]\n② 흑자로 생긴 여윳돈으로 나라는 무엇을 할 수 있나요? [+외국에 투자하거나 빌린 돈을 갚을 수 있어 경제를 더 건실하게 운영할 수 있다.@투자·갚·빚]\n③ 흑자가 지나치게 크면 어떤 문제가 생기나요? 미국과 중국의 예를 들어 쓰세요. [+적자를 보는 나라와 무역마찰이 생겨 관계가 나빠진다. 미국은 중국과의 무역에서 적자가, 중국은 흑자가 너무 커서 미국이 무역전쟁을 선포했다.@마찰·전쟁·갈등·다툼,미국·중국]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "쇼미는 '경상수지 흑자는 무조건 클수록 좋겠네.'라고 말했다. 쇼미의 말에 찬성하는지 반대하는지 입장을 정하고, 보기를 참고하여 근거를 두 가지 쓰시오.\n〈보기〉\n· 흑자의 좋은 점: 여윳돈이 생겨 외국에 투자할 수 있고, 빌린 돈을 갚을 수 있어 경제를 건실하게 운영할 힘이 생긴다.\n· 걱정되는 점: 흑자가 지나치게 크면 적자를 보는 나라와 무역마찰이 생겨 관계가 나빠질 수 있다. (예: 미국과 중국의 무역전쟁)\n· 한 나라의 흑자는 거래 상대 나라에게는 적자가 될 수 있다.", model: "책의 결론은 '꼭 그렇다고 할 수 없다'(60쪽). 반대: 지나친 흑자는 무역마찰과 관계 악화를 부르고(미·중 무역전쟁), 상대 나라가 수입을 막으면 결국 수출도 어려워진다. 찬성: 흑자로 투자 여력과 빚 갚을 힘이 생겨 경제가 건실해진다. 찬성하더라도 '무조건'이라는 말의 한계를 짚었는지, 근거가 보기 내용에 바탕을 두었는지 확인한다." }, { prompt: "환율은 쉬지 않고 바뀌어서 외환 딜러도 예측이 빗나가곤 한다. 내가 해외여행을 준비한다면 언제, 어떻게 환전할지 나만의 방법과 그 까닭을 쓰시오. 해외여행 경험이 없다면 가족에게 환전해 본 경험을 물어보거나, 여행을 간다고 상상하여 쓰시오.\n〈보기〉\n· 환율은 외환의 수요와 공급에 따라 계속 바뀐다.\n· 환율이 내릴 때 환전하면 같은 원화로 외화를 더 많이 바꿀 수 있다.\n· 한국은행은 매달 초순에 지난달의 국제수지를 발표한다. 이것을 보면 최근 흐름을 알 수 있다.", model: "'가장 싼 때를 정확히 맞히기는 어렵다'는 점을 전제로 했는지 본다. 예: 몇 주 전부터 환율을 지켜보다가 필요한 돈을 몇 번에 나누어 환전한다(오르내림이 평균이 됨). 예산을 미리 정하고 필요한 만큼만 환전한다. 국제수지 발표나 뉴스로 흐름을 참고한다. 방법과 까닭이 이어지면 충분하다." }, { prompt: "해외 직구, 해외 게임 결제, 외국인 관광객의 한국 쇼핑처럼 국경을 넘는 경제활동은 우리 주변에도 많다. 내 주변이나 뉴스에서 국경을 넘는 경제활동을 두 가지 찾아 쓰고, 각각 달러의 수요와 공급 가운데 어디에 해당하는지 까닭과 함께 쓰시오.\n〈보기〉\n· 판단 기준: 돈이 한국에서 해외로 나가면 달러의 수요, 해외에서 한국으로 들어오면 달러의 공급이다.", model: "해외 직구, 해외 게임·앱 결제, 해외 음원·영상 구독, 해외여행은 돈이 나가므로 수요. 외국인 관광객의 한국 쇼핑, 해외 팬의 K-팝 앨범·굿즈 구매, 외국인의 한국 유학은 돈이 들어오므로 공급. 문제에 나온 예를 그대로 쓰기보다 새 예를 찾았는지, 판단 기준을 근거로 썼는지 확인한다." }] }
    ] },
    { title: "4장", range: "64~83쪽 · 환율 변동과 경제는 끈끈한 사이", boxes: [
      { heading: "4장 · 환율이 오르면 수출이 늘어나 · 64~65쪽", text: "현우는 환율이 내리면 원화의 힘이 세지니까 환율은 내리는 게 좋다고 했다. 신기는 ‘통화가 강한 것’과 ‘통화 가치가 강해지는 것’은 다르다고 설명했다. 신기의 설명을 정리한 글의 빈칸을 채우시오.\n\n‘통화가 강하다’는 것은 달러화처럼 (ㄱㅈㄱㄹ)[국제거래]에서 자주 사용되고, 어느 나라에서든지 자유롭게 (ㄱㅎ)[교환]할 수 있으며, 통화 가치가 안정되어 국제적인 (ㅅㄹ)[신뢰]를 받는다는 뜻이다.\n환율이 내리면 원화 가치는 [강해지고@강해·강하·세지·올라] 달러화 가치는 [약해진다@약해·약하·내려]. 이것이 ‘통화 가치가 강해진다’는 뜻이다.\n하지만 환율이 내린다고 원화가 달러화보다 더 강한 통화가 되는 것은 [아니다@아니·않].\n한국 기업은 수출하거나 수입할 때 원화가 아니라 주로 [달러화]로 거래한다. 외국 기업들이 달러화 거래를 원하기 때문이다. 다른 나라에서는 [원화]를 사용할 일이 없기 때문이다.", questions: [] },
      { heading: "4장 · 환율이 오르면 수출이 늘어나 · 66쪽", text: "어느 정도의 환율이 가장 좋은지는 경제전문가들 사이에서도 의견이 다를 때가 많다. 무엇을 더 중요하게 생각하느냐에 따라 바라는 환율 방향이 어떻게 달라지는지 표의 빈칸을 채우시오.\n\n환율이 오르면 수출은 늘어나지만 물가는 불안해진다.\n\n〈표〉\n\n1) 더 중요하게 생각하는 것: 수출\n   바라는 환율 방향: [환율이 올라야 한다@올라·오르·상승]\n   그렇게 바라는 까닭: [+환율이 오르면 수출이 늘어나기 때문에@수출]\n\n2) 더 중요하게 생각하는 것: 물가 안정\n   바라는 환율 방향: [환율이 내려야 한다@내려·내리·하락·떨어]\n   그렇게 바라는 까닭: [+환율이 오르면 물가가 불안해지기 때문에@물가]", questions: [] },
      { heading: "4장 · 환율이 오르면 수출이 늘어나 · 67~70쪽", text: "한국 기업이 1대에 1,000달러인 텔레비전을 수출한다. 원/달러 환율이 1,100원에서 1,200원으로 올랐을 때 어떤 일이 생기는지 계산하며 빈칸을 채우시오.\n\n환율이 1,100원일 때 받는 돈: 1,000달러 × 1,100원 = [1,100,000]원\n환율이 1,200원일 때 받는 돈: 1,000달러 × 1,200원 = [1,200,000]원\n환율이 100원 오르니 텔레비전 1대를 수출하고 받는 돈이 [100,000]원 많아졌다.\n한국 기업이 환율이 오르기 전만큼의 (ㅇㅇ)[이윤]만 원한다면, 수출 가격을 950달러로 내려도 된다. 950달러 × 1,200원 = [1,140,000]원으로, 환율이 1,100원일 때 받던 [1,100,000]원보다 적지 않기 때문이다.\n엔/달러 환율은 그대로라서 일본 기업은 품질과 디자인이 비슷한 텔레비전을 예전처럼 [1,000]달러에 판다. 그러면 외국 소비자는 값이 더 싼 [한국] 텔레비전을 사게 된다.", questions: [] },
      { heading: "4장 · 환율이 오르면 수출이 늘어나 · 70쪽", text: "환율이 오르면 우리 경제에 어떤 변화가 차례로 일어나는지 빈칸을 채워 흐름을 정리하시오.\n\n원/달러 환율 상승\n→ 우리 수출품의 (ㄱㄱㄱㅈㄹ)[가격경쟁력]이 높아짐\n→ [수출]이 늘어남\n→ 국내 기업의 [생산]이 늘어남\n→ [일자리]가 늘어남\n→ 경제활동이 더 (ㅎㅂ)[활발]해짐", questions: [] },
      { heading: "4장 · 환율이 오르면 물가가 불안해져 · 71~72쪽", text: "미국의 트루먼 대통령은 ‘팔이 하나뿐인 경제학자’가 곁에 있으면 좋겠다고 푸념했다. 트루먼 대통령이 이런 말을 한 까닭을 쓰시오. 또 경제문제에 하나의 정답이 없는데도 신기가 경제를 공부해야 한다고 말한 까닭을 쓰시오.\n\n① 트루먼 대통령이 ‘팔이 하나뿐인 경제학자’가 곁에 있으면 좋겠다고 한 까닭은 무엇인가요? [+경제학자들이 늘 ‘한편으로는 이렇고, 다른 한편으로는 저렇다’고 말해서 최종 선택이 언제나 대통령 몫이 되었기 때문이다.@한편·두 가지·양쪽·둘 다·이렇고]\n② 경제문제에 하나의 정답이 없는데도 경제를 공부해야 하는 까닭은 무엇인가요? [+경제를 알면 경제문제를 해결하는 데 합당한 방법을 찾을 가능성이 커지고, 모르면 잘못된 결정을 내리기 쉽기 때문이다.@합당·올바른·좋은 방법·잘못된·해결]", questions: [] },
      { heading: "4장 · 환율이 오르면 물가가 불안해져 · 72~74쪽", text: "쇼미는 용돈을 모아 60달러짜리 가방을 해외 직구로 사려고 했는데, 그사이 원/달러 환율이 1,100원에서 1,200원으로 올랐다. 먼저 표의 빈칸을 계산하여 채우시오. 그다음 환율이 올라 비싸져도 꼭 수입해야 하는 물건 두 가지를 쓰고, 이 물건들의 값이 오르면 물가가 불안해지는 까닭을 식량자급률과 관련지어 설명하시오.\n\n〈표〉\n\n1) 환율: 1,100원일 때\n   60달러 가방을 원화로 내는 돈: [66,000원]\n\n2) 환율: 1,200원일 때\n   60달러 가방을 원화로 내는 돈: [72,000원]\n\n3) 환율: 더 내야 하는 돈\n   60달러 가방을 원화로 내는 돈: [6,000원]\n\n① 환율이 올라 비싸져도 꼭 수입해야 하는 물건 두 가지는 무엇인가요? [+원유와 수입 농수축산물@원유·석유,농·식량·먹을]\n② 이 물건들의 값이 오르면 물가가 불안해지는 까닭을 식량자급률과 관련지어 쓰세요. [+한국은 식량자급률이 40퍼센트대로 낮아 먹을거리를 많이 수입하므로, 수입 농수축산물 값이 오르면 장바구니 물가가 금방 영향을 받는다.@자급률·40]", questions: [] },
      { heading: "4장 · 경제가 불안하면 환율이 폭등해 · 75~77쪽", text: "현우와 쇼미는 환율이 오를 때와 내릴 때 경제에 어떤 일이 생기는지 주고받으며 정리했다. 글의 빈칸을 채우고, 표의 빈칸에 ‘늘어난다’, ‘줄어든다’, ‘올라간다’, ‘안정된다’ 가운데 알맞은 말을 쓰시오.\n\n달러를 [사야@사] 하는 사람은 환율이 오르면 걱정이고 내리면 신이 난다. 반대로 달러를 [팔아야@팔] 하는 사람은 환율이 오르면 신이 나고 내리면 속상하다.\n이처럼 환율은 올라도 내려도 (ㅈㄷㅈ)[장단점]이 있다. 그래서 신기는 환율이 그 나라의 경제 상황이나 화폐 가치를 잘 반영하고, 경제활동에 큰 (ㅊㄱ)[충격]을 주지 않는 범위 안에서 (ㅈㅇㅅㄹㄱ)[자연스럽게] 오르내리는 것이 좋다고 했다.\n\n〈표〉\n\n1) 구분: 수출\n   환율이 오를 때: 늘어난다\n   환율이 내릴 때: [줄어든다@줄]\n\n2) 구분: 수입\n   환율이 오를 때: [줄어든다@줄]\n   환율이 내릴 때: [늘어난다@늘]\n\n3) 구분: 국내 생산\n   환율이 오를 때: [늘어난다@늘]\n   환율이 내릴 때: 줄어든다\n\n4) 구분: 물가\n   환율이 오를 때: [올라간다@올라·오른·오르·상승]\n   환율이 내릴 때: [안정된다@안정]\n\n5) 구분: 해외여행·유학생 송금에 드는 돈\n   환율이 오를 때: [늘어난다@늘]\n   환율이 내릴 때: [줄어든다@줄]", questions: [] },
      { heading: "4장 · 경제가 불안하면 환율이 폭등해 · 77쪽", text: "환율이 경제에 영향을 주고, 경제 상황이 다시 환율에 영향을 준다. ‘환율 상승’에서 시작하는 흐름의 빈칸에 ‘늘어남’, ‘줄어듦’, ‘상승’, ‘하락’ 가운데 알맞은 말을 쓰시오.\n\n환율 상승\n→ 수출은 [늘어남@늘], 수입이나 해외여행은 [줄어듦@줄]\n→ 외환 공급은 [늘어남@늘], 외환 수요는 [줄어듦@줄]\n→ 환율 [하락@하락·내려·떨어]\n→ 수출은 [줄어듦@줄], 수입이나 해외여행은 [늘어남@늘]\n→ 외환 공급은 [줄어듦@줄], 외환 수요는 [늘어남@늘]\n→ 환율 다시 [상승@상승·올라·오름·오른]", questions: [] },
      { heading: "4장 · 경제가 불안하면 환율이 폭등해 · 78~81쪽", text: "1997년 외환위기가 어떻게 일어났는지 빈칸을 채워 흐름을 정리하시오.\n\n우리 기업들이 다른 나라 기업들보다 돈을 훨씬 많이 빌려서 회사를 꾸려 옴\n→ 1997년 초 제법 알려진 대기업들이 잇따라 (ㅂㄷ)[부도]를 냄\n→ 1997년 7월부터 태국, 인도네시아, 말레이시아 등 다른 [아시아] 국가들의 경제도 불안해짐\n→ 외국 투자자들이 한국 주식을 팔고, 대출 (ㅁㄱㅇ)[만기일]에 빌려준 돈을 꼭 갚으라고 요구함\n→ 주식을 판 돈을 해외로 보내고 외채를 갚으려면 [외환]이 필요해서 외환 [수요]가 갑자기 늘어남\n→ 환율이 계속 올라감\n→ 정부가 (ㅇㅎㅂㅇㅇ)[외환보유액]을 풀어 외화를 공급했지만 거의 바닥남\n→ 1997년 11월 21일, 정부가 IMF에 (ㄱㅈ ㄱㅇ)[구제 금융]을 신청하겠다고 발표함", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "환율이 오르면 반가운 사람도 있고 걱정하는 사람도 있다. 보기의 세 사람 가운데 한 사람을 골라, 그 사람이 환율이 오르기를 바랄지 내리기를 바랄지 쓰고 까닭을 쓰시오.\n〈보기〉\n· 수출 기업 사장: 텔레비전을 1대에 1,000달러를 받고 외국에 판다.\n· 해외 직구를 자주 하는 소비자: 60달러짜리 가방처럼 외국 물건을 달러로 산다.\n· 유학 간 자녀를 둔 부모: 자녀에게 생활비와 학비를 달러로 바꾸어 보낸다.\n· 도움말: 달러를 사야 하는 사람은 환율이 오르면 걱정이고, 달러를 팔아야 하는 사람은 환율이 오르면 신이 난다.", model: "수출 기업 사장: 달러를 벌어 원화로 바꾸므로 환율 상승을 바란다(110만 원→120만 원, 값을 내려 가격경쟁력도 높일 수 있음). 부품을 수입하면 부품값도 오른다는 점까지 쓰면 우수. 직구 소비자: 같은 60달러라도 66,000원→72,000원이 되므로 환율 하락을 바란다. 유학생 부모: 달러를 사서 보내야 하므로 환율 하락을 바란다(옆집 아주머니 사례). 입장에 맞는 방향과 계산 또는 책 사례를 근거로 들었는지 본다." }, { prompt: "‘환율은 내리는 것보다 오르는 것이 우리나라 경제에 더 좋다’는 주장에 찬성하는지 반대하는지 정하고, 보기를 참고하여 근거를 두 가지 쓰시오.\n〈보기〉\n· 환율이 오를 때 좋은 점: 수출품의 가격경쟁력이 높아져 수출이 늘고, 국내 생산과 일자리가 늘어난다.\n· 환율이 오를 때 걱정되는 점: 원유와 수입 농수축산물 값이 올라 물가가 불안해진다. 물가가 오르면 소비가 줄고, 소비가 줄면 생산도 줄어든다. 해외여행이나 유학생 송금에 돈이 더 든다.\n· 환율이 내릴 때 좋은 점: 물가가 안정되고, 수입품과 해외여행 비용이 싸진다.\n· 환율이 내릴 때 걱정되는 점: 수출이 줄어들고 경제가 침체될 우려가 있다.", model: "찬성: 우리나라는 수출 비중이 커서 수출이 늘면 생산과 일자리가 늘어난다. 많은 나라 정부도 수출을 늘리려고 자기 나라 통화 가치가 낮아지기를 바라는 경향이 있다(71쪽). 반대: 원유와 식량을 많이 수입해서 환율이 오르면 물가가 바로 불안해진다. 물가가 오르면 소비가 줄고 생산이 줄어 수출이 늘어도 마냥 좋아할 수 없다(71쪽). 어느 편이든 ‘다른 한편’도 인정하고, 신기의 말처럼 경제에 큰 충격을 주지 않는 범위에서 자연스럽게 오르내리는 것이 좋다는 결론으로 이어 가면 좋다." }, { prompt: "1997년 외환위기 같은 일이 다시 일어나지 않으려면 정부와 기업이 각각 무엇을 해야 할지 보기를 참고하여 쓰시오.\n〈보기〉\n· 1997년 우리 기업들은 돈을 많이 빌려서 회사를 꾸렸고, 빚을 갚고 나면 빈껍데기만 남는 기업도 많았다.\n· 외국 투자자들은 전에는 대출 만기일에 이자만 받고 원금은 다시 빌려주었다. 그래서 기업들은 원금 갚을 돈을 따로 마련하지 않았다.\n· 외환보유액이 거의 바닥났다는 사실이 알려지며 경제는 공황 상태가 되었다.\n· 신기는 지금은 위기를 관리하는 제도가 많이 만들어졌고, 나라의 비상금인 외환보유고도 많이 늘었다고 했다.", model: "정부: 외환보유액을 넉넉히 준비하고, 위기를 관리하는 제도를 갖추며, 경제 상황을 분석해 미리 대처한다(80, 83쪽). 기업: 빚을 지나치게 많이 내서 회사를 꾸리지 않고, 대출 만기에 대비해 갚을 돈을 따로 마련하며 경쟁력을 키운다(78~79쪽). 두 주체를 모두 쓰고 보기와 연결했는지 본다. 개인의 역할(경제 공부, 무리한 빚 피하기)을 덧붙이면 우수." }] }
    ] },
    { title: "5장", range: "86~101쪽 · 없으면 필요하고, 필요하면 무역하고", boxes: [
      { heading: "5장 · 나라와 나라 사이에 이루어지는 국제거래 · 86~87쪽", text: "네덜란드는 땅이 좁고 낮으며 역사도 짧은 나라였다. 그런데도 17세기 중엽 네덜란드가 세계 무역의 70퍼센트 정도를 담당했다고 한다. 설명글의 빈칸을 채워 네덜란드의 불리한 조건을 정리하고, 표를 채워 '70퍼센트'라는 말의 근거를 확인하시오.\n\n네덜란드라는 이름은 '(ㅂㄷㅂㄷ ㄴㅇ ㄸ)[바다보다 낮은 땅]'이라는 뜻이다. 해발 1미터를 넘는 땅은 국토의 [절반]뿐이고, [6분의 1|1/6]은 바다보다 낮은 곳을 메꾸어 만든 땅이다. 국토 면적도 한국의 [절반]이 안 된다.\n역사도 길지 않다. 1581년 [스페인]의 통치에 저항한 북부 7개 주가 독립을 선언하면서 세워졌고, [1648]년에야 국제적으로 독립을 인정받았다.\n그런데도 17세기 네덜란드는 배를 만드는 (ㅈㅅㅇ)[조선업]과 화물을 운송하는 (ㅎㅇㅇ)[해운업]에서 월등한 경쟁력을 가졌고, 이를 바탕으로 세계 최고의 경제력을 지닌 황금기를 이루었다.\n\n〈표〉\n\n1) 17세기 중엽: 세계의 무역선\n   배의 수: [2만 1000척@21000·2만1000]\n\n2) 17세기 중엽: 그중 네덜란드의 배\n   배의 수: [1만 5000척@15000·1만5000]\n\n3) 17세기 중엽: 네덜란드 배 ÷ 세계 무역선\n   배의 수: [15000÷21000 ≒ 0.71 → 약 70퍼센트@70·071]", questions: [] },
      { heading: "5장 · 나라와 나라 사이에 이루어지는 국제거래 · 88쪽", text: "현우와 신기는 '무역'이라는 말을 서로 다르게 이해했다. 두 사람이 생각한 무역의 뜻과 네덜란드 사람들이 주로 한 무역을 정리한 글이다. 빈칸을 채우시오.\n\n현우는 무역이 나라 안에서 생산한 상품을 다른 나라에 팔고 필요한 상품을 사 오는 것, 곧 상품의 [수출]과 [수입]을 합친 말이라고 생각했다. 그래서 네덜란드처럼 작은 나라가 어떻게 세계 최고의 무역국가가 되었는지 이상하게 여겼다.\n신기는 자기 나라에서 (ㅅㅂ)[소비]하기 위해서가 아니라 (ㄷㅍㄱ)[되팔기] 위해 이루어지는 나라와 나라 사이의 거래도 무역이라고 보충해 주었다.\n네덜란드 사람들은 다른 나라의 상품을 사서 이를 또 다른 나라에 파는 일을 주로 했다. 자기들이 필요해서 물건을 사고판 것이 아니라, 사들인 상품을 그대로 또 다른 나라에 팔아 그 (ㅊㅇ)[차액]으로 (ㅇㅇ)[이익]을 얻은 것이다. 이런 무역을 (ㅈㄱㅁㅇ)[중계무역]이라고 한다.", questions: [] },
      { heading: "5장 · 나라와 나라 사이에 이루어지는 국제거래 · 89~90쪽", text: "옛날 유럽에서는 후추 값이 금가루 값과 비슷할 만큼 비쌌다. 후추 값이 비싸진 과정과, 그 때문에 15세기 스페인과 포르투갈이 한 일을 흐름에 따라 정리하시오.\n\n상인들이 생산지에서 후추를 사서 다른 지역의 시장에 가서 팖\n→ 다른 상인들이 그 후추를 사서 또 다른 지역으로 가져가 팖\n→ 여러 상인의 손을 거칠 때마다 (ㅇㄷ)[웃돈]이 붙음(중간 상인 역할을 한 이슬람 상인과 [이탈리아] 상인은 큰돈을 범)\n→ 유럽에서 후추 값이 (ㄱㄱㄹ)[금가루] 값과 비슷해짐\n→ 스페인과 포르투갈 사람들이 중간 상인을 거치지 않고 아시아와 (ㅈㅈ)[직접] 무역하려고 새로운 (ㅎㄹ)[항로]를 찾아 나섬(두 나라 (ㅇㅅ)[왕실]이 적극 지원)\n→ 이 과정에서 콜럼버스의 (ㅇㅁㄹㅋ ㄷㄹ ㅂㄱ)[아메리카 대륙 발견]과 마젤란의 (ㅅㄱ ㅇㅈ)[세계 일주]가 이루어짐", questions: [] },
      { heading: "5장 · 나라와 나라 사이에 이루어지는 국제거래 · 90~91쪽", text: "네덜란드는 스페인과 포르투갈보다 늦게 아시아 무역에 뛰어들었지만 결국 무역을 장악했다. 먼저 표를 채워 암스테르담호 같은 네덜란드 배의 특징을 정리하시오. 그다음, 스페인과 포르투갈은 정부가 무역을 주도해서 상인들에게 돌아가는 몫이 적었다는 점과 비교하여, 네덜란드 정부가 동인도회사를 어떻게 만들고 어떤 권한을 주었는지, 그 덕분에 상인들에게 어떤 환경이 만들어졌는지 쓰시오.\n\n〈표〉\n\n1) 배의 생김새: 배 양옆을 불룩 튀어나오게 함\n   그래서 좋아진 점: [화물을 더 많이 실을 수 있음@화물·짐·많이]\n\n2) 배의 생김새: 갑판을 아주 좁게 만듦\n   그래서 좋아진 점: [+출발과 정지가 쉽고, 폭풍우에 잘 견디고, 속력이 빨라짐@출발·정지·폭풍·빨라·빠르·속력]\n\n3) 배의 생김새: 배를 생산하는 비용\n   그래서 좋아진 점: [+오히려 줄어서 다른 나라들이 네덜란드의 화물 운송 경쟁력을 따라잡을 수 없었음@줄·적게·싸]\n\n① 네덜란드 정부는 동인도회사를 어떤 형태로 만들었나요? [+1602년 세계 최초로 주식회사 형태로 만들었다.@주식회사]\n② 네덜란드 정부는 동인도회사에 어떤 권한을 주었나요? [+무역 독점권, 외국과의 조약 체결, 전쟁 선포처럼 국가 기능을 대신할 수 있는 권한을 주고 자유롭게 무역하게 했다.@독점·조약·전쟁·국가]\n③ 그 덕분에 상인들에게 어떤 환경이 만들어졌나요? 정부가 무역을 주도한 스페인·포르투갈과 비교해서 쓰세요. [+상인 몫이 적었던 스페인·포르투갈과 달리, 상인들이 위험을 무릅쓰고 무역에 뛰어들 수 있는 환경이 만들어졌다.@위험·뛰어·자유·몫·이익]", questions: [] },
      { heading: "5장 · 나라와 나라 사이에 이루어지는 국제거래 · 91쪽", text: "무역의 뜻은 시대에 따라 넓어졌다. 설명글의 빈칸을 채우고, 보기의 거래가 보이는 무역인지 보이지 않는 무역인지 표에 쓰시오.\n\n오랫동안 무역은 서로 다른 나라 사이에서 이루어지는 [상품] 거래만을 뜻했다.\n그런데 1990년대 무역은 상품의 거래인 (ㅂㅇㄴ ㅁㅇ)[보이는 무역]뿐만 아니라 기술과 서비스와 같은 (ㅂㅇㅈ ㅇㄴ ㅁㅇ)[보이지 않는 무역]으로 확대되었다. 그래서 무역은 상품과 서비스 거래는 물론 [노동]과 [자본] 거래까지 모두 포함하는 말로 쓰였다.\n요즘은 다른 나라 사이의 상품 거래는 [무역]이라고 하고, 나라와 나라 사이에 일어나는 모든 거래는 주로 (ㄱㅈㄱㄹ)[국제거래]라고 할 때가 많다.\n\n〈표〉\n\n1) 거래: 한국 회사가 베트남에 텔레비전을 수출한다.\n   보이는 무역 / 보이지 않는 무역: [보이는 무역]\n\n2) 거래: 한국 회사가 외국 회사의 기술을 쓰고 사용료를 낸다.\n   보이는 무역 / 보이지 않는 무역: [보이지 않는 무역]\n\n3) 거래: 우리나라가 외국에서 바나나를 수입한다.\n   보이는 무역 / 보이지 않는 무역: [보이는 무역]\n\n4) 거래: 외국인 관광객이 한국 여행사의 안내 서비스를 받고 돈을 낸다.\n   보이는 무역 / 보이지 않는 무역: [보이지 않는 무역]", questions: [] },
      { heading: "5장 · 바나나가 자라는 나라, 바나나를 먹고 싶은 나라 · 93~95쪽", text: "신기는 사람들이 무역을 좋아했다기보다는 무역이 필요했던 것이라고 말했다. 오늘날에도 국제거래가 일어나는 까닭 두 가지를 정리한 글이다. 빈칸을 채우시오.\n\n첫째, 나라마다 처한 (ㅈㅇㅎㄱ)[자연환경]이 다르다. 그래서 생산할 수 있는 천연자원이나 농수산물의 종류와 양이 차이가 나므로, 남는 자원은 [수출]하고 필요한 자원은 [수입]한다. 예를 들어 우리나라는 (ㅇㅇ)[원유]가 한 방울도 나지 않으므로 수입하지 못하면 당장 자동차를 탈 수 없다.\n둘째, 나라마다 (ㅅㅅㅇㅅ)[생산요소]의 양과 질이 다르다. 생산요소는 재화나 서비스를 생산하는 데 꼭 필요한 것이다. 사람의 [노동], 자연에서 얻은 [자원], 그리고 [자본]을 생산의 3요소라 하고, 여기에 [기술]을 합쳐 생산의 4요소라고도 한다.\n생산요소를 가장 효율적으로 쓰려면 나라마다 (ㅂㄱㅇㅇ)[비교우위]가 있는 상품을 생산해 수출하고, 그렇지 않은 상품은 수입하면 된다. 그래서 노동력이 풍부한 나라는 사람 손이 많이 가는 상품을, 자본이 풍부하고 기술력이 뛰어난 나라는 (ㅊㄷ ㅅㅇ)[첨단 산업] 제품을 주로 생산한다.", questions: [] },
      { heading: "5장 · 바나나가 자라는 나라, 바나나를 먹고 싶은 나라 · 95쪽", text: "표의 빈칸을 계산해 채우고, 설명글의 빈칸을 채우시오.\n\n민준이와 서연이는 모둠 과제로 '자료 조사 1쪽'과 '발표 자료 1쪽'을 만들어야 한다. 아래 표는 두 사람이 한 쪽을 만드는 데 걸리는 시간이다. 민준이는 두 가지 일 모두 서연이보다 빠르다.\n\n민준이는 두 가지 일 모두 서연이보다 빠르다. 그래도 서연이와 견주어 시간 차이가 더 크게 나는 일, 곧 민준이가 상대적으로 더 잘하는 일은 [자료 조사]이다.\n서연이는 두 가지 일 모두 민준이보다 느리지만, 상대적으로 덜 뒤처지는 일은 [발표 자료] 만들기이다.\n그러니 민준이는 [자료 조사]를, 서연이는 [발표 자료] 만들기를 맡는 것이 모둠 전체로 유리하다. 이처럼 남보다 상대적으로 더 유리하게 할 수 있는 것을 (ㅂㄱㅇㅇ)[비교우위]라고 한다.\n\n〈표〉\n\n1) 구분: 민준\n   자료 조사 1쪽: 10분\n   발표 자료 1쪽: 20분\n\n2) 구분: 서연\n   자료 조사 1쪽: 20분\n   발표 자료 1쪽: 25분\n\n3) 구분: 민준 시간 ÷ 서연 시간\n   자료 조사 1쪽: [10÷20=0.5(50퍼센트)@50·05·절반]\n   발표 자료 1쪽: [20÷25=0.8(80퍼센트)@80·08]", questions: [] },
      { heading: "5장 · 결제수단이 은화에서 파운드로, 파운드에서 달러로 · 99쪽", text: "현우는 은화는 그 자체로 가치가 있지만 지폐는 종이나 다름없으니 찜찜하지 않았을까 물었다. 신기는 당시 영국 파운드화는 종이가 아니라 금이나 마찬가지여서 문제가 없었다고 답했다. 금본위제도가 무엇인지 쓰고, 이 제도를 만든 목적을 쓰시오.\n\n① 금본위제도에서 중앙은행은 화폐를 어떻게 발행하나요? [+중앙은행이 가지고 있는 금의 한도 안에서만 화폐를 발행한다.@금,한도·만큼·안에서·범위]\n② 이 화폐를 중앙은행에 가져가 바꿔 달라고 하면 어떻게 해 주나요? [+무조건 금을 내준다(금으로 바꾸어 준다).@금]\n③ 금본위제도를 만든 목적은 무엇인가요? [+화폐의 신용을 보장하고, 중앙은행이 마구 돈을 발행하여 경제를 어지럽히는 일을 막기 위해서이다.@신용·믿·마구·함부로·막]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "만약 우리나라가 1년 동안 다른 나라와 무역을 전혀 하지 않는다면 나의 하루는 어떻게 달라질지, 아침에 일어나서 잠들 때까지를 상상하여 쓰시오. 보기를 참고하여 두 가지 이상의 장면을 구체적으로 쓰시오.\n〈보기〉\n· 우리나라에서는 원유가 한 방울도 나지 않는다.\n· 바나나 같은 과일은 대부분 외국에서 수입한다.\n· 저렴하게 살 수 있었던 수입품 대신 가격이 높더라도 국내 생산품만 사야 한다.\n· 처음에는 큰 혼란이 오지만, 나중에는 다른 에너지를 쓰는 교통수단처럼 적응하는 방법을 찾게 된다.", model: "책 93~96쪽 근거(원유·자동차, 바나나, 생활비 증가, 적응). 아침(수입 과일·밀가루 없음) → 등교(버스·자동차 연료 부족) → 학교(수입 부품이 든 전자기기, 'Made in China' 학용품·옷) → 저녁(비싸진 물건값) 순으로 시간 흐름에 맞게 썼는지, 혼란과 적응을 함께 생각했는지 본다." }, { prompt: "'쌀처럼 꼭 필요한 상품은 다른 나라에서 더 싸게 살 수 있더라도 비싸게라도 우리나라에서 모두 생산해야 한다.' 이 주장에 찬성하는지 반대하는지 정하고, 보기를 참고하여 그 까닭을 쓰시오.\n〈보기〉\n· 나라마다 비교우위가 있는 상품을 생산해 수출하고, 그렇지 않은 상품은 수입하는 것이 생산요소를 가장 효율적으로 쓰는 방법이다.\n· 수입품 대신 비싼 국내 생산품만 사야 한다면 생활비가 크게 늘어난다.\n· 원유처럼 수입이 갑자기 막히면 나라 전체에 큰 혼란이 올 수 있다.\n· 국내에서 생산하면 농민들의 일자리와 소득을 지킬 수 있다.", model: "찬성: 수입이 막히면 큰 혼란(원유 예), 먹을거리처럼 생존에 필요한 것은 스스로 마련해야 안전함, 농민 일자리 보호. 반대: 비교우위에 따라 수입하는 것이 효율적, 국내산만 사면 생활비가 늘어남, 아낀 생산요소를 비교우위 상품에 쓸 수 있음. 어느 쪽이든 보기 가운데 두 가지 이상을 근거로 들었는지, 반대 의견의 걱정도 한 번 짚었는지 본다." }, { prompt: "네덜란드는 좁고 낮은 땅, 짧은 역사라는 불리한 조건에서도 황금기를 이루었다. 보기에서 네덜란드가 성공한 까닭 하나를 골라, 자원이 부족한 우리나라가 그 점을 어떻게 배울 수 있을지 쓰시오.\n〈보기〉\n· 배를 만드는 조선업과 화물을 운송하는 해운업에서 월등한 경쟁력을 가졌다.\n· 세계 최초의 주식회사인 동인도회사를 만들어 상인들이 위험을 무릅쓰고 무역에 뛰어들 환경을 만들었다.\n· 화물을 더 싣고 더 빠르면서도 만드는 비용은 줄인 배를 개발했다.\n· 자기 나라 상품이 아니어도 다른 나라 상품을 사서 또 다른 나라에 되파는 중계무역을 했다.", model: "책 87~92쪽 근거. 우리나라에 적용하는 예: 기술 개발로 첨단 산업 경쟁력 키우기, 새로운 회사가 도전할 수 있는 제도 만들기, 바다를 활용한 조선·해운 산업, 물류 중심지(항만·공항) 역할 등. '황금기는 운이 좋아 얻어진 게 아니다'(92쪽)를 활용하면 좋다. 고른 까닭과 우리나라의 적용이 서로 이어지는지 본다." }] }
    ] },
    { title: "6장", range: "104~131쪽 · 이번 선발투수는 자유무역입니다", boxes: [
      { heading: "6장 · 자유무역 대 보호무역 대 자유무역 · 105~106쪽", text: "네덜란드가 17세기에 세계 최강대국의 황금기를 맞기까지의 과정을 정리하시오.\n\n14세기 네덜란드의 최고 생산물은 유럽 사람들의 주요 단백질 공급원이었던 생선 [청어]\n→ 어부 빌럼 뵈켈손이 청어의 내장을 없애고 머리를 도려 낸 뒤 [소금]에 절여 오래 (ㅈㅈ)[저장]하는 방법을 고안함\n→ 멀리 (ㅈㅈㅎ)[지중해] 연안까지 청어를 수출하게 되어 (ㅎㅎㅅ)[항해술]이 발달함\n→ (ㅈㅅㅇ)[조선업]과 무역업이 발달함\n→ 17세기 황금기: 동인도회사를 세계 최초의 (ㅈㅅㅎㅅ)[주식회사] 형태로 세우고, 세계 최초로 (ㅈㄱㄱㄹㅅ)[증권거래소]를 세움", questions: [] },
      { heading: "6장 · 자유무역 대 보호무역 대 자유무역 · 106~108쪽", text: "설명글의 빈칸을 채우고, 산업혁명 이전 학자들의 생각과 애덤 스미스의 생각을 비교하는 표를 완성하시오.\n\n산업혁명 전까지 유럽 국가들은 모두 국내 산업을 보호하기 위해 수입을 제한하는 (ㅂㅎㅁㅇ)[보호무역]정책을 폈다.\n그런데 영국의 경제학자 애덤 스미스가 국가의 부에 대한 생각을 바꾸어 놓았다. 그는 1776년 출판한 《(ㄱㅂㄹ)[국부론]》에서 국가의 부강은 생산을 얼마나 효율적으로 하는가에 달렸다고 밝혔다.\n산업혁명으로 기술력이 높아져 공산품 수출에 자신이 생긴 영국은 19세기 중반 (ㅈㅇㅁㅇ)[자유무역]정책으로 돌아섰다. 원료 수입 관세는 거의 없애고, 공산품 수입 관세는 크게 [낮추고@낮추·낮췄·내리·내렸], 곡물 수입 관세는 아예 (ㅍㅈ)[폐지]했다.\n\n〈표〉\n\n1) 구분: 국가의 부를 결정하는 것\n   산업혁명 이전 학자들의 생각: 가지고 있는 금과 은의 양\n   애덤 스미스의 생각: [+노동과 자본을 잘 이용해 생산을 얼마나 효율적으로 하느냐@효율·생산]\n\n2) 구분: 세상의 부\n   산업혁명 이전 학자들의 생각: [+일정하게 정해져 있다(그래서 부강해지려면 다른 나라의 부를 빼앗아야 한다)@일정·정해·한정·빼앗]\n   애덤 스미스의 생각: 효율적인 생산을 통해 무한히 커질 수 있다\n\n3) 구분: 바람직한 무역\n   산업혁명 이전 학자들의 생각: [+수출이 수입보다 많아야 하므로 수입을 제한하는 보호무역@보호·수입을 제한·수입 제한]\n   애덤 스미스의 생각: [+나라마다 비교우위에 있는 상품을 전문적으로 생산해 서로 사고파는 자유무역@자유·비교우위]", questions: [] },
      { heading: "6장 · 경제 회복을 위해 브레턴우즈로 모인 세계 · 111~114쪽", text: "현우는 옛날 네덜란드 상인들은 상품을 배에 싣고 가서 직접 팔았는데 지금은 어떻게 무역을 하는지 궁금해했다. 설명글의 빈칸을 채우고, 옛날 무역과 지금 무역을 비교하는 표를 완성하시오.\n\n옛날 무역은 시장에서 장을 보는 것처럼 팔 사람과 살 사람이 서로 만나서 돈과 상품을 맞바꾸는 식이었다.\n돈을 먼저 주고 물건을 받기로 하면 [수입업자]가 불안하고, 물건을 먼저 보내고 나중에 돈을 받으면 [수출업자]가 불안하기 때문이다.\n20세기 초부터 신용의 상징인 (ㅇㅎ)[은행]이 수출업자와 수입업자 사이에서 (ㅈㄱ)[중개] 역할을 하며 이런 불안을 줄여 주자, 직접 만나서 하는 거래는 서서히 줄어들었다.\n\n〈표〉\n\n1) 구분: 거래하는 방법\n   옛날 무역: 팔 사람과 살 사람이 직접 만나서 거래함\n   지금 무역: [+샘플만 보고 상품의 양과 가격을 정한 뒤 계약을 함@샘플·계약]\n\n2) 구분: 돈을 주고받는 방법\n   옛날 무역: 만난 자리에서 돈과 상품을 맞바꿈\n   지금 무역: [+수입업자가 은행을 통해 수입대금을 줌@은행]\n\n3) 구분: 상품을 옮기는 방법\n   옛날 무역: 상인이 상품을 배에 싣고 살 사람이 있는 곳으로 가서 직접 팖\n   지금 무역: [+수출업자가 해운업자에게 상품 운송을 맡김@해운·운송·맡]", questions: [] },
      { heading: "6장 · 경제 회복을 위해 브레턴우즈로 모인 세계 · 114~116쪽", text: "브레턴우즈 협정에 대한 설명글을 읽고 빈칸을 채우시오.\n\n1944년 7월 미국 뉴햄프셔주 브레턴우즈에 [44]개국 대표들이 모여 전쟁 이후 세계 경제를 되살릴 방법을 토론했다.\n이들은 자유무역을 보장하고 국제거래를 안정시킬 수 있는 (ㄱㅈㅌㅎㅅㅅㅌ)[국제통화시스템]을 갖추어야 한다고 했다. 나라마다 수출을 늘리려고 경쟁적으로 자기 나라 통화의 가치를 (ㄴㅊㅇ)[낮추어@낮추·낮췄·내리·떨어뜨] 버린 것도 세계 경제를 어렵게 만든 원인 중 하나라고 보았기 때문이다.\n브레턴우즈 협정에 따라 공산품과 원자재 무역에서 모든 무역장벽을 없애자는 '관세 및 무역에 관한 일반 협정', 곧 [GATT]를 맺었다. 또 1945년 국제경제기구인 IMF와 [IBRD]를 탄생시켰다. IBRD는 처음에 유럽 국가들의 전쟁 피해 (ㅂㄱ)[복구]를 위해 만들어졌고, 지금은 (ㅅㄱㅇㅎ)[세계은행]이라고 불린다.\n국제 통화를 무엇으로 할지 토론할 때 영국은 세계가 함께 관리하는 국제 통화를 만들자고 했다. 그러나 미국은 (ㄱㅂㅇㅈㄷ)[금본위제도]를 되살릴 테니 (ㄷㄹㅎ)[달러화]를 기축통화로 하자고 다른 나라들을 설득했다.\n달러와 금을 바꾸는 비율이 (ㅇㅈ)[일정]했기 때문에 자기 나라의 금 가격만 알면 두 통화 사이의 (ㅎㅇ)[환율]을 구할 수 있었다.\n그 뒤 세계무역량은 1950년 621억 달러에서 1973년 5740억 달러로 약 [9]배 늘어났다. 1973년 석유파동이 일어나기 전까지 세계 경제는 비교적 순탄하게 성장했다.", questions: [] },
      { heading: "6장 · 시장개방을 외친 신자유주의 사상 · 121~122쪽", text: "1973년 1차 석유파동이 세계 경제를 어떻게 흔들었는지 순서대로 정리하시오.\n\n1973년 이집트와 시리아가 이스라엘을 침공했으나, 이스라엘이 [미국]의 도움을 받아 물리침\n→ 중동 산유국들이 미국의 중동 정책에 항의하며 (ㅇㅇ ㄱㄱ)[원유 가격]을 거의 [4]배로 올림\n→ 원유를 원료로 하는 (ㅅㅇㅎㅎㅈㅍ)[석유화학제품]의 가격이 오름\n→ 다른 제품을 사는 데 쓸 돈이 줄어 전체적으로 (ㅅㅂ)[소비]가 줄어듦\n→ 기업이 (ㅅㅅ)[생산]을 줄여 경제가 (ㅊㅊ)[침체]됨\n→ 경제는 침체되는데 물가는 오르는 (ㅅㅌㄱㅍㄹㅇㅅ)[스태그플레이션]이 일어남(그전까지 경제학자들은 경제가 침체되면 물가가 (ㅎㄹ)[하락@하락·내려·떨어]한다고 설명했음) → 사람들은 (ㅅㅇ)[실업]과 물가 상승이라는 이중고를 겪음", questions: [] },
      { heading: "6장 · 지역은 뭉치고 기술은 퍼지고 · 125~129쪽", text: "현우와 쇼미는 기차를 타고 국경을 넘었는데 입국 심사를 하지 않아 신기해했다. 설명글의 빈칸을 채우고, 세계의 지역경제권을 정리한 표를 완성하시오.\n\n(ㅅㄱ ㅈㅇ)[셍겐 조약]에 가입한 나라 사이에는 통행이 자유로워 입국 심사를 하지 않는다.\n1993년 11월 EU가 출범한 뒤 회원국끼리는 상품, 서비스, 자본, 노동 거래에 대한 제한이 없어졌고, 유럽중앙은행이 발행한 [유로화]를 함께 써서 (ㄱㅇㅅㅈ)[금융시장]도 하나가 되었다. 그래서 EU는 경제적으로는 한 나라라고 할 수 있다.\n1990년대에는 지역적으로 가까운 나라들끼리 뭉치는 일이 많아졌다. 무역 제한을 없애 시장 규모를 키우면 (ㄱㅁㅇ ㄱㅈ)[규모의 경제] 효과를 얻을 수 있기 때문이다. 전체 생산량이 늘어나면 제품 한 개를 만드는 데 드는 (ㅅㅅㅂㅇ)[생산비용]이 줄어든다.\n한국이 속한 APEC은 회의 결과를 공동 선언문으로 발표하는 정도로만 활동한다. 한국은 강한 결속력을 갖는 지역경제권에 속하지 못했기 때문에, 지역을 따지지 않고 다른 나라들과 무역장벽을 없애자는 (ㅈㅇㅁㅇㅎㅈ)[자유무역협정](FTA)을 맺고 있다.\n\n〈표〉\n\n1) 지역경제권: EU(유럽연합)\n   만든 해: 1993년\n   회원국: 유럽 여러 나라\n   성격: [+상품·서비스·자본·노동 거래에 제한이 없고 유로화를 함께 쓰는 하나의 시장@유로·제한·하나]\n\n2) 지역경제권: APEC(아시아태평양경제협력각료회의)\n   만든 해: [1989년]\n   회원국: 한국·미국·일본 등 아시아와 태평양에 접한 21개국\n   성격: [+무역·투자 자유화와 지역경제통합이 목적이지만 공동 선언문을 발표하는 정도로만 활동함@선언·약·느슨]\n\n3) 지역경제권: AFTA → CAFTA\n   만든 해: 1993년 → 2005년\n   회원국: [+동남아시아국가연합(ASEAN)에 속한 나라들, 뒤에 중국이 참여@동남아·ASEAN·아세안,중국]\n   성격: [+무역에 대한 관세를 없애기로 한 자유무역지대@관세·자유무역]\n\n4) 지역경제권: NAFTA → USMCA\n   만든 해: [+1992년 12월 맺음(1994년 1월 발효), 2018년 USMCA로 바꾸기로 합의@1992·1994]\n   회원국: [미국·캐나다·멕시코@미국,캐나다,멕시코]\n   성격: 세 나라 사이의 무역장벽을 없애 교역을 늘리자는 협정", questions: [] },
      { heading: "6장 · 지역은 뭉치고 기술은 퍼지고 · 129~131쪽", text: "세계는 정치적으로는 나뉘고 경제적으로는 하나로 합쳐지는 쪽으로 변하고 있다. 세계화를 이끈 세 가지 힘이 한 일을 표로 정리하시오. 그리고 정치적으로 나뉘는 예와 경제적으로 하나가 되는 예를 하나씩 들어 설명하고, 정보통신기술이 발달한 뒤 기업이 일하는 방식이 어떻게 바뀌었는지 쓰시오.\n\n〈표〉\n\n1) 세계화를 이끈 힘: 정보기술혁명\n   한 일: [+한 나라 안에서만 이루어지던 경제활동이 국경을 뛰어넘을 수 있는 환경을 만들었다@국경·세계화·뛰어넘]\n\n2) 세계화를 이끈 힘: 신자유주의 사상\n   한 일: [+선진국들이 원하는 시장개방을 다른 나라들이 받아들이게 만드는 이론적인 배경이 되었다@개방·이론·배경]\n\n3) 세계화를 이끈 힘: 세계무역기구(WTO)\n   한 일: [+직접 시장개방과 자유로운 거래를 밀고 나갔다@개방·자유로운 거래·자유무역]\n\n① 정치적으로 나뉘는 예와 경제적으로 하나가 되는 예를 하나씩 쓰세요. [+정치: 1991년 소련이 15개 나라로 쪼개지고, 2002년 동티모르가 인도네시아로부터 독립했다. 경제: 상품·자본·서비스가 전 세계에서 자유롭게 거래되며 하나의 시장을 추구한다.@소련·동티모르·쪼개·독립·분리,거래·시장·FTA·EU·유로]\n② 정보통신기술이 발달한 뒤 기업이 일하는 방식은 어떻게 바뀌었나요? [+상품 기획은 한국 본사, 생산은 중국 공장, 판매와 마케팅은 미국 지사에서 하는 것처럼 공간의 제한을 뛰어넘어 일할 수 있게 되었다.@공간·여러 나라·나누어·나눠·본사·지사·공장]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "내가 이제 막 공업을 키우기 시작한 나라의 대통령이라고 상상해 보자. 보기를 읽고 자유무역과 보호무역 가운데 무엇을 고를지 정한 뒤, 그 까닭을 좋은 점과 걱정되는 점을 비교하여 쓰시오.\n〈보기〉\n· 보호무역: 관세 등으로 수입을 막으면 아직 약한 우리 산업이 자랄 시간을 벌 수 있다. 그러나 다른 나라도 관세를 올리면 우리 수출이 어려워지고, 나라끼리 사이가 나빠질 수 있다.\n· 자유무역: 나라마다 잘 만드는 물건에 집중해 서로 사고팔면 비용이 적게 든다. 그러나 경쟁력이 약한 우리 기업이 외국 기업에 밀려 문을 닫을 수 있다.\n· 책 속 예: 영국은 기술력이 높아져 공산품 수출에 자신이 생긴 뒤 자유무역으로 돌아섰다. 미국과 독일은 뒤늦게 공업화해서 보호무역을 택했다. 1930년대의 보호무역은 세계 경제 불황과 2차 세계대전의 원인 중 하나로 꼽힌다.", model: "어느 쪽이든 보기의 좋은 점과 걱정되는 점을 비교하면 인정한다. 보호무역 입장: 미국·독일처럼 뒤늦게 공업화한 나라는 국내 산업을 키우는 것이 우선이고(108쪽), 영국도 수출에 자신이 생긴 뒤에야 자유무역으로 돌아섰다(107쪽). 자유무역 입장: 비교우위 상품을 전문적으로 생산해 사고팔면 비용이 적게 들고(108쪽), 보호무역은 다른 나라를 적으로 보는 분위기를 만들어 불황과 전쟁의 원인이 되었다(114쪽). '처음 몇 년만 보호하고 점차 개방한다'처럼 조절하는 답도 근거가 분명하면 좋게 평가한다." }, { prompt: "신자유주의 정책은 경제를 살렸지만 부자와 가난한 사람의 차이를 더 크게 만들었다. 경제 성장과 고른 분배를 함께 이루는 데 도움이 될 방법을 보기에서 하나 고르거나 직접 생각해 내고, 그 방법이 좋은 까닭과 걱정되는 점을 쓰시오.\n〈보기〉\n· 소득이 높은 사람에게 세금을 조금 더 걷어 교육과 복지에 쓴다.\n· 일자리를 늘린 기업에 세금을 깎아 준다.\n· 일자리를 잃은 사람에게 새 직업을 배울 기회를 준다.\n· 일하는 사람이 받는 최저 임금을 올린다.", model: "책 근거: 신자유주의는 세율 인하와 사회보장 축소로 투자를 살려 경기 침체에서 벗어났지만 소득과 재산의 차이가 더 커졌다(124쪽). 세금을 더 걷는 방법은 분배에 좋지만 투자 의욕을 줄일 수 있다는 걱정(신자유주의자들의 주장, 122쪽)을, 기업 세금을 깎는 방법은 성장에 좋지만 차이를 줄이는 효과가 작을 수 있다는 걱정을 함께 쓰게 한다. 좋은 점과 걱정되는 점을 모두 쓰면 충분하다." }, { prompt: "한국 본사에서 기획하고, 중국 공장에서 만들고, 미국 지사에서 파는 물건처럼, 내가 쓰는 물건 가운데 세계화의 결과물을 하나 골라 그 물건이 내 손에 오기까지의 과정을 쓰시오. 잘 모르겠다면 물건의 상표나 포장에서 만든 나라를 확인하거나 가족에게 물어보고, 나머지는 상상하여 쓰시오.\n〈보기〉\n· 과정의 예: 기획·디자인한 곳 → 부품이나 원료를 만든 곳 → 조립한 곳 → 배나 비행기로 운송 → 광고와 판매 → 인터넷 주문이나 가게에서 구입", model: "책 근거: 정보통신기술이 발달해 시간과 공간의 제한을 뛰어넘게 되자 기획은 한국 본사, 생산은 중국 공장, 판매와 마케팅은 미국 지사에서 하는 경영이 가능해졌다(130쪽). 스마트폰, 운동화, 옷 등을 골라 단계별로 쓰게 하고, 각 단계에 '인터넷', '관세', 'FTA', '시장개방' 같은 이 장의 개념을 한두 개 넣으면 좋다. 확인하지 못한 부분은 상상임을 밝혀도 된다." }] }
    ] },
    { title: "7장", range: "134~155쪽 · 이제 하나가 된 세계 시장", boxes: [
      { heading: "7장 · 자유로운 국제거래의 영역을 넓히자 · 134~137쪽", text: "여행 이야기를 정리하시오. 설명글의 빈칸을 채우시오.\n\n신기 일행은 쾰른에서 프랑크푸르트로 이동하는 날, 특급열차 대신 라인강 유람선을 타기로 했다.\n\n쾰른에서 프랑크푸르트까지 특급열차를 타면 1시간 15분 정도면 가지만, 라인강 유람선을 타면 늦은 저녁에야 도착한다. 신기 일행은 유레일패스를 쓰기 때문에 유람선을 타도 돈은 더 들지 않지만, 그 대신 [시간]이 훨씬 오래 걸린다.\n현우는 누나가 무슨 일이든 (ㄱㅎㅂㅇ)[기회비용]을 따진다고 했다. 신기가 시간을 더 쓰면서도 유람선을 고른 까닭은, 세계대전의 폐허를 딛고 일어난 독일의 경제 부흥인 '(ㄹㅇ ㄱㅇ ㄱㅈ)[라인 강의 기적]'을 만들어 낸 독일인의 의지와 열정을 라인강을 건너며 느끼고 싶었기 때문이다.\n유람선에서 먹은 점심은 감자 요리였다. 독일인의 감자 사랑은 프로이센의 왕 [프리드리히 2세]로부터 시작되었다. 사람들이 감자를 먹으면 병에 걸린다고 꺼리자, 왕은 궁궐 정원에 감자를 심고 사람들 앞에서 먹기도 했으며 강제로 감자를 심게 하여 [식량]을 확보했다.\n1756년에 벌어진 오스트리아와의 7년 전쟁에서 오스트리아 군대는 식량 부족으로 허덕였지만, 감자를 넉넉히 확보한 [프로이센] 군대는 끝까지 버텨 승리했다. 이 일로 독일 사람들은 감자를 좋아하게 되었다.", questions: [] },
      { heading: "7장 · 자유로운 국제거래의 영역을 넓히자 · 137~139쪽", text: "미국은 세계 최고의 공업 국가여서 자기 나라가 자유무역의 혜택을 가장 많이 볼 거라고 자신했다. 그런데 1970년대에 들어 미국은 무역적자를 기록하게 되었다. 미국이 무역적자를 기록하게 된 까닭을 쓰시오. 또 미국이 이 적자를 줄이려고 시장을 열라고 요구한 두 분야를 쓰고, 미국이 그 두 분야를 고른 까닭을 쓰시오.\n\n① 미국이 1970년대에 무역적자를 기록하게 된 까닭은 무엇인가요? [+유럽 공동체와 일본의 공업 기술력이 막강해졌기 때문이다.@유럽·일본,기술·공업·경쟁]\n② 미국이 적자를 줄이려고 시장을 열라고 요구한 두 분야는 무엇인가요? [+농업과 서비스 산업@농,서비스]\n③ 미국이 그 두 분야를 고른 까닭은 무엇인가요? [+미국이 값싼 농산물과 금융·통신 같은 서비스, 지식 산업 기술에 경쟁력이 있어서 수출하면 쉽게 적자를 줄일 수 있기 때문이다.@경쟁력·강하·잘하·유리·대량생산·싸]", questions: [] },
      { heading: "7장 · 자유로운 국제거래의 영역을 넓히자 · 138~140쪽", text: "우루과이라운드가 만들어지기까지의 과정을 정리하시오. 빈칸에 알맞은 말을 쓰시오.\n\n1986년 9월: 우루과이에서 열린 [GATT] 회의에서 미국이 새로운 무역 협상을 시작하자고 제안했다.\n→ 처음에는 나라마다 자기에게 유리한 쪽으로 합의를 끌어내려 해 한동안 [논의]만 했다. 그러다 [소련]이 분열되어 미국을 견제할 세력이 없어졌다.\n→ 1994년 4월: 모로코의 [마라케시]에서 열린 GATT 회의에서 협상이 마무리되었다. 처음 제안이 나온 곳의 이름을 따서 이 합의를 '(ㅇㄹㄱㅇㄹㅇㄷ)[우루과이라운드]'라고 한다.\n→ 1995년: 우루과이라운드의 효력이 생기고, 1월 1일에 [WTO](세계무역기구)가 세워졌다.\n→ 자유로운 국제거래의 대상이 상품에서 [서비스]와 [자본]까지 넓어졌다.", questions: [] },
      { heading: "7장 · 자유로운 국제거래의 영역을 넓히자 · 140쪽", text: "WTO가 하는 일을 정리하시오. 설명글의 빈칸을 채우고, 표의 빈칸에 WTO가 하는 일을 쓰시오.\n\n협정을 맺어도 나라들이 지키지 않으면 아무 소용이 없다. 그래서 각국의 무역 (ㅂㅈ)[분쟁]을 중재하고 각 나라의 무역정책을 (ㄱㅅ)[감시]하는 WTO가 세워졌다. WTO의 기본 질서는 무역을 할 때 모든 국가에 대해 (ㄷㄷㅎ ㄷㅇ)[동등한 대우]를 해야 한다는 것이다.\n\n〈표〉\n\n1) 이런 일이 생기면: 어떤 나라가 수입을 막으려고 지나치게 높은 관세를 매긴다.\n   WTO가 하는 일: [관세를 내리라고 요구한다.@관세,내리·낮추·인하·없애]\n\n2) 이런 일이 생기면: 어떤 나라가 다른 나라 시장을 차지하려고 상품 가격을 지나치게 내린다.\n   WTO가 하는 일: [+그 행위를 조사하여 덤핑인지 아닌지 판정한다.@덤핑·조사·판정]\n\n3) 이런 일이 생기면: 어떤 나라가 WTO 규칙을 어기고 협정에 어긋나는 행동을 한다.\n   WTO가 하는 일: 그 행위를 바로잡거나 손해배상을 요구하고, 그래도 고치지 않으면 무역제재를 한다.", questions: [] },
      { heading: "7장 · 규제와 자유 사이 · 141쪽", text: "WTO는 무역을 할 때 모든 국가에 같은 조건을 적용하는 것을 기본 질서로 삼는다. 그런데 실제로는 FTA라는 방법으로 자유무역과 시장개방이 진행되었다. 보기를 읽고, FTA가 WTO의 기본 질서에 맞지 않는 까닭을 쓰시오. 또 그런데도 FTA가 계속 늘어난 까닭을 쓰시오.\n\n① FTA가 WTO의 기본 질서에 맞지 않는 까닭은 무엇인가요? [+협정을 맺지 않은 나라를 차별대우하게 되어, 모든 국가에 동등한 대우를 하라는 질서에 어긋나기 때문이다.@차별·동등·같은 조건·불공평]\n② 그런데도 FTA가 계속 늘어난 까닭은 무엇인가요? [+FTA로 무역이 늘면 결과적으로 세계 무역이 늘어난다고 보았고, 뜻이 맞는 나라와 먼저 맺는 것이 실리적이었기 때문이다.@세계 무역·무역이 늘·실리·뜻이 맞·먼저·이익]", questions: [] },
      { heading: "7장 · 규제와 자유 사이 · 142~144쪽", text: "한국이 처음으로 FTA를 맺은 나라는 칠레이다. 한-칠레 FTA 이야기를 정리하시오. 설명글의 빈칸을 채우고, 한-칠레 FTA로 이익을 본 쪽과 피해를 본 쪽을 표로 정리하시오.\n\n한국은 1999년 12월에 칠레와 공식협상을 시작했지만 [농민]들의 반대가 심해 2004년 4월에야 효력이 생겼다. 칠레는 자동차, 휴대폰, 컴퓨터 같은 우리나라 (ㄱㅅㅍ)[공산품]을 주로 수입한다.\n그런데 2006년과 2007년에 [중국]과 [일본]도 각각 칠레와 FTA를 맺었다. 그러자 전에는 한국산 제품만 받던 관세 혜택을 두 나라도 받게 되어, 한국 공산품 수출의 증가폭이 낮아지고 FTA 효과가 줄었다.\n한-ASEAN처럼 한꺼번에 여러 나라와 FTA를 맺기도 한다. FTA를 맺은 나라가 너무 많아지면 나라마다 다른 무역 (ㅈㅊ)[절차]를 확인하느라 시간과 (ㅇㄹ)[인력]이 더 들어 기대했던 효과를 제대로 누리지 못한다. 가닥이 서로 얽힌 채 접시에 담긴 스파게티에 빗대어 이것을 '(ㅅㅍㄱㅌ ㅂ ㅎㄱ)[스파게티 볼 효과]'라고 한다.\n\n〈표〉\n\n1) 구분: 이익을 본 쪽\n   누가: 공산품을 수출하는 기업\n   그 까닭: [+칠레가 한국산 제품에 관세를 내리거나 없애 주어 가격경쟁력이 생기고 수출이 늘었다.@관세·가격경쟁력·수출]\n\n2) 구분: 이익을 본 쪽\n   누가: 소비자\n   그 까닭: [+싸고 맛있는 칠레 포도와 칠레산 와인을 살 수 있게 되었다.@포도·와인·싸]\n\n3) 구분: 피해를 본 쪽\n   누가: [농민@농]\n   그 까닭: 경쟁력이 떨어지는 분야라서 값싼 칠레 농산물이 많이 수입되었다.", questions: [] },
      { heading: "7장 · 자유로운 거래는 상품을 넘어 서비스와 자본까지 · 145~148쪽", text: "서비스의 국제거래와 자본의 국제거래를 정리하시오. 설명글의 빈칸을 채우고, 표의 거래가 어떤 국제거래인지 보기에서 골라 쓰시오.\n\n서비스는 의사의 진료나 음악가의 연주처럼 사람들에게 편리함과 (ㅁㅈㄱ)[만족감]을 주는 기술이나 활동이다. 서비스는 배나 비행기에 실어 보낼 수 없으므로, [사람]이 오가며 서비스를 이용한다.\n현우는 500만 원이 있으면 은행 정기예금에, 쇼미는 주식이나 펀드에 넣겠다고 했다. 이처럼 자기가 가진 돈을 활용해 이득을 얻으려고 하는 일을 (ㅌㅈ)[투자]라고 한다. 이런 투자를 다른 나라 사람이나 외국 기업에게도 허용하는 것이 (ㅈㅂㅅㅈ ㄱㅂ)[자본시장 개방]이다. 외국인이 우리나라에 기업을 세우거나 주식·채권을 사고파는 일이 실제로 일어날 때 (ㅈㅂㅇ ㄱㅈㄱㄹ)[자본의 국제거래]가 생긴다.\n\n〈표〉\n\n1) 거래: 우리 가족이 방학에 베트남으로 해외여행을 간다.\n   어떤 국제거래?: [관광서비스@관광]\n\n2) 거래: 외국인 유학생이 한국 학교에서 수업을 받는다.\n   어떤 국제거래?: [교육서비스@교육]\n\n3) 거래: 외국 기업이 우리나라 해운기업에 물건 운송을 맡긴다.\n   어떤 국제거래?: [운송서비스@운송]\n\n4) 거래: 우리나라 기업이 다른 나라에서 도로와 항구시설을 만든다.\n   어떤 국제거래?: [건설서비스@건설]\n\n5) 거래: 외국인이 한국 주식시장에서 한국 회사의 주식을 산다.\n   어떤 국제거래?: [자본의 국제거래@자본]", questions: [] },
      { heading: "7장 · 다국적기업의 빛과 그늘 · 149~152쪽", text: "다국적기업이 무엇인지, 기업이 왜 해외로 진출하는지 정리하시오. 설명글의 빈칸을 채우고, 표의 빈칸에 알맞은 말을 쓰시오.\n\n신기는 기업의 국적이 본사가 있는 나라가 아니라 그 기업이 (ㅅㅇㅇ ㅎㄴ ㄴㄹ)[사업을 하는 나라]로 정해진다고 설명한다. 그래서 외국 기업이라도 한국에서 사업하면 국적은 [한국]이다. 이렇게 여러 나라에서 사업을 하며 여러 국적을 가진 기업을 '(ㄷㄱㅈㄱㅇ)[다국적기업]' 또는 '글로벌 기업'이라고 한다.\n한국 상품에 대한 선진국의 수입 (ㄱㅈ)[규제]가 심해지자, 1981년 금성사(현 LG전자)와 1982년 삼성전자를 시작으로 한국 [대기업]들이 (ㅁㅇㅈㅂ)[무역장벽]을 뛰어넘기 위해 해외로 진출했다. 1990년대부터는 [중소기업]들이 임금이 싼 나라를 찾아 해외로 진출했다.\n\n〈표〉\n\n1) 기업이 해외로 진출하는 목적: [더 많은 돈을 벌려고@돈·이윤·이익]\n   책에 나온 예: 자기 나라에서 사업을 해서 돈을 잘 벌게 되면 다른 나라에 진출한다.\n\n2) 기업이 해외로 진출하는 목적: 생산에 유리한 환경을 찾으려고\n   책에 나온 예: [+노동력이 중요한 제품을 만드는 기업이 중국, 베트남, 인도네시아처럼 임금이 싼 나라로 공장을 옮긴다.@임금·인건비,싼·낮·적]\n\n3) 기업이 해외로 진출하는 목적: [무역장벽을 뛰어넘으려고@장벽·관세]\n   책에 나온 예: 무역장벽을 피해 현지에 공장을 세우고 물건을 만들어 판다.", questions: [] },
      { heading: "7장 · 다국적기업의 빛과 그늘 · 153~155쪽", text: "다국적기업은 진출한 나라에 도움을 주기도 하고 문제를 일으키기도 한다. 표의 빈칸을 채워 다국적기업의 빛과 그늘을 정리하시오. 그리고 기업의 사회적 책임에 어떤 일들이 들어가는지 쓰고, 이 책임을 소홀히 하는 다국적기업은 어떤 모습인지 쓰시오.\n\n〈표〉\n\n1) 구분: 빛: 한국\n   다국적기업이 끼친 영향: [+경제 개발 초기에 공장을 세우고 기술을 가르쳐 주어 공업 발전을 도왔고, 한국 제품의 우수성을 세계에 알려 수출을 늘리는 데 도움을 주었다.@기술·공장·수출]\n\n2) 구분: 빛: 중국과 동남아시아\n   다국적기업이 끼친 영향: 이 지역 인구 중 절대 빈곤층 비율이 1990년 62퍼센트에서 2015년 2퍼센트로 줄어드는 데 한몫했다.\n\n3) 구분: 그늘: 아프리카\n   다국적기업이 끼친 영향: [+지하자원, 해양자원, 열대 농작물만 원했고, 아프리카 기업들이 헐값에 자원 개발 권리를 넘겨 다국적기업의 주머니만 두둑해졌다.@자원·헐값]\n\n4) 구분: 그늘: 힘이 약한 국내 기업\n   다국적기업이 끼친 영향: [+자본과 기술력을 가진 다국적기업과의 경쟁에서 밀려 성장하지 못할 수 있다.@경쟁·밀려·밀리·성장]\n\n① 기업의 사회적 책임에는 어떤 일들이 들어가나요? 두 가지 이상 쓰세요. [+법을 잘 지키고, 환경 보전이나 소비자 보호 같은 가치를 존중하며, 재해 지원·어려운 이웃 돕기처럼 이윤의 일부를 사회에 돌려준다.@법·환경·소비자·이웃·기부·돌려·환원·재해]\n② 이 책임을 소홀히 하는 다국적기업은 어떤 모습인가요? [+이윤이 생겨도 그 나라에 다시 투자하지 않고 자기 나라로 가져가기만 한다.@가져가·가져간·투자하지·자기 나라]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "한-칠레 FTA처럼 FTA를 맺으면 이익을 보는 사람과 피해를 보는 사람이 함께 생긴다. 보기를 읽고, 농민이 피해를 보더라도 우리나라가 FTA를 맺어야 하는지 찬성 또는 반대 입장을 정해 근거를 쓰시오. 또 농민의 피해를 줄일 방법을 한 가지 쓰시오.\n〈보기〉\n· 국가 전체로 보면 FTA를 맺는 것이 이득이다. 우리가 먼저 FTA를 맺고 관세 혜택을 받으면 그 나라와의 무역을 늘릴 수 있다.\n· 다른 나라들끼리 먼저 FTA를 맺으면 우리는 원래 있던 수출시장까지 잃어버릴 수 있다.\n· 소비자는 한겨울에도 싸고 맛있는 칠레 포도를 사 먹을 수 있게 되었다.\n· 경쟁력이 떨어지는 농업 분야는 값싼 수입 농산물이 늘어나 농민들이 피해를 본다.", model: "책 근거 142~144쪽. 찬성: 국가 전체의 이득, 수출시장 지키기, 소비자의 선택 폭 확대. 반대: 농민 소득 감소와 생계 위협, 우리 농업 기반 약화. 피해를 줄일 방법 예시: 피해 농가 지원금, 고품질·친환경 농산물로 바꾸도록 기술 지원, 다른 작물로 바꾸는 농가 지원, 원산지 표시 강화(신토불이 홍보). 어느 입장이든 반대편 걱정을 한 번쯤 짚었는지, 방법이 피해의 원인(가격경쟁력)과 이어지는지 본다." }, { prompt: "현우와 신기는 세계화가 개발도상국에게도 잘된 일인지에 대해 생각이 다르다. 보기를 읽고, 두 사람 가운데 누구의 생각에 더 공감하는지 쓰고, 그 까닭을 쓰시오.\n〈보기〉\n· 현우: 상품의 국제거래로 소비자들은 좋은 품질의 다양한 제품을 더 싸게 살 수 있어. 나라마다 경쟁력 있는 제품을 전문적으로 생산하면 세계의 자원도 더 효율적으로 쓰이지. 그러니 세계화는 개발도상국에게도 잘된 일 아니야?\n· 신기: 기술 혁신과 소비자 만족 같은 좋은 점도 커. 하지만 이제는 온 세계를 상대로 경쟁해야 해서, 세계화에 잘 적응한 선진국은 더 잘살게 되고 경쟁력을 키우지 못한 개발도상국은 살기가 더 힘들어졌어.", model: "책 근거 148~149쪽, 153~154쪽. 현우 쪽: 소비자 혜택, 자원의 효율적 사용, 중국·동남아시아의 절대 빈곤층 감소(153쪽)를 근거로 쓸 수 있다. 신기 쪽: 선진국의 영향력 확대, 아프리카처럼 자원만 빼앗긴 사례(153~154쪽)를 근거로 쓸 수 있다. '두 사람 말이 다 맞지만 개발도상국이 산업을 보호하고 경쟁력을 키울 시간이 필요하다'처럼 절충한 답도 근거가 분명하면 인정한다. 154쪽에서 한국이 선진국과 개발도상국의 다리 역할을 해야 한다는 주장을 소개해 주어도 좋다." }, { prompt: "우리 주변에는 맥도날드, 서브웨이, 코카콜라, 마이크로소프트, 나이키처럼 한국에서 사업을 하는 다국적기업이 많다. 내가 자주 이용하는 다국적기업 하나를 골라, 그 기업이 우리 생활에 준 도움 한 가지와, 그 기업이 사회적 책임을 다하려면 해야 할 일 한 가지를 쓰시오. 자주 이용하는 기업이 없다면 위에 나온 기업 가운데 하나를 골라 상상하여 쓰시오.\n〈보기〉\n· 다국적기업이 주는 도움: 공장이나 매장을 세워 일자리를 만들고, 세금을 내고, 자본과 기술을 제공한다.\n· 기업의 사회적 책임: 법 지키기, 환경 보전, 소비자 보호, 재해가 생기면 지원하기, 어려운 이웃 돕기", model: "책 근거 149~155쪽. 도움 예시: 어디서나 쉽게 이용할 수 있는 매장, 일자리(아르바이트), 편리한 프로그램·제품. 해야 할 일 예시: 일회용품 줄이기(환경 보전), 건강한 메뉴 정보 제공(소비자 보호), 번 돈의 일부를 그 나라 지역 사회에 다시 투자하거나 기부하기. 사회적 책임 항목과 고른 기업의 사업이 실제로 이어지는지 본다. 인터넷으로 찾은 내용은 출처를 밝히도록 지도한다." }] }
    ] },
    { title: "8장", range: "158~179쪽 · 상황에 따라 바뀌는 세계 경제 질서", boxes: [
      { heading: "8장 · EU를 떠나기로 한 영국 · 158~160쪽", text: "유로화 지폐와 동전의 도안을 설명한 글이다. 빈칸에 알맞은 말을 쓰시오.\n\n대부분의 지폐 앞면에는 인물 초상이 있지만 유로화 지폐에는 없다. 인물 초상을 넣기로 했다면 누구를 넣을지 나라마다 의견이 분분했을 것이기 때문이다.\n유로화 지폐 앞면에는 [문]이나 창문이 있는 건축물이, 뒷면에는 [다리]가 그려져 있다. 문은 (ㅁㄹ)[미래]로 나아간다는 의미를, 다리는 나라와 나라를 (ㅇㄱ)[연결]한다는 의미를 담고 있다. 어떤 건축물과 다리를 고를지도 의견이 달라서, 실제로 있는 것을 넣지 않고 새로 그림을 그렸다.\n유로화 동전은 [뒷면] 디자인이 모두 같지만, 앞면은 12개의 별과 함께 나라마다 자기 나라만의 도안을 고르게 했다. 유로화를 쓰면서 예전 화폐를 쓸 수 없게 되었으니, 예전 화폐에 있던 자기 나라의 인물, 건축물, 자연경관에 대한 사랑을 담을 수 있도록 배려한 것이다. 그래도 어느 나라 동전이든 (ㅇㄹㅈ)[유로존]에서 모두 쓸 수 있다.\n이런 도안에서 EU가 화합하여 나아갈 새로운 (ㅂㅈ)[비전]을 보여 주면서도, 서로의 (ㅈㅌ)[전통]과 문화를 존중했다는 것을 느낄 수 있다.", questions: [] },
      { heading: "8장 · EU를 떠나기로 한 영국 · 160~161쪽", text: "영국이 EU에서 탈퇴하기로 결정하기까지의 과정을 순서대로 정리하였다. 빈칸에 알맞은 말을 쓰시오.\n\n2008년 세계 (ㄱㅇㅇㄱ)[금융위기]로 EU의 재무상태가 나빠짐\n→ EU에 돈이 더 필요해져서 영국이 내야 할 (ㅂㄷㄱ)[분담금]이 늘어남\n→ '돈만 들어가고 [이득]은 별로 없는 EU에 계속 남을 이유가 없다'는 여론이 영국에서 커짐\n→ 브렉시트를 원하는 정치인들이 다른 나라 사람들에게 (ㅇㅈㄹ)[일자리]를 빼앗겨 불만을 가졌던 사람들을 부추김\n→ [2016]년 국민투표에서 EU에서 탈퇴하자는 쪽으로 결론이 남", questions: [] },
      { heading: "8장 · EU를 떠나기로 한 영국 · 160~161쪽", text: "영국이 다른 EU 회원국과 달랐던 점과 영국 경제의 순위 변화를 정리하시오. 빈칸에 알맞은 말을 쓰고 표를 완성하시오.\n\nEU 회원국들이 유로존을 만들 때, 영국은 독자적인 (ㅌㅎㅈㅊ)[통화정책]을 버릴 수 없다며 [유로화]를 쓰지 않았다. 처음부터 영국은 다른 EU 회원국과 무언가 달랐던 것이다.\n1960년대 초반까지 세계 2위 국가였던 영국 경제는 오랫동안 내리막을 걸었다. 브렉시트로 영국 경제가 되살아날지, 아니면 돌이킬 수 없는 실수가 될지는 세월이 흘러야 알 수 있다.\n\n〈표〉\n\n1) 시기: 1960년대 초반\n   경제규모 순위: 세계 2위\n   무역 순위: [세계 2위@2]\n\n2) 시기: 2018년\n   경제규모 순위: [세계 5위@5]\n   무역 순위: [세계 8위@8]", questions: [] },
      { heading: "8장 · EU를 떠나기로 한 영국 · 162~163쪽", text: "현우는 브렉시트의 계기가 된 2008년 금융위기가 무엇인지 물었다. 2008년 금융위기가 일어나 세계로 번진 과정을 순서대로 정리하시오.\n\n(ㅈㅂㅅㅈ)[자본시장] 개방으로 투자할 수 있는 영역이 넓어짐\n→ 선진국 금융기관들이 다양한 (ㄱㅇㅅㅍ)[금융상품]을 선보여, 정부 기관이나 IMF조차 돈의 흐름을 파악할 수 없을 만큼 복잡해짐\n→ (ㅂㄷㅅ)[부동산] 가격이 갑자기 떨어짐\n→ 2008년 미국 4위의 투자은행 리먼 브러더스가 (ㅍㅅ)[파산]하여 미국에서 금융위기가 일어남\n→ 유럽에 투자했던 미국 자본이 빠져나가면서 위기가 [유럽]으로 번짐\n→ 중국, 인도 같은 (ㅅㅎㄱ)[신흥국]의 경제 성장률도 낮아져 세계 경제가 침체됨", questions: [] },
      { heading: "8장 · 무역전쟁을 선포한 미국 · 163~164쪽", text: "신기는 프랑크푸르트를 독일의 경제수도라고 했다. 메세 프랑크푸르트에 대한 설명을 읽고 빈칸에 알맞은 말을 쓰시오.\n\n프랑크푸르트에서는 모터쇼, 도서전 같은 유명한 [국제전시회]가 끊임없이 열린다. 독일의 여러 큰 도시에서도 국제전시회가 많이 열려서, 세계 국제전시회의 약 [70]퍼센트가 독일에서 열린다.\n독일 말로 전시회를 '[메세]'라고 하는데, 천주교의 미사도 메세라고 한다. 초기 전시회가 가장 많은 사람들이 미사를 보는 교회의 [축제] 기간에 열렸기 때문이다.", questions: [] },
      { heading: "8장 · 무역전쟁을 선포한 미국 · 166~167쪽", text: "미국과 중국의 무역에 대한 설명이다. 빈칸에 알맞은 말을 쓰고, 표를 완성하여 2017년 미국의 대중국 무역적자를 계산하시오.\n\n미국은 세계에서 [수입]을 가장 많이 하는 나라이다. 비싼 (ㅇㄱ)[임금]을 주고 미국 안에서 물건을 만드는 것보다 값싼 물건을 수입하는 게 유리했기 때문이다. 수출보다 수입이 훨씬 많아서 미국은 세계에서 (ㅁㅇㅈㅈ)[무역적자]가 가장 큰 나라가 되었다.\n값싼 수입품에 밀린 미국 공장들이 문을 닫자 (ㅇㅈㄹ)[일자리]가 줄어들었다. 트럼프 대통령은 이에 불만을 가진 사람들의 지지를 얻으려고 '(ㅁㄱ ㅇㅅㅈㅇ)[미국 우선주의]'를 내세워 당선되었고, 취임하자마자 무역전쟁을 예고했다.\n중국은 [1981]년 경제정책을 바꾸고 자본주의 국가들과 무역을 시작했다. 시장을 개방하자 값싼 (ㄴㄷㄹ)[노동력]과 거대한 시장에 매력을 느낀 외국 기업들이 중국으로 들어왔다. '세계의 [공장]'이 된 중국은 [2009]년부터 세계에서 수출을 가장 많이 하는 나라가 되었다.\n중국이 미국에서 수입한 금액은 곧 미국이 중국에 [수출]한 금액이다. 따라서 미국의 대중국 무역적자는 '미국이 중국에서 수입한 금액 − 중국이 미국에서 수입한 금액'으로 구할 수 있다.\n\n〈표〉\n\n1) 2017년: 미국이 중국에서 수입한 금액\n   금액: 5040억 달러\n\n2) 2017년: 중국이 미국에서 수입한 금액\n   금액: 1300억 달러\n\n3) 2017년: 미국의 대중국 무역적자\n   금액: [5040억 − 1300억 = 3740억 달러@3740]", questions: [] },
      { heading: "8장 · 무역전쟁을 선포한 미국 · 168~169쪽", text: "한국은 2017년 기준 무역의존도가 거의 70퍼센트에 이른다. 무역의존도가 이렇게 높은 한국에게 무역전쟁이 걱정스러운 까닭을 쓰시오. 또 현우는 영국과 미국이 자기 입맛에 따라 다르게 행동한다며 마음에 들지 않아 했지만, 신기는 미국과 영국만 탓할 수는 없다고 했다. 신기가 그렇게 말한 까닭을 쓰시오.\n\n① 무역의존도가 높은 한국에게 무역전쟁이 걱정스러운 까닭은 무엇인가요? [+경제가 무역에 많이 기대고 있어서, 보호무역 쪽으로 분위기가 바뀌면 수출에 어려움이 생기기 때문이다.@수출·보호무역]\n② 신기가 미국과 영국만 탓할 수는 없다고 한 까닭은 무엇인가요? [+어느 나라든 국제거래 환경이 자기에게 유리한 쪽으로 변하기를 원하기 때문이다. 중국이 미국 입장이었다면 무역전쟁의 수위를 더 높였을 것이다.@유리·이익·자기·자국]", questions: [] },
      { heading: "8장 · 한국, 원조를 받는 나라에서 주는 나라로 · 172~175쪽", text: "한국의 주요 수출 품목이 어떻게 바뀌었는지 표를 완성하고, 한국 수출의 특징을 설명한 글의 빈칸에 알맞은 말을 쓰시오.\n\n시기마다 바뀐 수출 품목을 보면, 산업 구조가 바뀌면서 수출 품목이 (ㅂㄱㄱㅊ)[부가가치]가 더 높은 품목으로 바뀌었다는 것을 알 수 있다.\n반도체는 정보를 저장하는 (ㅁㅁㄹ)[메모리]와, 컴퓨터나 전자제품을 작동시키는 두뇌 역할을 하는 (ㅂㅁㅁㄹ)[비메모리]로 나뉜다. 한국은 D램 같은 메모리 부문에서 세계 [1]위라서 반도체가 수출 1위 품목이 되었다. 그러나 마이크로프로세서 같은 비메모리 분야는 미국이나 일본에 비해 기술력이 뒤떨어져서 [수입]해야 한다. 그래서 반도체는 수입 품목 [2]위이기도 하다.\n한국 수출은 반도체에 너무 치우쳐 있어서 세계 반도체 시장이 나빠지면 경제가 타격을 받는다. 반면 독일은 (ㅎㄷ ㅊㅍㅇ)[히든 챔피언]이 수출의 [50]퍼센트가량을 차지해서 특정 품목의 시장 변화로 인한 위험이 훨씬 작고, 2008년 세계 경제위기에도 잘 버텼다.\n\n〈표〉\n\n1) 시기: 1970년\n   주요 수출 품목: [섬유류, 합판, 가발, 철광석, 전자제품@섬유·합판·가발·철광석]\n\n2) 시기: 1990년대\n   주요 수출 품목: [의류, 반도체, 가죽 신발, 선박, 영상기기@의류·반도체·신발·선박·영상]\n\n3) 시기: 2010년\n   주요 수출 품목: 반도체, 선박, 유무선 전화기, 석유제품, 승용차", questions: [] },
      { heading: "8장 · 한국, 원조를 받는 나라에서 주는 나라로 · 176~178쪽", text: "신기는 한국이 기업, 노동자, 사회 전체의 복지라는 세 꼭짓점이 균형을 이룬 '안정된 삼각형'을 만들어야 한다고 했다. 표의 빈칸을 채우시오. 그리고 세 꼭짓점 가운데 기업이 이윤을 낼 수 없게 되면 어떤 일이 생기는지 예로 들어, 세 꼭짓점이 균형을 이루어야 하는 까닭을 쓰시오.\n\n〈표〉\n\n1) 꼭짓점: 기업\n   필요한 것: 활발하게 투자하고 이윤을 낼 수 있는 환경\n\n2) 꼭짓점: 노동자\n   필요한 것: [+안정된 환경에서 적절한 보상을 받으며 일할 수 있는 여건@보상·임금·안정]\n\n3) 꼭짓점: 사회 전체의 복지\n   필요한 것: [+부가 일부 나라와 일부 계층에 쏠리지 않도록 모두가 적절하게 나누는 것@나누·나눔·분배·쏠리]\n\n① 기업이 이윤을 낼 수 없게 되면 어떤 일이 생기나요? [+문을 닫거나 다른 나라로 투자처를 옮겨서 노동자들이 일자리를 잃게 된다.@일자리·실업·문을 닫·망하·옮]\n② 그래서 세 꼭짓점이 균형을 이루어야 하는 까닭은 무엇인가요? [+꼭짓점 하나가 무너지면 다른 꼭짓점도 함께 흔들리기 때문에, 균형을 이루어야 사회 전체가 오래 건강하게 유지될 수 있다.@무너·흔들·불균형·함께·영향]", questions: [] },
      { heading: "생각해 볼 문제 (학원에서 해요)", text: "", questions: [{ prompt: "내가 2016년의 영국 국민이라면 브렉시트 국민투표에서 'EU 탈퇴'와 'EU 잔류' 가운데 어느 쪽에 표를 던졌을지 정하고, 보기를 참고하여 좋은 점과 걱정되는 점을 비교하여 근거를 쓰시오.\n〈보기〉\n· 탈퇴하면 좋은 점: 금융위기 뒤 늘어난 분담금을 내지 않아도 된다. 다른 회원국 사람들에게 일자리를 빼앗긴다는 걱정이 줄어든다.\n· 탈퇴하면 걱정되는 점: EU라는 큰 하나의 시장에서 자유롭게 거래하던 이익을 잃는다. 탈퇴 방법을 정하는 데도 진통이 심하고, 영국 경제가 되살아날지는 알 수 없다.\n· 참고: EU 회원국들은 경제적으로 뭉치면 자기 나라에 이익이 될 거라고 판단해서 EU에 가입했다.", model: "입장을 정하고 좋은 점과 걱정되는 점을 함께 따졌는지 본다. 탈퇴 쪽 예시: 늘어난 분담금을 내지 않고, 영국이 스스로 정책을 정할 수 있다. 큰 시장을 잃는 손해는 있지만 돈만 들어가고 이득이 적다면 떠나는 것이 낫다. 잔류 쪽 예시: 분담금이 늘어도 하나의 큰 시장에서 자유롭게 거래하는 이익이 더 크고, 탈퇴 과정의 진통과 경제가 되살아날지 모르는 위험이 크다(161쪽). 한쪽 이익만 늘어놓은 답보다 손해를 인정하고 비교한 답을 높이 평가한다." }, { prompt: "한국은 무역의존도가 높고 수출이 반도체에 치우쳐 있다. 무역전쟁 같은 변화에 대비하려면 정부와 기업이 각각 무엇을 하면 좋을지, 보기의 독일 예를 참고하여 한 가지씩 쓰시오.\n〈보기〉\n· 독일: 작지만 강한 히든 챔피언 기업이 1300여 개나 되고, 이들이 독일 수출의 50퍼센트가량을 차지한다.\n· 그래서 특정 품목의 시장이 나빠져도 위험이 작고, 2008년 세계 경제위기에도 경제가 잘 버텼다.\n· 신기의 말: 한국 사람들은 경쟁력을 키우려면 우선 덩치를 키워야만 한다고 생각하는 경향이 있다.", model: "정부와 기업을 나누어 쓰고 독일의 예와 연결했는지 본다. 정부 예시: 큰 기업만이 아니라 작지만 강한 중소기업이 자랄 수 있도록 지원한다. 기업 예시: 기술력이 뒤떨어진 비메모리 반도체에 투자하거나, 자기 분야에서 세계 1~3위가 되는 전문 기업을 목표로 한다. '덩치를 키워야 한다'는 생각에서 벗어나야 한다는 신기의 말(174쪽)을 활용하면 좋다." }, { prompt: "신기는 \"지금이 아니라 앞으로, 나만이 아니라 사회 전체를 위한 길이라면 모두가 한 걸음씩 양보할 수 있는 용기\"가 필요하다고 했다. 기업, 노동자, 국민 가운데 한 주체를 골라 무엇을 양보하면 좋을지 쓰고, 그것이 사회 전체에 어떤 도움이 될지 쓰시오.\n〈보기〉\n· 기업: 높은 이윤을 내면서도 자기 이익만 챙기면 비난을 받는다. 이익을 사회에 돌려주거나 노동자의 처우에 신경 쓸 수 있다.\n· 노동자: 기업이 이윤을 내야 일자리가 지켜진다.\n· 국민: 경제가 양적으로만 성장하는 것보다 불평등 해소 같은 다른 가치도 중요해지고 있다.", model: "한 주체를 고르고 구체적으로 무엇을 양보할지, 그것이 왜 '앞으로'와 '사회 전체'에 도움이 되는지 썼는지 본다. 기업 예시: 이윤의 일부를 사회에 돌려주고 노동자의 처우를 개선한다(177쪽). 노동자 예시: 기업이 이윤을 내야 일자리가 유지되므로 생산성을 높이는 데 협력한다. 국민 예시: 복지를 위해 세금을 더 내는 것을 받아들이고, 성장만 바라기보다 불평등 해소를 함께 생각한다(178~179쪽). 양보가 당장은 손해일 수 있다는 점을 인정한 답을 높이 평가한다." }] }

/* ===== 데이터 계층 =====
   같은 함수 이름으로 Supabase(실제) / 체험(이 기기 저장) 두 가지를 제공합니다. */
function unwrap(res){ if (res.error) throw new Error(res.error.message || "오류가 발생했습니다."); return res.data; }

function supabaseApi(){
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return {
    getUser: async function(){ var r = await db.auth.getSession(); return r.data.session ? r.data.session.user : null; },
    onAuth: function(cb){ db.auth.onAuthStateChange(function(_e, s){ cb(s ? s.user : null); }); },
    signIn: async function(email, pw){ unwrap(await db.auth.signInWithPassword({ email: email, password: pw })); },
    signOut: async function(){ await db.auth.signOut(); },
    listBooks: async function(){ return unwrap(await db.from("books").select("*").order("created_at", { ascending: false })); },
    createBook: async function(user, b){
      return unwrap(await db.from("books").insert({ owner: user.id, title: b.title, author: b.author || "", grade: b.grade || "", sections: b.sections || [] }).select().single());
    },
    getBook: async function(id){ return unwrap(await db.from("books").select("*").eq("id", id).single()); },
    updateBook: async function(id, patch){ unwrap(await db.from("books").update(patch).eq("id", id)); },
    deleteBook: async function(id){ unwrap(await db.from("books").delete().eq("id", id)); },
    listEntries: async function(bookId){ return unwrap(await db.from("entries").select("*").eq("book_id", bookId)); },
    setFeedback: async function(id, feedback, checked){ unwrap(await db.from("entries").update({ feedback: feedback, checked: checked }).eq("id", id)); },
    deleteEntry: async function(id){ unwrap(await db.from("entries").delete().eq("id", id)); },
    setAccept: async function(id, accept){ unwrap(await db.rpc("set_blank_accept", { p_entry_id: id, p_accept: accept })); },
    publicBook: async function(id){ return unwrap(await db.rpc("get_book", { p_book_id: id })); },
    // p_class 는 반이 있을 때만 보냄 (반 기능 이전 서버 설정에서도 그대로 동작)
    submitEntry: async function(bookId, section, kind, name, data, cls){
      var p = { p_book_id: bookId, p_section: section, p_kind: kind, p_name: name, p_data: data }; if (cls) p.p_class = cls;
      return unwrap(await db.rpc("submit_entry", p));
    },
    myEntries: async function(bookId, name){ return unwrap(await db.rpc("get_my_entries", { p_book_id: bookId, p_name: name })); },
    blankStatus: async function(bookId, section, name){ return unwrap(await db.rpc("get_blank_status", { p_book_id: bookId, p_section: section, p_name: name })); },
    submitBlanks: async function(bookId, section, name, answers, cls){
      var p = { p_book_id: bookId, p_section: section, p_name: name, p_answers: answers }; if (cls) p.p_class = cls;
      return unwrap(await db.rpc("submit_blanks", p));
    },
    subscribe: function(bookId, cb){
      var ch = db.channel("entries-" + bookId)
        .on("postgres_changes", { event: "*", schema: "public", table: "entries", filter: "book_id=eq." + bookId }, function(){ cb(); })
        .subscribe();
      return function(){ db.removeChannel(ch); };
    }
  };
}

      name = trimStr(name); if (!name) throw new Error("이름을 입력하세요.");
      var keys = sectionKeys(b.sections[section]);

      if (!e){
        S.entries.push({ id: uid(), book_id: bookId, section: section, kind: "blanks", student_name: name, class_id: cls || "", data: { first: answers.slice() }, feedback: "", checked: false, created_at: now(), updated_at: now() });
      } else {

function runStudent(bookId){
  document.getElementById("wrap").classList.add("narrow");
  pageFoot.textContent = "내가 쓴 글은 선생님만 볼 수 있어요. 친구들의 생각은 수업 시간에 함께 들어요.";
  if (DEMO) document.getElementById("demoBar").appendChild(el("a", { class: "btn ghost small", href: location.href.split(/[?#]/)[0] + "?demo=1#book=" + bookId, text: "← 선생님 화면으로", style: "text-decoration:none;margin-bottom:1rem" }));
  var BOOK = null, NAME = lsGet("reading-name") || "", MY = {};
  var SEC = lsGet("reading-sec:" + bookId) || 0, TAB = "bookmark";
  var CLASS = PARAMS.get("class") || lsGet("reading-class:" + bookId) || "";   // 반 링크(?class=)로 들어오면 그 반

  init();

  async function init(){
    try { BOOK = await api.publicBook(bookId); }
    catch(e){ app.innerHTML = ""; app.appendChild(el("div", { class: "empty", text: e.message || "책을 열 수 없습니다." })); return; }
    if (SEC >= BOOK.sections.length) SEC = 0;
    BOOK.classes = BOOK.classes || [];
    if (!className(BOOK, CLASS)) CLASS = "";
    if (CLASS) lsSet("reading-class:" + bookId, CLASS);
    pageHeader.innerHTML = "";
    pageHeader.appendChild(el("div", { class: "eyebrow", text: (BOOK.grade ? BOOK.grade + " · " : "") + "독서 기록" }));
    pageHeader.appendChild(el("h1", { text: BOOK.title }));
    if (BOOK.author) pageHeader.appendChild(el("p", { class: "sub", text: BOOK.author }));
    if (NAME) await loadMine();
    render();
  }

  async function loadMine(){
    MY = {};
    try { (await api.myEntries(bookId, NAME)).forEach(function(e){ MY[e.section + ":" + e.kind] = e; }); }
    catch(e){ toast(e.message, true); }
  }
  function draftKey(kind){ return "reading-draft:" + bookId + ":" + NAME + ":" + SEC + ":" + kind; }

  function render(){
    app.innerHTML = "";
    if (!NAME || (BOOK.classes.length && !CLASS)) return renderName();

    var top = el("div", { class: "card" }, []);
    top.appendChild(el("div", { class: "spread" }, [
      el("div", {}, [ el("h2", { text: NAME + " 학생" }), CLASS ? el("div", { class: "sub small", text: className(BOOK, CLASS) }) : null ]),
      el("button", { class: "btn ghost small", text: "이름 바꾸기", onclick: function(){ NAME = ""; lsDel("reading-name"); render(); } })
    ]));
    var chips = el("div", { class: "chips", "aria-label": "주차" }, []);
    BOOK.sections.forEach(function(s, i){
      var done = MY[i + ":bookmark"] && MY[i + ":blanks"];
      chips.appendChild(el("button", { class: "chip" + (i === SEC ? " on" : ""), text: s.title + (done ? " ✓" : ""),
        onclick: function(){ SEC = i; lsSet("reading-sec:" + bookId, i); render(); } }));
    });
    top.appendChild(chips);
    var sec = BOOK.sections[SEC];
    if (sec && sec.range) top.appendChild(el("div", { class: "range" }, [ el("b", { text: "읽을 범위 " }), sec.range ]));
    var due = dueOf(sec, CLASS);
    if (dueDate(due)){
      var left = daysLeft(due), done = MY[SEC + ":bookmark"] && MY[SEC + ":blanks"];
      var dueTxt = "제출 마감 " + fmtDue(due) + "까지 · " + (done ? "냈어요 ✓" : left > 0 ? left + "일 남았어요" : left === 0 ? "오늘이 마감이에요" : "마감이 지났어요. 늦어도 꼭 내요");
      top.appendChild(el("p", { class: "due" + (done ? "" : left < 0 ? " over" : left <= 1 ? " soon" : ""), text: dueTxt }));
    }
    app.appendChild(top);

    var tabs = el("div", { class: "tabs", role: "tablist" }, []);
    [["bookmark", "나의 책갈피"], ["blanks", "내용 이해"], ["answers", "생각하기 (결석했을 때)"]].forEach(function(t){
      tabs.appendChild(el("button", { class: "tab" + (TAB === t[0] ? " on" : ""), role: "tab", text: t[1], onclick: function(){ TAB = t[0]; render(); } }));
    });
    app.appendChild(tabs);

    if (TAB === "blanks") renderBlanks();
    else if (TAB === "bookmark") renderBookmark();
    else renderAnswers();
  }

  function renderName(){
    var card = el("div", { class: "card" }, []);
    card.appendChild(el("h2", { text: "이름을 적어 주세요" }));
    card.appendChild(el("p", { class: "sub", text: "다음에도 똑같은 이름으로 들어와야 내가 쓴 글을 다시 볼 수 있어요." }));
    var inp = el("input", { type: "text", id: "sName", placeholder: "예) 김하늘", autocomplete: "off", maxlength: "40" });
    var errb = el("div", { class: "err" });
    // 반이 있는 책인데 반 링크로 들어오지 않았으면 반을 고르게 함
    var pick = BOOK.classes.length && !PARAMS.get("class") ? el("div", { class: "chips", "aria-label": "반" }, []) : null;
    function drawPick(){
      if (!pick) return;
      pick.innerHTML = "";
      BOOK.classes.forEach(function(c){ pick.appendChild(el("button", { class: "chip" + (c.id === CLASS ? " on" : ""), text: c.name, onclick: function(){ CLASS = c.id; drawPick(); } })); });
    }
    drawPick();
    if (NAME) inp.value = NAME;
    async function go(){
      var v = trimStr(inp.value);
      if (!v){ errb.textContent = "이름을 입력하세요."; return; }
      if (BOOK.classes.length && !CLASS){ errb.textContent = "내 반을 골라 주세요."; return; }
      if (CLASS) lsSet("reading-class:" + bookId, CLASS);
      NAME = v; lsSet("reading-name", v);
