<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청연국어 문법</title>
<!-- 청연 문법: 청연 되새김(test.html)과 같은 시험 틀을 쓰되 따로 둔 앱. 중등부·고등부 · O·X · 품사 쓰기 · 객관식 -->
<link rel="manifest" href="grammar.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청연 문법">
<meta name="theme-color" content="#1F499D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{
  --paper:#FBF8F1;--ink:#211F1B;--muted:#6E685C;--line:#E7DFCE;--card:#FFFFFF;
  --accent:#183263;--accent-soft:#E5E9F1;--green:#324840;--beige:#F1EEE4;
  --correct:#2E7D5B;--correct-soft:#E4F0EA;--wrong:#BF4230;--wrong-soft:#F7E7E3;--warn:#A86A12;--warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgba(33,31,27,.05),0 12px 32px -14px rgba(33,31,27,.16);--radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#191713;--ink:#ECE6D9;--muted:#A69D8B;--line:#38322A;--card:#242019;
  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;
  --correct:#71C9A0;--correct-soft:#1E2E27;--wrong:#E88C7A;--wrong-soft:#33221E;--warn:#E3B062;--warn-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --paper:#191713;--ink:#ECE6D9;--muted:#A69D8B;--line:#38322A;--card:#242019;
  --accent:#9DB4DE;--accent-soft:#1E2638;--green:#A9C4B6;--beige:#2A2720;
  --correct:#71C9A0;--correct-soft:#1E2E27;--wrong:#E88C7A;--wrong-soft:#33221E;--warn:#E3B062;--warn-soft:#33291A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gowun Dodum","Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.7;letter-spacing:-.01em;
  padding:clamp(1rem,4vw,3rem) 1rem 5rem}
.wrap{max-width:48rem;margin:0 auto}
.wrap.narrow{max-width:42rem}
a{color:var(--accent)}
h1,h2,h3{font-family:"Gowun Batang",serif;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.5rem);font-weight:800;line-height:1.15}
h2{font-size:1.35rem;font-weight:700;margin-bottom:.2rem}
h3{font-size:1.08rem;font-weight:700}
p{margin:.3rem 0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--accent);
  display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.eyebrow.gold{color:var(--green)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--muted);font-size:.95rem}
.small{font-size:.85rem}
header.page{margin-bottom:1.6rem}
.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:clamp(1.2rem,4vw,1.9rem);margin-bottom:1rem}
.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1rem}
.field>label{font-size:.9rem;font-weight:700}
.field .hint{font-size:.8rem;color:var(--muted);margin-top:-.2rem}
input[type=text],input[type=email],input[type=password],textarea,select{
  font-family:inherit;font-size:1rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
textarea{resize:vertical;min-height:4.2rem;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:2.5px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.btn{font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer;color:#fff;background:var(--accent);
  border:none;border-radius:10px;padding:.62rem 1.25rem;transition:opacity .15s,transform .06s;display:inline-block}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);opacity:1}
.btn.danger{background:transparent;color:var(--wrong);border:1.5px solid var(--line)}
.btn.small{padding:.4rem .8rem;font-size:.85rem}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--correct);border-color:var(--correct)}
.pill.no{color:var(--wrong);border-color:var(--wrong)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.chip{font-family:inherit;font-size:.85rem;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .8rem;
  background:var(--card);cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:.3rem;border-bottom:1.5px solid var(--line);margin:1.2rem 0 1rem;overflow-x:auto;overflow-y:hidden}
.tab{font-family:inherit;font-size:.95rem;font-weight:700;background:none;border:none;cursor:pointer;color:var(--muted);
  padding:.55rem .9rem;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.range{background:var(--accent-soft);border-radius:12px;padding:.75rem 1rem;font-size:.95rem;margin:.6rem 0 0}
.range b{color:var(--accent)}
.box-h{font-family:"Gowun Batang",serif;font-size:1.1rem;font-weight:800;display:inline-block;
  border-bottom:3px solid var(--green);padding-bottom:.1rem;margin-bottom:.6rem}
.story{font-size:1.02rem;line-height:2.1;white-space:pre-wrap}
.card:has(> .story){background:var(--beige)}
input[type=text].blank{font-family:inherit;line-height:1.4;vertical-align:baseline;font-size:.98rem;color:var(--accent);font-weight:600;background:var(--accent-soft);
  border:none;border-bottom:2px solid var(--accent);border-radius:6px 6px 0 0;padding:.05rem .35rem;margin:0 .15rem;
  width:auto;min-width:5.5em;max-width:100%}
.blank:focus{outline:2px solid var(--accent);outline-offset:1px}
.filled{display:inline;border-radius:6px;padding:.05rem .35rem;margin:0 .1rem;font-weight:600}
.filled.ok{background:var(--correct-soft);color:var(--correct)}
.filled.chk{background:var(--warn-soft);color:var(--warn)}
textarea.blank.long{display:block;width:100%;min-height:4.5rem;margin:.45rem 0;font-family:inherit;font-size:.98rem;line-height:1.6;
  color:var(--accent);font-weight:600;background:var(--accent-soft);border:none;border-bottom:2px solid var(--accent);border-radius:8px 8px 0 0;padding:.5rem .7rem}
textarea.blank.long.retry{border-bottom-color:var(--wrong);background:var(--wrong-soft);color:var(--ink)}
input[type=text].blank.retry{border-bottom-color:var(--wrong);background:var(--wrong-soft);color:var(--ink)}
.filled.none{background:var(--wrong-soft);color:var(--wrong)}
.key{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:.15rem}
.qnum{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.qtext{font-family:"Gowun Batang",serif;font-size:1.05rem;font-weight:700;line-height:1.55;margin:.15rem 0 .55rem}
.model{background:var(--beige);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.9rem;margin:.4rem 0 .7rem}
.model .lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--green);display:block}
.ans{display:grid;grid-template-columns:6.5rem 1fr;gap:.2rem .8rem;padding:.45rem 0;border-top:1px dashed var(--line);font-size:.95rem}
.ans .who{font-weight:700}
.ans .none{color:var(--muted);font-style:italic}
.feedback{margin-top:.6rem;border-left:3px solid var(--green);background:var(--beige);border-radius:0 10px 10px 0;padding:.55rem .85rem;font-size:.92rem}
.feedback .lab{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--green);display:block}
.blank-stat{border-top:1px solid var(--line);padding:.8rem 0}
.blank-stat .head{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.blank-stat .no{font-weight:800;color:var(--accent)}
.blank-stat .rate{margin-left:auto;font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums}
.blank-stat .rate.low{color:var(--wrong)}
.mini{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-top:.35rem;font-size:.88rem}
.mini span{border-radius:7px;padding:.1rem .45rem}
.mini .ok{background:var(--correct-soft);color:var(--correct)}
.mini .chk{background:var(--warn-soft);color:var(--warn)}
.mini .none{background:var(--wrong-soft);color:var(--wrong)}
.mini button.acc{font-family:inherit;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.05rem .4rem;margin-left:.25rem;cursor:pointer}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:.4rem 0}
.legend i{display:inline-block;width:.75rem;height:.75rem;border-radius:3px;vertical-align:-1px;margin-right:.25rem}
.topic{padding:.7rem 0;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:none}
.topic .t{font-size:1rem;font-weight:500}
.topic .by{font-size:.8rem;color:var(--muted)}
.quote{font-family:"Gowun Batang",serif;font-size:1rem;line-height:1.6;border-left:3px solid var(--line);padding:.1rem 0 .1rem .85rem;margin:.5rem 0 .2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.7rem;margin:1rem 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:.7rem .9rem}
.stat .n{font-family:"Gowun Batang",serif;font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.76rem;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:none}
.mark.ok{color:var(--correct);font-weight:700}
.mark.no{color:var(--wrong);font-weight:700}
.sec-edit{border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem;background:var(--paper)}
.box-edit{border:1px solid var(--line);border-radius:10px;padding:.9rem;margin:.7rem 0;background:var(--card)}
.q-edit{border:1px dashed var(--line);border-radius:10px;padding:.7rem;margin:.5rem 0}
.note{font-size:.88rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0}
.demo-bar{background:var(--beige);color:var(--ink);border:1px solid var(--green);border-radius:10px;padding:.55rem .9rem;font-size:.85rem;margin-bottom:1.2rem}
.err{color:var(--wrong);font-size:.88rem;margin-top:.4rem}
.empty{text-align:center;color:var(--muted);padding:2.5rem 1rem}
.foot{margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(2rem);background:var(--ink);
  color:var(--paper);padding:.6rem 1.1rem;border-radius:10px;font-size:.9rem;font-weight:600;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--wrong)}
.dlg-back{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:60}
.dlg{background:var(--card);color:var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem;max-width:26rem;width:100%}
.dlg p{margin:0 0 1.1rem;white-space:pre-wrap;font-size:1rem}
.dlg textarea{margin-bottom:1rem}
@media (max-width:520px){ .ans{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* ---- 청연 되새김 전용 ---- */
.item{border-top:1px solid var(--line);padding:.9rem 0}
.item:first-of-type{border-top:none}
.item .no{font-weight:800;color:var(--accent);margin-right:.35rem}
.item .q{font-size:1.02rem;line-height:1.65;white-space:pre-wrap}
mark.tg{background:var(--accent-soft);color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent);border-radius:4px;padding:0 .2rem}
.tagin{margin-top:.5rem;max-width:16rem}
.pgrid{display:flex;flex-wrap:wrap;gap:.5rem .6rem;margin-top:.55rem}
.pcell{display:flex;flex-direction:column;gap:.2rem;min-width:4.6rem}
.pcell .pw{font-weight:700;font-size:.95rem;text-align:center;border-bottom:2px solid var(--accent);color:var(--accent)}
.pcell input.pin{width:6.2rem;padding:.4rem .5rem;font-size:.9rem;text-align:center}
.pcell input.pin.bad{border-color:var(--wrong);background:var(--wrong-soft)}
.pcell .res{margin-top:0;text-align:center;font-size:.9rem}
.item.retry .tagin{border-color:var(--wrong);background:var(--wrong-soft)}
.trk{font-family:"Gowun Batang",serif;font-size:1.15rem;margin:1.4rem 0 .3rem;color:var(--accent)}
.mcrow{display:flex;flex-direction:column;gap:.4rem;margin-top:.55rem}
.mcbtn{font-family:inherit;font-size:.98rem;text-align:left;padding:.5rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.5}
.mcbtn .mcno{font-weight:700;margin-right:.45rem}
.mcbtn:hover{border-color:var(--accent);color:var(--accent)}
.mcbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.retry .mcbtn{border-color:var(--wrong)}
.retry .mcbtn.on{background:var(--wrong);border-color:var(--wrong);color:#fff}
.oxrow{display:flex;gap:.6rem;margin-top:.55rem}
.oxbtn{font-family:"Gowun Batang",serif;font-size:1.25rem;font-weight:700;width:3.2rem;height:2.6rem;border-radius:10px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.oxbtn:hover{border-color:var(--accent);color:var(--accent)}
.oxbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.oxbtn:disabled{cursor:default;opacity:.75}
.why{font-size:.85rem;font-weight:700;color:var(--wrong);margin:.35rem 0 .1rem}
.clockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:center;margin:-.4rem 0 .6rem;pointer-events:none}
.clock{display:inline-block;box-shadow:var(--shadow);font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:.3rem .9rem}
.clock.soon{background:var(--wrong-soft);color:var(--wrong)}
.retry .oxbtn{border-color:var(--wrong)}
.retry .oxbtn.on{background:var(--wrong);border-color:var(--wrong)}
.item textarea{margin-top:.5rem;min-height:3.2rem}
.item input.fixin{margin-top:.5rem}
.item.retry input.fixin{border-color:var(--wrong);background:var(--wrong-soft)}
.item.retry textarea{border-color:var(--wrong);background:var(--wrong-soft)}
.res{display:inline-block;margin-top:.45rem;border-radius:7px;padding:.15rem .55rem;font-weight:600}
.res.ok{background:var(--correct-soft);color:var(--correct)}
.res.no{background:var(--wrong-soft);color:var(--wrong)}
.explain{margin-top:.5rem;background:var(--beige);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:.55rem .8rem;font-size:.93rem}
.explain .lab{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--green);display:block}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:.35rem}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.low span{background:var(--wrong)}
.kwline{font-size:.8rem;color:var(--muted);margin-top:.2rem}
/* 학생 명단 · 입장 코드 · 내 숙제 (2026-10-22) */
.code{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.12em;font-size:1.05rem}
.hw{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.hw:hover{border-color:var(--accent,#1F499D)}
.classpick{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.classpick label{display:flex;align-items:center;gap:.35rem;font-weight:600}
td select{width:auto;padding:.25rem .5rem;font-size:.85rem}
</style>
</head>

<div class="wrap" id="wrap">
  <div id="demoBar"></div>
  <header class="page" id="pageHeader"></header>
  <main id="app"><div class="empty">불러오는 중…</div></main>
  <p class="foot" id="pageFoot"></p>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 작품 파일은 공개 저장소에 올리지 않음(private/ 는 이 컴퓨터에만). 인터넷 주소에서는 없어서 그냥 넘어감 -->
<script src="private/grammar-samples.js"></script>
<script>
/* ===== 설정 ===== */
var SUPABASE_URL = "https://yqwexzzdamcpqmsqkbcg.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_Y2bK2lw2T_Wysf9WWPuDbg_eA1ZX7R0";
var PARAMS = new URLSearchParams(location.search);
// ?demo=1 이거나 파일을 더블클릭해서 열면 → Supabase 없이 이 기기 안에서만 체험
var DEMO = PARAMS.has("demo") || location.protocol === "file:";
var app = document.getElementById("app");
var pageHeader = document.getElementById("pageHeader");
var pageFoot = document.getElementById("pageFoot");
function el(tag, attrs, kids){
  var n = document.createElement(tag); attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k === "value") n.value = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}
var _toastT;
function toast(msg, bad){
  var t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
  clearTimeout(_toastT); _toastT = setTimeout(function(){ t.className = ""; }, 3200);
}
// 브라우저 확인 창(confirm) 대신 쓰는 앱 안 확인 창 — confirm 이 막힌 브라우저에서도 동작
function askBox(msg, okText){
  return new Promise(function(resolve){
    var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });
    function done(v){ back.remove(); resolve(v); }
    var ok = el("button", { class: "btn", text: okText || "확인", onclick: function(){ done(true); } });
    back.appendChild(el("div", { class: "dlg" }, [ el("p", { text: msg }),
      el("div", { class: "row", style: "justify-content:flex-end" }, [
        el("button", { class: "btn ghost", text: "취소", onclick: function(){ done(false); } }), ok ]) ]));
    back.addEventListener("click", function(e){ if (e.target === back) done(false); });
    back.addEventListener("keydown", function(e){ if (e.key === "Escape") done(false); });
    document.body.appendChild(back); ok.focus();
  });
}
function showCopyBox(text){
  var back = el("div", { class: "dlg-back", role: "dialog", "aria-modal": "true" });

/* ----- 빈칸: 줄거리 안의 [정답] ----- */
//   [+정답] 처럼 앞에 + 를 붙이면 문장으로 쓰는 긴 빈칸 (학생 화면에 여러 줄 칸)
var BLANK_RE = /\[([^\]]+)\]/g;
var BLANK_SLOT = /\[\+?\]/g;     // 학생용 줄거리 속 빈칸 자리: [] 또는 [+]
function keysOf(text){ var out = [], m; BLANK_RE.lastIndex = 0; while ((m = BLANK_RE.exec(text || ""))) out.push(m[1].replace(/^\+/, "")); return out; }
function stripKeys(text){ return String(text || "").replace(BLANK_RE, function(_m, k){ return k.charAt(0) === "+" ? "[+]" : "[]"; }); }
function sectionKeys(sec){ var k = []; ((sec && sec.boxes) || []).forEach(function(b){ k = k.concat(keysOf(b.text)); }); return k; }
function sectionQuestions(sec){ var q = []; ((sec && sec.boxes) || []).forEach(function(b){ q = q.concat(b.questions || []); }); return q; }
function blankCount(sec){ // 학생용(정답이 [] 로 바뀐) 줄거리에서 세기
  var n = 0; ((sec && sec.boxes) || []).forEach(function(b){ n += (String(b.text || "").match(BLANK_SLOT) || []).length; }); return n;
}
function norm(s){ return String(s || "").replace(/[\s.,·…‘’“”'"!?~()\-]/g, ""); }
// 빈칸 정답 형식: [정답] · [정답|다른 정답] · [정답@핵심어,핵심어·바꿔쓸말]
//   @ 뒤 핵심어: 쉼표(,)로 나눈 말은 모두 들어가야 하고, 가운뎃점(·)으로 나눈 말은 하나만 있으면 됨
//   (어미·시제·조사·띄어쓰기는 상관없이 책 내용이 맞는지만 봄)
// 결과: "ok" 맞음 · "chk" 다시 쓰기 · "none" 안 씀    — reading.sql 의 blank_ok 와 같은 규칙
function grade(ans, key){
  var a = norm(ans);
  if (!a) return "none";
  key = String(key || "");
  var at = key.indexOf("@");
  if (at !== -1){
    var groups = key.slice(at + 1).split(",");
    var all = groups.every(function(g){
      return g.split("·").some(function(alt){ alt = norm(alt); return alt && a.indexOf(alt) !== -1; });
    });
    return all ? "ok" : "chk";
  }
  var hit = key.split("|").some(function(k){
    k = norm(k); if (!k) return false;
    return a === k || a.indexOf(k) !== -1 || (k.indexOf(a) !== -1 && a.length >= Math.ceil(k.length * 0.6));
  });
  return hit ? "ok" : "chk";
}
// 선생님이 "인정"한 답(accept: { 빈칸번호: 정규화한 답 })이면 맞음
function gradeA(ans, key, accept, i){
  var a = norm(ans);
  if (a && accept && accept[i] === a) return "ok";
  return grade(ans, key);
}
function displayKey(k){ return String(k).split("@")[0].split("|")[0]; }

/* ===== 되새김 도우미 ===== */
// 모든 part 의 문항을 순서대로 펼친 목록: [{ n, kind, part, i, item }]
function flatItems(parts){
  var out = [];
  (parts || []).forEach(function(p, pi){ (p.items || []).forEach(function(it, i){ out.push({ n: out.length, kind: p.type, part: pi, i: i, item: it }); }); });
  return out;
}
// 한 문항 채점 (reading.sql / test.sql 의 test_item_ok 와 같은 규칙)
//   O·X 답은 "O" 또는 "X||고친 문장". X 문항은 X를 고르고 고친 문장의 핵심어(fkw)까지 맞아야 맞음
function splitOX(ans){ var s = String(ans == null ? "" : ans), i = s.indexOf("||"); return { c: trimStr(i < 0 ? s : s.slice(0, i)).toUpperCase(), fix: i < 0 ? "" : s.slice(i + 2) }; }
// 문장 분석: 답은 "명사,조사,…" (낱말 순서대로 쉼표로 이음). 낱말마다 맞고 틀림 [true,false,…] (test.sql 의 test_parse_marks 와 같음)
//   item.w = 낱말 목록(학생 화면), item.a = 낱말마다 정답(| 로 여러 개 인정)
function parseMarks(item, ans){
  var a = Array.isArray(item.a) ? item.a : [], got = String(ans == null ? "" : ans).split(",");
  return a.map(function(av, i){ var g = norm(got[i] || ""); return !!g && String(av).split("|").some(function(k){ return norm(k) === g; }); });
}
function itemOk(kind, item, ans, accept, n){
  // 선생님이 ‘인정’한 답(accept[문항번호] = norm(답))이면 맞음
  if (kind === "parse"){ var pm = parseMarks(item, ans), ap = norm(ans); if (ap && accept && accept[n] === ap) return true; return pm.length > 0 && pm.every(Boolean); }   // 품사 분석: 모든 낱말의 품사가 맞아야 맞음
  if (kind === "tag"){ var tx = norm(ans); if (tx && accept && accept[n] === tx) return true; return !!tx && String(item.a || "").split("|").some(function(k){ return norm(k) === tx; }); }   // 품사 쓰기: 정답(|로 여러 개)과 통째로 같아야 맞음
  if (kind === "mc") return !!trimStr(ans) && trimStr(ans) === trimStr(item.a);   // 객관식: 고른 보기 번호 "1"~"5"
  if (kind === "ox"){
    var p = splitOX(ans), a = trimStr(item.a).toUpperCase();
    if (!p.c || p.c !== a) return false;
    if (a === "X" && trimStr(item.fkw)) return gradeA(p.fix, "@" + item.fkw, accept, n) === "ok";
    return true;
  }
  return gradeA(ans, "@" + (item.kw || ""), accept, n) === "ok";
}
// 틀린 까닭 (test.sql 의 test_item_why 와 같음): null 맞음 · none 안 풂 · ox O·X를 잘못 고름 · fix 고쳐 쓴 부분이 틀림 · write 풀이가 틀림
function itemWhy(kind, item, ans, accept, n){
  if (itemOk(kind, item, ans, accept, n)) return null;
  if (kind === "parse") return norm(String(ans == null ? "" : ans).replace(/,/g, "")) ? "parse" : "none";
  if (kind === "tag") return norm(ans) ? "tag" : "none";
  if (kind === "mc") return trimStr(ans) ? "mc" : "none";
  if (kind === "ox"){ var p = splitOX(ans); return !p.c ? "none" : p.c !== trimStr(item.a).toUpperCase() ? "ox" : "fix"; }
  return norm(ans) ? "write" : "none";
}
var WHY_TEXT = { none: "안 풀었어요", parse: "빨간 낱말의 품사를 다시 생각해 보세요", tag: "품사를 다시 생각해 보세요", mc: "보기를 다시 골라 보세요", ox: "O·X를 잘못 골랐어요", fix: "O·X는 맞았어요. 고쳐 쓴 부분이 틀렸어요", write: "풀이를 다시 생각해 보세요" };
var RETRY_MIN = 10;   // 틀린 문제 다시 풀기 시간 (분) — test.sql 의 test_retry_minutes 와 같게
function oxText(ans){ var p = splitOX(ans); return p.c ? p.c + (p.c === "X" && trimStr(p.fix) ? " — " + trimStr(p.fix) : "") : "안 고름"; }
function partLabel(kind){ return kind === "ox" ? "O·X" : kind === "mc" ? "객관식" : kind === "tag" ? "품사 쓰기" : kind === "parse" ? "품사 분석" : "현대어 풀이"; }
// 문제 글 안의 [낱말]은 표시(밑줄 대신)해서 보여 줌: "동생이 [새] 신발을 샀다."
function qNode(text){
  var span = el("span", {}, []), re = /\[([^\]]+)\]/g, last = 0, m, s = String(text == null ? "" : text);
  while ((m = re.exec(s))){ if (m.index > last) span.appendChild(document.createTextNode(s.slice(last, m.index))); span.appendChild(el("mark", { class: "tg", text: m[1] })); last = m.index + m[0].length; }
  if (last < s.length) span.appendChild(document.createTextNode(s.slice(last)));
  return span;
}

  function nameFor(tok, id){ var s = who(tok), t = test(id); if (!openFor(t, s)) throw new Error("선생님이 아직 열지 않은 문제입니다."); return s.name; }
  function className(id){ var c = S.classes.find(function(x){ return x.id === id; }); return c ? c.name : ""; }
  function newCode(){
    for (var i = 0; i < 500; i++){
      var c = String(1000 + Math.floor(Math.random() * 9000));
      if (/^(.)\1{3}$/.test(c) || "0123456789".indexOf(c) !== -1 || "9876543210".indexOf(c) !== -1) continue;
      if (!S.students.some(function(s){ return s.code === c; })) return c;
    }
    throw new Error("입장 코드를 더 만들 수 없어요.");
  }
  function status(id, name){
    var e = entry(id, name); if (!e) return { stage: 0 };
    var items = flatItems(test(id).parts), fin = e.data.third || e.data.second || e.data.first || [];
    var marks = items.map(function(x){ return itemOk(x.kind, x.item, fin[x.n], e.data.accept, x.n); });
    var why = items.map(function(x){ return itemWhy(x.kind, x.item, fin[x.n], e.data.accept, x.n); });
    var stage = (e.data.third || marks.every(Boolean)) ? 2 : 1;
    var retry = e.data.second ? 2 : 1, start = (e.data.start || {})[retry];
    return { stage: stage, first: e.data.first, second: e.data.second || null, third: e.data.third || null, marks: marks, why: why,
      retry: retry, late: e.data.late || {}, limit_min: RETRY_MIN, server_now: now(),
      deadline: stage === 1 && start ? new Date(new Date(start).getTime() + RETRY_MIN * 60000).toISOString() : null,
      wm: items.map(function(x){ return x.kind === "parse" ? parseMarks(x.item, fin[x.n]) : null; }),
      keys: stage === 2 ? items.map(function(x){ return x.kind === "parse" ? { a: x.item.a.map(function(v){ return String(v).split("|")[0]; }), exp: x.item.exp } : x.kind === "tag" ? { a: String(x.item.a).split("|")[0], exp: x.item.exp } : x.kind === "mc" ? { a: x.item.a, exp: x.item.exp } : x.kind === "ox" ? { a: x.item.a, exp: x.item.exp, fix: x.item.fix || "" } : { model: x.item.model, point: x.item.point }; }) : null };
  }
  var listeners = [];
  function notify(){ listeners.forEach(function(f){ f(); }); }
  window.addEventListener("storage", function(ev){ if (ev.key === KEY){ S = lsGet(KEY) || S; notify(); } });
  return {
    getUser: async function(){ return USER; }, onAuth: function(){}, signIn: async function(){},
    signOut: async function(){ if (await askBox("체험 데이터를 처음 상태로 되돌릴까요?", "되돌리기")){ lsDel(KEY); lsDel("cy-student-demo"); location.reload(); } },
    listTests: async function(){ return clone(S.tests).sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; }); },
    createTest: async function(_u, t){ var n = Object.assign(clone(t), { id: uid(), app: "grammar", owner: USER.id, is_open: true, class_ids: [], created_at: now() }); S.tests.push(n); save(); return clone(n); },
    getTest: async function(id){ return clone(test(id)); },
    updateTest: async function(id, patch){ Object.assign(test(id), clone(patch)); save(); },
    deleteTest: async function(id){ S.tests = S.tests.filter(function(t){ return t.id !== id; }); S.entries = S.entries.filter(function(e){ return e.test_id !== id; }); save(); },
    listEntries: async function(id){ return clone(S.entries.filter(function(e){ return e.test_id === id; })); },
    deleteEntry: async function(id){ S.entries = S.entries.filter(function(e){ return e.id !== id; }); save(); },
    setAccept: async function(id, accept){ var e = S.entries.find(function(x){ return x.id === id; }); if (e){ e.data.accept = clone(accept); save(); } },
    // 학생 명단
    listClasses: async function(){ return clone(S.classes); },
    addClass: async function(name){ var c = { id: uid(), name: name, created_at: now() }; S.classes.push(c); save(); return clone(c); },
    renameClass: async function(id, name){ S.classes.forEach(function(c){ if (c.id === id) c.name = name; }); save(); },
    deleteClass: async function(id){ S.classes = S.classes.filter(function(c){ return c.id !== id; }); S.students.forEach(function(s){ if (s.class_id === id) s.class_id = null; }); save(); },
    listStudents: async function(){ return clone(S.students).sort(function(a, b){ return a.name.localeCompare(b.name, "ko"); }); },
    addStudent: async function(name, classId){
      name = trimStr(name).replace(/\s+/g, " ");
      if (S.students.some(function(s){ return s.name === name; })) throw new Error("‘" + name + "’ 학생이 이미 있어요. 이름 뒤에 글자를 붙여 구별해 주세요 (예: " + name + "B).");
      var s = { id: uid(), name: name, code: newCode(), class_id: classId || null }; S.students.push(s); save(); return clone(s);
    },
    updateStudent: async function(id, patch){ S.students.forEach(function(s){ if (s.id === id){ if ("class_id" in patch) s.class_id = patch.class_id; if (patch.name) s.name = patch.name; } }); save(); },
    deleteStudent: async function(id){ S.students = S.students.filter(function(s){ return s.id !== id; }); Object.keys(S.sessions).forEach(function(k){ if (S.sessions[k] === id) delete S.sessions[k]; }); save(); },
    resetCode: async function(id){ var c = newCode(); S.students.forEach(function(s){ if (s.id === id) s.code = c; }); Object.keys(S.sessions).forEach(function(k){ if (S.sessions[k] === id) delete S.sessions[k]; }); save(); return c; },
    // 학생
    login: async function(name, code){
      var key = String(name || "").replace(/\s/g, "");
      if (!key) throw new Error("이름을 입력하세요.");
      var s = S.students.find(function(x){ return x.name.replace(/\s/g, "") === key && x.code === trimStr(code); });
      if (!s) throw new Error("이름이나 입장 코드가 맞지 않아요.");
      var tok = uid(); S.sessions[tok] = s.id; save();
      return { token: tok, name: s.name, class_name: className(s.class_id) };
    },
    logout: async function(tok){ delete S.sessions[tok]; save(); },
    myTests: async function(tok){
      var s = who(tok);
      return { name: s.name, class_name: className(s.class_id),
        tests: S.tests.filter(function(t){ return openFor(t, s) && t.app === "grammar"; }).sort(function(a, b){ return a.created_at < b.created_at ? 1 : -1; })
          .map(function(t){ return { id: t.id, title: t.title, work: t.work, author: t.author, series: t.series, track: t.track || "", stage: status(t.id, s.name).stage }; }) };
    },
    publicTest: async function(tok, id){
      nameFor(tok, id); var t = test(id);
      return { title: t.title, work: t.work, author: t.author, series: t.series,
        parts: t.parts.map(function(p){ return { type: p.type, title: p.title, guide: p.guide, items: p.items.map(function(it){ var o = { q: it.q }; if (it.c) o.c = it.c; if (it.w) o.w = it.w; return o; }) }; }) };
    },
    status: async function(tok, id){ return status(id, nameFor(tok, id)); },
    submit: async function(tok, id, answers){
      var name = nameFor(tok, id), t = test(id);
      var e = entry(id, name), items = flatItems(t.parts);
      if (!e) S.entries.push({ id: uid(), test_id: id, student_name: name, data: { first: answers.slice() }, created_at: now(), updated_at: now() });
      else {
        if (e.data.third) throw new Error("이미 세 번 제출했어요.");
        var retry = e.data.second ? 2 : 1, prev = e.data.second || e.data.first || [], start = (e.data.start || {})[retry];
        var late = !!start && Date.now() > new Date(start).getTime() + (RETRY_MIN + 1) * 60000;   // 시간을 넘기면 새 답은 받지 않음
        e.data[e.data.second ? "third" : "second"] = items.map(function(x){ var f = prev[x.n] || ""; return (late || itemOk(x.kind, x.item, f, e.data.accept, x.n)) ? f : (answers[x.n] || ""); });
        if (late){ e.data.late = e.data.late || {}; e.data.late[retry] = true; }
        e.updated_at = now();
      }
      save(); notify(); return status(id, name);
    },
    startRetry: async function(tok, id){
      var name = nameFor(tok, id), e = entry(id, name);
      if (e && !e.data.third){ var r = e.data.second ? 2 : 1; e.data.start = e.data.start || {}; if (!e.data.start[r]){ e.data.start[r] = now(); save(); } }
      return status(id, name);
    },
    subscribe: function(_id, cb){ listeners.push(cb); return function(){ listeners = listeners.filter(function(f){ return f !== cb; }); }; }
  };
}

  function setHeader(eyebrow, title, sub){

  function route(){

    if (id) openTest(id); else renderHome();

  function renderLogin(){
    setHeader("청연국어", "청연 문법", "선생님께 받은 입장 코드로 들어와요.");
    app.innerHTML = "";
    var card = el("div", { class: "card" }, [ el("h2", { text: "들어오기" }) ]);
    var nm = el("input", { type: "text", placeholder: "이름 (예: 김하늘)", autocomplete: "off", maxlength: "30", "aria-label": "이름" });
    var cd = el("input", { type: "text", inputmode: "numeric", pattern: "[0-9]*", placeholder: "입장 코드 4자리", autocomplete: "off", maxlength: "4", "aria-label": "입장 코드", class: "code" });
    var errb = el("div", { class: "err" }), btn = el("button", { class: "btn", text: "들어가기" });
    async function go(){
      errb.textContent = "";

      if (!n){ errb.textContent = "이름을 입력하세요."; nm.focus(); return; }
      if (c.length !== 4){ errb.textContent = "입장 코드 4자리를 입력하세요."; cd.focus(); return; }
      btn.disabled = true;
      try { SES = await api.login(n, c); lsSet(SKEY, SES); route(); }
      catch(e){ errb.textContent = e.message; btn.disabled = false; }
    }
    btn.addEventListener("click", go);
    nm.addEventListener("keydown", function(e){ if (e.key === "Enter") cd.focus(); });
    cd.addEventListener("keydown", function(e){ if (e.key === "Enter") go(); });
    card.appendChild(el("div", { class: "field", style: "margin-top:1rem" }, [ nm ]));
    card.appendChild(el("div", { class: "field" }, [ cd ]));
    card.appendChild(btn); card.appendChild(errb);
    card.appendChild(el("p", { class: "sub small", style: "margin-top:.8rem", text: "한 번 들어오면 이 휴대폰이 기억해요. 코드를 잊어버리면 선생님께 물어보세요." }));
    app.appendChild(card); nm.focus();
  }

  async function renderHome(){
    setHeader("청연국어", "청연 문법", "내 숙제");
    app.innerHTML = '<div class="empty">불러오는 중…</div>';
    var R; try { R = await api.myTests(SES.token); } catch(e){ if (lost(e)) return; app.innerHTML = ""; app.appendChild(el("div", { class: "err", text: e.message })); return; }
    app.innerHTML = "";
    app.appendChild(el("div", { class: "card spread" }, [
      el("div", {}, [ el("h2", { text: R.name + " 학생" }), R.class_name ? el("div", { class: "sub small", text: R.class_name }) : null ]),
      el("button", { class: "btn ghost small", text: "나가기", onclick: async function(){
        if (!(await askBox("나갈까요? 다음에 들어올 때 입장 코드를 다시 넣어야 해요.", "나가기"))) return;

    if (!R.tests.length){ app.appendChild(el("div", { class: "empty", text: "지금 열린 숙제가 없어요." })); return; }
    var LAB = [ ["no", "아직 안 풂", "풀기"], ["", "틀린 문제 다시 풀기", "이어서 풀기"], ["ok", "끝", "정답·해설 보기"] ];
    var lastTrack = null;   // 중등부 → 고등부 순으로 묶어 보여 줌
    R.tests.slice().sort(function(a, b){ var ta = a.track === "고등부" ? 1 : 0, tb = b.track === "고등부" ? 1 : 0; return ta - tb; }).forEach(function(t){

        el("div", { class: "sub small", text: [t.series, t.author].filter(Boolean).join(" · ") }),
        el("div", { class: "sub small", style: "margin-top:.4rem;font-weight:700", text: L[2] + " →" }) ]));
    });
  }

  async function openTest(id){
    testId = id;
    app.innerHTML = '<div class="empty">불러오는 중…</div>';
    try { T = await api.publicTest(SES.token, id); }

      if (lost(e)) return;
      app.innerHTML = ""; app.appendChild(el("div", { class: "empty", text: e.message }));

  function render(){
    app.innerHTML = "";
    app.appendChild(el("div", { class: "card spread" }, [ el("h2", { text: NAME + " 학생" }),
      el("button", { class: "btn ghost small", text: "← 내 숙제", onclick: function(){ location.hash = ""; } }) ]));

  // 처음 풀기 → 맞고 틀림 + 틀린 까닭 → 틀린 문제만 다시 풀기(두 번까지, 한 번에 RETRY_MIN분, 시간이 끝나면 쓴 데까지 자동 제출) → 정답·해설
  var TIMER = null;
  async function renderTest(){
    if (TIMER){ clearInterval(TIMER); TIMER = null; }
    var holder = el("div", {}, [ el("div", { class: "empty", text: "불러오는 중…" }) ]);
    app.appendChild(holder);
    var ST;
    try { ST = await api.status(SES.token, testId); } catch(e){ if (lost(e)) return; holder.innerHTML = ""; holder.appendChild(el("div", { class: "err", text: e.message })); return; }
    holder.innerHTML = "";
    var items = flatItems(T.parts), N = items.length;
    var stage = ST.stage || 0, first = ST.first || [], fin = ST.third || ST.second || first, marks = ST.marks || [], why = ST.why || [];
    var retry = ST.retry || 1, limit = ST.limit_min || RETRY_MIN;
    var skew = ST.server_now ? Date.now() - new Date(ST.server_now).getTime() : 0;      // 서버 시계와 기기 시계 차이
    var deadline = ST.deadline ? new Date(ST.deadline).getTime() + skew : null;
    var started = stage === 1 && !!deadline;
    var dkey = "test-draft:" + testId + ":" + NAME + ":" + stage + ":" + retry;
    var cur = lsGet(dkey);
    if (!cur){
      cur = stage === 1 ? fin.slice() : [];
      if (stage === 1) items.forEach(function(x){ if ((x.kind === "mc" || x.kind === "tag") && !marks[x.n]) cur[x.n] = ""; });   // 틀린 객관식·품사 쓰기는 새로 고르고 쓰게
    }
    function saveDraft(){ lsSet(dkey, cur); }
    var editable = items.filter(function(x){ return stage === 0 || (started && !marks[x.n]); });
    var okN = marks.filter(Boolean).length, wrongN = N - okN;

    // 안내
    var head = el("div", { class: "card" }, []);
    var clock = null;
    if (stage === 0) head.appendChild(el("p", { class: "note", style: "margin:0", text: "모두 풀고 제출하면 맞았는지만 알려 줘요. 틀린 문제는 두 번까지 다시 풀 수 있어요. 다시 풀 때는 한 번에 " + limit + "분 안에 내야 하고, 두 번 다 틀리면 그때 정답과 해설이 나와요." }));
    else if (stage === 1){
      head.appendChild(el("h3", { text: N + "문제 중 " + okN + "문제 맞았어요" }));
      var cnts = {}; why.forEach(function(w){ if (w) cnts[w] = (cnts[w] || 0) + 1; });
      var parts = [["tag", "품사가 틀림"], ["mc", "보기를 잘못 고름"], ["ox", "O·X를 잘못 고름"], ["fix", "고쳐 쓴 부분이 틀림"], ["write", "풀이가 틀림"], ["none", "안 풂"]]
        .filter(function(p){ return cnts[p[0]]; }).map(function(p){ return p[1] + " " + cnts[p[0]]; });
      if (parts.length) head.appendChild(el("p", { class: "sub", text: "틀린 문제 " + wrongN + "개 · " + parts.join(" · ") }));
      if (!started){
        head.appendChild(el("p", { class: "note", text: "틀린 문제를 다시 풀 수 있어요 (" + retry + "번째 / 두 번까지). 시작하면 " + limit + "분 안에 내야 해요. 시간이 끝나면 그때까지 쓴 답이 저절로 제출돼요." }));
        var sbtn = el("button", { class: "btn", text: retry + "번째 다시 풀기 시작 (" + limit + "분)" });
        sbtn.addEventListener("click", async function(){
          sbtn.disabled = true;
          try { await api.startRetry(SES.token, testId); render(); window.scrollTo(0, 0); }
          catch(e){ sbtn.disabled = false; toast(e.message, true); }
        });
        head.appendChild(sbtn);
        holder.appendChild(head);
        return;                                   // 시작 전에는 문제를 보여 주지 않음 (시간 안에 스스로 풀게)
      }
      head.appendChild(el("p", { class: "sub", text: retry + "번째 다시 풀기 · 빨간 문제 " + wrongN + "개를 고쳐 내요." + (retry === 2 ? " 마지막 기회예요." : "") }));
      clock = el("div", { class: "clock", role: "timer", "aria-live": "off" });
    } else {
      head.appendChild(el("h3", { text: okN === N && !ST.second ? "처음부터 모두 맞았어요!" : "끝 · " + N + "문제 중 " + okN + "문제 맞음" }));
      head.appendChild(el("p", { class: "sub", text: "아래에서 정답과 해설을 꼭 읽어 보세요." }));
      if (ST.late && Object.keys(ST.late).length) head.appendChild(el("p", { class: "sub small", text: "시간이 지나 자동으로 제출된 적이 있어요." }));
    }
    holder.appendChild(head);
    if (clock) holder.appendChild(el("div", { class: "clockbar" }, [ clock ]));

    T.parts.forEach(function(p, pi){
      var card = el("div", { class: "card" }, [ el("div", { class: "box-h", text: p.title || partLabel(p.type) }) ]);
      if (p.guide) card.appendChild(el("p", { class: "sub small", text: p.guide }));
      items.filter(function(x){ return x.part === pi; }).forEach(function(x){
        var canEdit = stage === 0 || (started && !marks[x.n]);
        var w = why[x.n];

            fixIn.value = pc.fix; fixIn.hidden = pc.c !== "X";

            fixIn.addEventListener("input", store);
            ["O", "X"].forEach(function(v){
              var b = el("button", { class: "oxbtn" + (pc.c === v ? " on" : ""), text: v, "aria-pressed": pc.c === v ? "true" : "false" });
              if (lockX) b.disabled = true;
              b.addEventListener("click", function(){
                cur[x.n] = v === "X" ? "X||" + fixIn.value : "O";
                fixIn.hidden = v !== "X"; if (v === "X") fixIn.focus();
                Array.prototype.forEach.call(row.children, function(c){ c.classList.toggle("on", c.textContent === v); c.setAttribute("aria-pressed", c.textContent === v ? "true" : "false"); });

            : x.kind === "tag"

            : el("div", { class: "explain" }, [ el("span", { class: "lab", text: "풀이" }), textBlock(k.model || ""), k.point ? el("div", { class: "kwline", text: "핵심: " + k.point }) : null ]));
        }
        card.appendChild(box);
      });
      holder.appendChild(card);
    });
    if (stage === 2) return;

    var bar = el("div", { class: "card" }, []);
    var cnt = el("p", { class: "sub" });
    function count(){ cnt.textContent = (stage === 0 ? "" : "다시 풀 문제 ") + editable.length + "문제 중 " + editable.filter(function(x){ return trimStr(splitOX(cur[x.n]).c === "X" && x.kind === "ox" ? splitOX(cur[x.n]).fix : cur[x.n]); }).length + "문제를 풀었어요."; }

    var msg = el("div", { class: "err" });
    var btn = el("button", { class: "btn", text: stage === 0 ? "제출하기" : retry === 2 ? "마지막으로 다시 제출" : "고쳐서 다시 제출" });
    var sending = false;
    async function send(auto){
      if (sending) return;
      msg.textContent = "";
      var answers = items.map(function(x){ return (stage === 1 && marks[x.n]) ? (fin[x.n] || "") : trimStr(cur[x.n]); });
      if (!auto){
        var empty = editable.filter(function(x){ return !trimStr(cur[x.n]); }).length;
        var ask = stage === 0 ? (empty ? "안 푼 문제가 " + empty + "개 있어요. 그래도 제출할까요?" : "제출할까요?")
          : retry === 1 ? "고쳐서 낼까요? 그래도 틀린 문제는 한 번 더 다시 풀 수 있어요."
          : "마지막이에요. 다시 내면 더 고칠 수 없고, 정답과 해설이 나와요. 제출할까요?";
        if (!(await askBox(ask, stage === 0 ? "제출하기" : "다시 제출"))) return;
      }
      sending = true; btn.disabled = true;
      if (TIMER){ clearInterval(TIMER); TIMER = null; }
      try { await api.submit(SES.token, testId, answers); lsDel(dkey); toast(auto ? "시간이 다 되어 쓴 데까지 제출했어요" : stage === 0 ? "제출했어요" : "다시 냈어요"); render(); window.scrollTo(0, 0); }
      catch(e){ sending = false; btn.disabled = false; msg.textContent = e.message; }
    }
    btn.addEventListener("click", function(){ send(false); });
    bar.appendChild(cnt); bar.appendChild(btn); bar.appendChild(msg);
    holder.appendChild(bar);

    // 남은 시간: 0이 되면 쓴 데까지 자동 제출
    if (started){
      var tick = function(){
        var left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        clock.textContent = "남은 시간 " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
        clock.classList.toggle("soon", left <= 60);
        if (left <= 0) send(true);
      };
      tick();
      if (!sending) TIMER = setInterval(tick, 1000);
    }
  }
}

        var box = el("div", { class: "item" }, [ el("div", { class: "q" }, [ el("span", { class: "no", text: (x.i + 1) + "." }), qNode(x.item.q) ]) ]);
        if (kind === "mc") box.appendChild(el("div", { class: "kwline", text: (x.item.c || []).map(function(c, ci){ return CIRCLED[ci] + " " + c; }).join("   ") }));
        box.appendChild(el("div", { class: "kwline", text: kind === "parse" ? "정답 " + (x.item.w || []).map(function(wd, wi){ return wd + "(" + ((x.item.a || [])[wi] || "") + ")"; }).join(" ") : kind === "tag" ? "정답 " + x.item.a : kind === "mc" ? "정답 " + mcText(x.item, x.item.a) : kind === "ox" ? "정답 " + x.item.a + (x.item.fix ? "  ·  고친 예: " + x.item.fix + "  ·  핵심어: " + (x.item.fkw || "") : "") : "풀이: " + x.item.model + "  ·  핵심어: " + (x.item.kw || "") }));
        if (rate != null){
          box.appendChild(el("div", { class: "bar" + (rate < 60 ? " low" : "") }, [ el("span", { style: "width:" + rate + "%" }) ]));
          box.appendChild(el("div", { class: "kwline", text: "처음 " + okN + " / " + E.length + " 맞음" }));
        }
        // 품사 쓰기·품사 분석: 규칙으로는 틀린 답을 보여 주고, 선생님이 ‘인정’하면 맞음으로 (되새김의 인정과 같음)
        function acceptMini(){
          var mini = el("div", { class: "mini" }, []);
          E.forEach(function(e){
            var acc = e.data.accept || {}, latest = ans(e, "final")[x.n];
            if (itemOk(x.kind, x.item, latest, {}, x.n) || !norm(latest)) return;       // 규칙으로 맞거나 안 쓴 답은 제외
            var accepted = acc[x.n] === norm(latest), label;
            if (x.kind === "parse"){
              var pmk = parseMarks(x.item, latest), got = String(latest || "").split(",");
              label = (x.item.w || []).map(function(wd, wi){ return pmk[wi] ? null : wd + "→" + (trimStr(got[wi]) || "안 씀"); }).filter(Boolean).join(", ");
            } else label = trimStr(latest);
            mini.appendChild(el("span", { style: "padding:0" }, [
              el("span", { class: accepted ? "ok" : "chk", text: e.student_name + ": " + label + (accepted ? " (인정)" : "") }),
              el("button", { class: "acc", text: accepted ? "인정 취소" : "인정", onclick: async function(){
                var next = clone(acc); if (accepted) delete next[x.n]; else next[x.n] = norm(latest);
                try { await api.setAccept(e.id, next); e.data.accept = next; draw(); } catch(err){ toast(err.message, true); }
              } }) ]));
          });
          return mini;
        }
        if (kind === "parse"){
          var wrongP = E.filter(function(e){ return !ok(e, x, "first"); }).map(function(e){
            var pmk = parseMarks(x.item, ans(e, "first")[x.n]), bads = (x.item.w || []).filter(function(_w, wi){ return !pmk[wi]; });
            return e.student_name + "(" + (bads.length ? bads.join("·") : "안 씀") + ")";
          });
          if (wrongP.length) box.appendChild(el("div", { class: "kwline", text: "처음에 틀린 학생(틀린 낱말): " + wrongP.join(", ") }));
          var mnP = acceptMini(); if (mnP.children.length) box.appendChild(mnP);
        } else if (kind === "tag"){
          var wrongT = E.filter(function(e){ return !ok(e, x, "first"); }).map(function(e){ return e.student_name + "(" + (trimStr(ans(e, "first")[x.n]) || "안 씀") + ")"; });
          if (wrongT.length) box.appendChild(el("div", { class: "kwline", text: "처음에 틀린 학생: " + wrongT.join(", ") }));
          var mnT = acceptMini(); if (mnT.children.length) box.appendChild(mnT);
        } else if (kind === "mc"){
          var wrongM = E.filter(function(e){ return !ok(e, x, "first"); }).map(function(e){ return e.student_name + "(" + mcText(x.item, ans(e, "first")[x.n]).split(" ")[0] + ")"; });
          if (wrongM.length) box.appendChild(el("div", { class: "kwline", text: "처음에 틀린 학생: " + wrongM.join(", ") }));
        } else if (kind === "ox"){
          var wrong = E.filter(function(e){ return !ok(e, x, "first"); }).map(function(e){ return e.student_name + "(" + oxText(ans(e, "first")[x.n]).split(" — ")[0] + ")"; });
          if (wrong.length) box.appendChild(el("div", { class: "kwline", text: "처음에 틀린 학생: " + wrong.join(", ") }));
          if (trimStr(x.item.a).toUpperCase() === "X" && trimStr(x.item.fkw)){
            // X를 고른 학생들의 고친 문장 + 인정
            var omini = el("div", { class: "mini" }, []);
            E.forEach(function(e){
              var acc = e.data.accept || {}, fin2 = ans(e, "final")[x.n], p = splitOX(fin2);
              if (p.c !== "X") return;
              var g = itemOk("ox", x.item, fin2, acc, x.n) ? "ok" : (trimStr(p.fix) ? "chk" : "none");
              var ruleOk = grade(p.fix, "@" + x.item.fkw) === "ok", accepted = !!norm(p.fix) && acc[x.n] === norm(p.fix);
              var kids = [ el("span", { class: g, text: e.student_name + ": " + (trimStr(p.fix) || "고친 문장 없음") + (accepted ? " (인정)" : "") }) ];
              if (!ruleOk && norm(p.fix)) kids.push(el("button", { class: "acc", text: accepted ? "인정 취소" : "인정", onclick: async function(){
                var next = clone(acc); if (accepted) delete next[x.n]; else next[x.n] = norm(p.fix);
                try { await api.setAccept(e.id, next); e.data.accept = next; draw(); } catch(err){ toast(err.message, true); }
              } }));
              omini.appendChild(el("span", { style: "padding:0" }, kids));
            });
            if (omini.children.length) box.appendChild(omini);
          }
        } else {
          var mini = el("div", { class: "mini" }, []);
          E.forEach(function(e){
            var acc = e.data.accept || {}, f = ans(e, "first")[x.n], s = e.data.second ? e.data.second[x.n] : null, s3 = e.data.third ? e.data.third[x.n] : null;
            var g1 = gradeA(f, "@" + x.item.kw, acc, x.n), retried = s != null && g1 !== "ok";
            var g2 = retried ? gradeA(s, "@" + x.item.kw, acc, x.n) : null, retried2 = retried && s3 != null && g2 !== "ok";
            var latest = retried2 ? s3 : retried ? s : f, ruleOk = grade(latest, "@" + x.item.kw) === "ok", accepted = !!norm(latest) && acc[x.n] === norm(latest);
            var kids = [ el("span", { class: g1, text: e.student_name + ": " + (trimStr(f) || "안 씀") + (!retried && accepted ? " (인정)" : "") }) ];
            if (retried) kids.push(el("span", { class: g2, text: "→ " + (trimStr(s) || "안 씀") + (!retried2 && accepted ? " (인정)" : "") }));
            if (retried2) kids.push(el("span", { class: gradeA(s3, "@" + x.item.kw, acc, x.n), text: "→ " + (trimStr(s3) || "안 씀") + (accepted ? " (인정)" : "") }));
            if (!ruleOk && norm(latest)) kids.push(el("button", { class: "acc", text: accepted ? "인정 취소" : "인정", onclick: async function(){
              var next = clone(acc); if (accepted) delete next[x.n]; else next[x.n] = norm(latest);
              try { await api.setAccept(e.id, next); e.data.accept = next; draw(); } catch(err){ toast(err.message, true); }
            } }));
            mini.appendChild(el("span", { style: "padding:0" }, kids));
          });
          if (E.length) box.appendChild(mini);
        }
        card.appendChild(box);
      });
      body.appendChild(card);
    }
  }
}
</script>
